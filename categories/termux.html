",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\nf:[\"$\",\"$1\",\"c\",{\"children\":[\"$L13\",null,[\"$\",\"$L14\",null,{\"children\":[\"$\",\"$15\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@16\"}]}]]}]\n10:[\"$\",\"$L17\",\"l\",{}]\n11:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L18\",null,{\"children\":\"$@19\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L1a\",null,{\"children\":[\"$\",\"$15\",null,{\"name\":\"Next.Metadata\",\"children\":\"$@1b\"}]}]}],null]}]\n"])</script><script>self.__next_f.push([1,"1c:I[9677,[\"500\",\"static/chunks/500-b84d19d842172eba.js\",\"666\",\"static/chunks/app/(blog)/categories/%5Bcategory%5D/page-b80736597d64b8e7.js\"],\"TaxonomyPageShell\"]\n1d:T1890,"])</script><script>self.__next_f.push([1,"# 안드로이드 태블릿에서 github page에 Next.js 프로젝트 배포하기\n\n[[toc]]\n\n## 들어가기 앞서\n\n이 문서는 안드로이드 태블릿에서 만든 Next.js 프로젝트를 Github에 배포하는 방법에 대해 설명하는 문서입니다.\n태블릿에 Node.js가 설치되어있고 Next.js 프로젝트를 구성하여 프로젝트를 실행해본 상태에서 진행합니다.\nGithub 계정은 [깃허브 공식 홈페이지](https://github.com)에서 만드실 수 있습니다.\n\n## github 저장소 생성\n\n### github.io 란?\n\nGitHub Pages는 **GitHub 저장소의 파일(HTML/CSS/JS 등)**을 그대로 웹사이트로 배포해주는 기능입니다.\n그중에서도 `github.io`는 GitHub Pages로 만들어지는 기본 도메인이고, 보통 아래 두 종류가 있어요.\n\n* **User/Organization 사이트**: `https://[계정명].github.io/`\n  → 저장소 이름이 **반드시** `[계정명].github.io` 여야 함\n* **Project 사이트**: `https://[계정명].github.io/[repo]/`\n  → 일반 저장소에서도 가능\n\n즉, 블로그나 포트폴리오를 “루트 도메인”으로 깔끔하게 쓰려면 **User 사이트 방식**이 가장 깔끔합니다.\n\n---\n\n### [계정명].github.io를 만들어보자\n\n아래 순서대로 하면 됩니다.\n\n#### 1) GitHub에서 새 저장소 만들기\n\n1. GitHub 로그인\n2. 우측 상단 **+** 버튼 → **New repository** 클릭\n3. Repository name에 아래처럼 입력\n\n   * **`[계정명].github.io`** (계정명과 정확히 일치해야 함)\n4. 공개 설정은 보통 **Public** 추천\n5. (선택) **Add a README file** 체크해제\n6. **Create repository** 클릭\n\n![image.png](/images/_posts/termux/deploy-nextjs-project-on-android/1767239979721-image.webp)\n![image.png](/images/_posts/termux/deploy-nextjs-project-on-android/1767240107810-image.webp)\n\n\n---\n\n#### 2) Next.js 프로젝트를 export 모드로 설정 하고 git remote 추가\n\n여기서는 **Next.js 프로젝트를 정적 사이트(export 모드)**로 설정한 뒤, GitHub Pages에서 제공하는\n`rxalloc.github.io` 저장소와 연결하는 과정을 진행합니다.\n\n---\n\n##### 2-1) Next.js를 export 모드로 설정하기\n\nGitHub Pages는 서버가 없는 **정적 호스팅**이기 때문에 Next.js를 반드시 export 모드로 설정해야 합니다.\n\n프로젝트 루트에 있는 `next.config.js` 또는 `next.config.mjs` 파일을 아래처럼 수정합니다.\n\n```js\n/** @type {import('next').NextConfig} */\nconst nextConfig = {\n  output: \"export\", // ✅ 정적 사이트로 빌드\n  images: {\n    unoptimized: true, // ✅ next/image 서버 최적화 비활성화 (필수)\n  },\n};\n\nmodule.exports = nextConfig;\n```\n\n\u003e [!WARNING] 경고\n\u003e `next/image`를 사용 중이라면 `images.unoptimized: true`가 없으면 빌드 또는 배포 단계에서 문제가 발생할 수 있습니다.\n\n---\n\n##### 2-2) 정적 빌드 결과 확인\n\n설정이 끝났다면 프로젝트를 빌드합니다.\n\n```bash\nnpm run build\n```\n\n빌드가 성공하면 프로젝트 루트에 `out/` 폴더가 생성됩니다.\n이 폴더 안의 파일들이 **GitHub Pages에 그대로 배포될 정적 결과물**입니다.\n\n---\n\n##### 2-3) Git 저장소 초기화\n\n아래 명령으로 초기화합니다.\n\n```bash\ngit init\ngit add .\ngit commit -m \"init\"\n```\n\n---\n\n##### 2-4) rxalloc.github.io 저장소를 remote로 추가\n\nGitHub에서 미리 생성해 둔 `rxalloc.github.io` 저장소와 연결합니다.\n\n```bash\ngit branch -M main\ngit remote add origin https://github.com/rxalloc/rxalloc.github.io.git\ngit push -u origin main\n```\n\n정상적으로 푸시되면 GitHub 저장소에 코드가 업로드됩니다.\n\n---\n\n#### 3) Git으로 커밋하고 푸시하기\n\n터미널에서 Next.js 폴더로 이동 후:\n\n```bash\ngit init\ngit add .\ngit commit -m \"init\"\ngit branch -M main\ngit remote add origin https://github.com/[계정명]/[계정명].github.io.git\ngit push -u origin main\n```\n\n정상적으로 프로젝트가 github에 올라갔다면 아래와 같이 해당 레포지토리 페이지에서 소스코드를 확인하실 수 있습니다.\n\n\n---\n\n#### 4) gh-pages를 사용해서 배포하기\n\n`gh-pages`는 **빌드 결과물(`out/`)만 별도 브랜치(`gh-pages`)로 배포**해주는 도구입니다.\n소스 코드와 배포 결과를 분리할 수 있어 **유지보수에 가장 깔끔한 방식**입니다.\n\n---\n\n##### 4-1) gh-pages 설치\n\n프로젝트 루트에서 아래 명령을 실행합니다.\n\n```bash\nnpm install --save-dev gh-pages\n```\n\n---\n\n##### 4-2) package.json 스크립트 추가\n\n`package.json`에 아래 스크립트를 추가합니다.\n\n```json\n{\n  \"scripts\": {\n    \"build\": \"next build\",\n    \"deploy\": \"gh-pages -d out\"\n  }\n}\n```\n\n\u003e [!note]\n\u003e 노트\n\u003e `-d out` : Next.js export 결과물 디렉터리\n\n---\n\n##### 4-4) 빌드 \u0026 배포 실행\n\n아래 명령 한 줄로 **빌드 + gh-pages 브랜치 배포**가 완료됩니다.\n\n```bash\nnpm run build\nnpm run deploy\n```\n\n정상 동작 시:\n\n* `gh-pages` 브랜치가 자동 생성됨\n* `out/` 폴더의 내용만 `gh-pages` 브랜치에 커밋됨\n\n![image.png](/images/_posts/termux/deploy-nextjs-project-on-android/1767356830636-image.webp)\n\n\n---\n\n##### 4-5) GitHub Pages 브랜치 설정\n\n1. GitHub 저장소 → **Settings**\n2. 좌측 메뉴 → **Pages**\n3. **Build and deployment**\n\n   * Source: **Deploy from a branch**\n   * Branch: **gh-pages** / **(root)**\n4. 저장\n\n![image.png](/images/_posts/termux/deploy-nextjs-project-on-android/1767357520519-image.webp)\n\n\n---\n\n##### 4-6) 접속 확인\n\n배포가 완료되면 아래 주소로 접속합니다.\n\n```text\nhttps://[계정명].github.io\n```\n\n정상이라면 `out/index.html` 기준의 사이트가 표시됩니다.\n\n[RxAlloc Blog](https://rxalloc.github.io)\n\n---\n\n##### 4-7) CSS파일이 제대로 불러오지 않는다면\n\n.nojekyll 파일을 추가해주어야합니다. \n아래의 이미지를 참고하여 .nokekyll 파일을 추가해주시면 됩니다.\n\n![image.png](/images/_posts/termux/deploy-nextjs-project-on-android/1767358013941-image.webp)\n\n\n---\n\n##### 참고\n\n* 이후 배포는 **`npm run deploy` 한 줄**이면 끝\n* 소스 브랜치(`main`)와 배포 브랜치(`gh-pages`)가 분리되어 히스토리가 깔끔함\n* GitHub Actions 없이도 안정적으로 사용 가능\n\n"])</script><script>self.__next_f.push([1,"1e:T12e9,"])</script><script>self.__next_f.push([1,"# 안드로이드 태블릿에서 Next.js 프로젝트 실행하기\n\n[[toc]]\n\n## 들어가기 앞서\n\n이 문서는 **안드로이드 태블릿에서 Termux + code-server(VS Code)** 환경을 구성한 상태를 전제로, 해당 환경에서 **Next.js 프로젝트를 생성하고 개발 서버를 실행하는 방법**을 설명합니다.\n\nPC가 아닌 태블릿 환경에서도 실제 웹 개발이 가능하다는 점을 확인하는 것이 목적입니다.\n\n---\n\n## 1. code-server 실행 및 터미널 열기\n\n먼저 code-server를 실행합니다.\n\n```bash\ncode-server --auth none --host 0.0.0.0 --port 8080\n```\n\ncode-server가 실행되면 VS Code Web 화면이 열립니다.\n\n터미널은 아래 단축키로 열 수 있습니다.\n\n\u003e **터미널 단축키**\n\u003e\n\u003e * `Ctrl + `` (백틱)\n\n단축키를 입력하면 아래와 같이 화면 하단에 터미널이 표시됩니다.\n\n![Screenshot\\_20251226\\_140457\\_Chrome Dev.jpg](/images/_posts/termux/run-nextjs-on-android/1766725513373-Screenshot_20251226_140457_ChromeDev.jpg)\n\n---\n\n## 2. Node.js 설치하기\n\nNext.js 실행을 위해 Node.js를 설치합니다.\n\n```bash\npkg install nodejs-lts\n```\n\nLTS(Long Term Support) 버전을 설치하는 것이 가장 안정적입니다.\n\n설치가 완료되면 아래와 같이 Node.js가 정상적으로 설치된 것을 확인할 수 있습니다.\n\n\u003e 예시) 작성 시점 기준 설치 버전: **Node.js 24.11.1**\n\n![Screenshot\\_20251226\\_140918\\_Chrome Dev.jpg](/images/_posts/termux/run-nextjs-on-android/1766725772046-Screenshot_20251226_140918_ChromeDev.jpg)\n\n---\n\n## 3. Next.js 프로젝트 생성\n\n웹 브라우저에서 **Next.js 공식 사이트**에 접속하면, 메인 화면에 프로젝트 생성 명령어가 안내되어 있습니다.\n\n```bash\nnpx create-next-app@latest\n```\n\n명령어를 실행하면 프로젝트 설정에 대한 질문이 순서대로 나타납니다.\n\n이번 예제에서는 **커스터마이징 설정**을 선택하였으며, 선택한 항목은 아래와 같습니다.\n\n```text\n프로젝트 이름은 무엇인가요? → my-app\nNext.js 권장 설정을 사용할까요? → 아니오\nTypeScript를 사용할까요? → 예\nReact Compiler(실험적 기능)를 사용할까요? → 아니오\nTailwind CSS를 사용할까요? → 예\n소스 코드를 src/ 디렉토리 안에 둘까요? → 예\nApp Router를 사용할까요? → 예\nimport 경로 별칭을 커스터마이즈할까요? (기본: @/) → 아니오\n```\n\n설정이 완료되면 Next.js 프로젝트가 자동으로 생성됩니다.\n\n![Screenshot\\_20251226\\_144341\\_Chrome Beta.jpg](/images/_posts/termux/run-nextjs-on-android/1766727856744-Screenshot_20251226_144341_ChromeBeta.jpg)\n\n![Screenshot\\_20251226\\_150240\\_Chrome Dev.jpg](/images/_posts/termux/run-nextjs-on-android/1766729020364-Screenshot_20251226_150240_ChromeDev.jpg)\n\n---\n\n## 4. Next.js 개발 서버 실행 (문제 해결 포함)\n\n생성된 프로젝트 디렉토리로 이동한 뒤 개발 서버를 실행합니다.\n\n```bash\ncd ~/workspace/my-app\nnpm run dev\n```\n\n일반적인 PC 환경이라면 개발 서버가 바로 실행되지만, **안드로이드 태블릿 환경에서는 아래와 같은 오류가 발생할 수 있습니다**.\n\n![Screenshot\\_20251226\\_150752\\_Chrome Dev.jpg](/images/_posts/termux/run-nextjs-on-android/1766729302449-Screenshot_20251226_150752_ChromeDev.jpg)\n\n### 오류 원인\n\nNext.js 최신 버전은 기본적으로 **Turbopack**을 사용합니다.\n\n그러나 Turbopack은 현재 **안드로이드(ARM) 기반 Termux 환경을 완전히 지원하지 않기 때문에** 개발 서버 실행 시 오류가 발생합니다.\n\n---\n\n### 해결 방법: Webpack 사용하도록 설정 변경\n\n`package.json` 파일을 열어 `scripts` 항목을 아래와 같이 수정합니다.\n\n```json\n{\n  \"scripts\": {\n    \"dev\": \"next dev --webpack\",\n    \"build\": \"next build --webpack\",\n    \"start\": \"next start --webpack\",\n    \"lint\": \"eslint\"\n  }\n}\n```\n\n`--webpack` 옵션을 명시적으로 지정하면, Turbopack 대신 **Webpack을 사용하여 빌드 및 실행**하게 됩니다.\n\n수정 후 다시 개발 서버를 실행합니다.\n\n```bash\nnpm run dev\n```\n\n---\n\n## 5. 실행 확인\n\n개발 서버가 정상적으로 실행되면 터미널에 서버 주소가 출력됩니다.\n\n웹 브라우저에서 해당 주소로 접속했을 때, 아래와 같은 기본 Next.js 화면이 표시되면 성공입니다.\n\n![Screenshot\\_20251226\\_152332\\_Chrome Dev.jpg](/images/_posts/termux/run-nextjs-on-android/1766730234157-Screenshot_20251226_152332_ChromeDev.jpg)\n\n---\n\n## 마무리\n\n이제 안드로이드 태블릿 환경에서도 **Next.js 개발 서버를 실행할 수 있는 환경**이 완성되었습니다.\n\n다음 단계에서는:\n\n* GitHub 저장소 연동\n* 코드 푸시\n* 배포 환경 구성\n\n과정을 이어서 다뤄볼 예정입니다.\n"])</script><script>self.__next_f.push([1,"1f:Tde8,"])</script><script>self.__next_f.push([1,"# 안드로이드 태블릿으로 VS-CODE (Visual Studio Code) 실행하기\n\n[[toc]]\n\n## 들어가기 앞서\n\n이 문서는 안드로이드 태블릿에서 **Termux + code-server(VS Code)** 환경을 구성하고, 해당 환경에서 **Next.js 기반 웹 서비스를 개발**하기 위한 준비 과정 중 **code-server 설치 및 실행**에 대해 설명합니다.\n\nPC가 아닌 태블릿 환경에서도 충분히 개발이 가능하다는 점을 직접 구성 과정을 통해 보여주는 것이 목적입니다.\n\n---\n\n## 1. 태블릿 준비\n\n안드로이드 태블릿이라면 기종에 관계없이 모두 사용 가능합니다.\n다만, 성능이 많이 낮은 기기에서는 Next.js 빌드나 의존성 설치 과정에서 시간이 다소 오래 걸릴 수 있습니다.\n\n\u003e **권장 최소 사양**\n\u003e\n\u003e * Galaxy Tab S7+ 또는 동급 이상의 성능\n\n실제 개발 및 테스트에는 큰 제약이 없으며, 빌드 시간이 늘어나는 정도의 차이만 발생합니다.\n\n---\n\n## 2. Termux 설치\n\n과거에는 **Google Play Store에서 설치한 Termux**에서 패키지 관리자(`apt`) 오류가 발생하는 문제가 있었습니다.\n하지만 현재는 해당 문제가 해결되어, **Play Store 버전 Termux도 정상적으로 사용 가능**합니다.\n\n가장 간편한 방법으로 **Google Play Store에서 Termux를 설치**하면 됩니다.\n\n---\n\n## 3. Termux 저장소(repository) 업데이트\n\nTermux 설치 후 가장 먼저 저장소를 최신 상태로 업데이트합니다.\n\n```bash\n# 저장소 업데이트\npkg update\n\n# Termux 확장 저장소(tur-repo) 추가\npkg install tur-repo\n```\n\n### tur-repo가 필요한 이유\n\n`code-server`는 용량과 빌드 부담 등의 이유로 **Termux 공식 기본 저장소에는 포함되어 있지 않습니다**.\n\n따라서 `tur-repo`라는 **확장 저장소**를 추가해야 `code-server` 패키지를 설치할 수 있습니다.\n\n---\n\n## 4. code-server 설치\n\n확장 저장소 추가가 완료되었다면, 아래 명령어로 `code-server`를 설치합니다.\n\n```bash\npkg install code-server\n```\n\n설치 과정에서 별도의 추가 설정은 필요하지 않습니다.\n\n---\n\n## 5. code-server 실행\n\n설치가 완료되면 아래 명령어로 `code-server`를 실행합니다.\n\n```bash\ncode-server --auth none --host 0.0.0.0 --port 8080\n```\n\n### 옵션 설명\n\n* `--auth none`\n\n  * 인증을 비활성화합니다.\n  * 태블릿 단독 사용 환경에서는 편의상 비활성화를 권장합니다.\n\n* `--host 0.0.0.0`\n\n  * 모든 네트워크 인터페이스에서 접속을 허용합니다.\n  * 로컬 접속만 허용하려면 `127.0.0.1`로 지정할 수 있습니다.\n\n* `--port 8080`\n\n  * 접속 포트를 지정합니다.\n  * 필요에 따라 다른 포트 번호로 변경해도 무방합니다.\n\n\u003e 인증이 필요한 경우 `--auth password` 옵션을 사용할 수 있습니다.\n\n---\n\n## 6. 실행 확인\n\n웹 브라우저를 열고 아래 주소로 접속합니다.\n\n```\nhttp://127.0.0.1:8080/\n```\n\n아래와 같이 **VS Code Web 화면(code-server)** 이 표시되면 정상적으로 실행된 것입니다.\n\n![Screenshot\\_20251226\\_113600\\_Chrome Dev.jpg](/images/_posts/termux/android-nextjs-deploy/1766716693967-Screenshot_20251226_113600_ChromeDev.jpg)\n\n---\n\n## 마무리\n\n이제 안드로이드 태블릿 환경에서 **VS Code 기반 개발 환경**이 준비되었습니다.\n\n다음 글에서는 이 환경 위에서:\n\n* Node.js 설치\n* Next.js 프로젝트 생성\n* GitHub 연동 및 배포\n\n과정을 단계별로 진행해보겠습니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"CATEGORY\",\"breadcrumb\":\"categories › termux\",\"title\":\"termux\",\"desc\":\"\\\"termux\\\" 카테고리의 글 모음\",\"posts\":[{\"slug\":[\"termux\",\"deploy-nextjs-project-on-android\"],\"slugPath\":\"termux/deploy-nextjs-project-on-android\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/termux/deploy-nextjs-project-on-android.md\",\"frontmatter\":{\"title\":\"안드로이드 태블릿에서 github page에 Next.js 프로젝트 배포하기\",\"slug\":\"deploy-nextjs-project-on-android\",\"description\":\"안드로이드 태블릿으로 Next.js 프로젝트를 github에 배포해봅니다.\",\"date\":\"2026-01-01 13:08:10\",\"tags\":[\"termux\",\"code-server\",\"vscode\",\"android\",\"dev-environment\",\"next.js\"],\"category\":\"termux\",\"cover\":\"images/og.webp\",\"draft\":false},\"content\":\"$1d\"},{\"slug\":[\"termux\",\"run-nextjs-on-android\"],\"slugPath\":\"termux/run-nextjs-on-android\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts el\":\"icon\",\"href\":\"/favicon.ico?f4bc9d5227ff0655\",\"type\":\"image/x-icon\",\"sizes\":\"1024x1024\"}],[\"$\",\"$L20\",\"26\",{}]]\n"])</script><script>self.__next_f.push([1,"16:null\n"])</script></body></html>
