n안타깝게도 프로그램을 다운로드 하기 위해서는 로그인이 필수입니다.\n계정이 없으시다면 우선 우측 상단의 드랍다운을 클릭하여 회원가입을 진행하도록 합니다.\n\n---\n\n#### 1. 이메일 입력\n\n자신의 이메일 주소를 입력해주시고 자동 가입 방지 문자를 입력하고 Next 버튼을 누릅니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769242673807-image.webp)\n\n#### 2. 이메일 인증\n\n입력하신 이메일 주소로 이메일로 인증번호가 발송되었습니다.\n해당 번호를 확인하여 입력해줍니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769242914540-image.webp)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769242971456-image.webp)\n\n#### 3. 기본 정보 입력\n\n이름, 성, 나라, 직업, 비밀번호, 비밀번호 확인\n각 항목에 자신의 정보를 입력하고 이용약관에 동의를 체크하시고 Create Account 버튼을 누릅니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769243753873-image.webp)\n\n#### 4. 가입 완료\n\n아래와 같이 Registerd Successfully! 가 뜬다면 가입이 완료된 것입니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769243832085-image.webp)\n\n---\n\n### 다시 다운로드 사이트를 접속\n\n아래의 다운로드 사이트로 접속하고\n\n- [https://www.vmware.com/products/desktop-hypervisor/workstation-and-fusion](https://www.vmware.com/products/desktop-hypervisor/workstation-and-fusion)\n\n다시 한번 Download Now 버튼을 클릭하여 로그인을 하시면 됩니다.\n\n#### 다운로드 클릭\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769244230158-image.webp)\n\n#### 이메일 / 패스워드 입력\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769244232607-image.webp)\n\n#### 로그인 성공\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769244234916-image.webp)\n\n### 다운로드 페이지로 이동\n\n해당 페이지 우측 사이드바에서\nMy Downloads \u003e Free Software Downloads available \u003cu\u003e*HERE*\u003c/u\u003e\n\u003cu\u003e*HERE*\u003c/u\u003e를 클릭한다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769244408746-image.webp)\n\n다음 페이지에서 스크롤을 조금 내리면 Fusion, Workstation Pro가 보인다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769244674450-image.webp)\n\n자신의 OS에 맞게 클릭\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769244951317-image.webp)\n\n1. 버전을 한번 더 클릭\n2. 이용약관 페이지를 한번 들어가고\n3. 이용약관 동의 체크\n4. 구름 모양의 다운로드 버튼 클릭\n5. 추가 정보를 입력하시겠습니까? -\u003e Yes 클릭\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769245194814-image.webp)\n\n이제 진짜 마지막 입니다.\n아래대로 주소를 채워주시면 됩니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769246909212-image.webp)\n\n조금 기다리시면 아까의 다운로드 화면으로 이동이 되고\n다시 구름모양 다운로드를 누르시면 설치 파일을 다운로드 할 수 있습니다.\n\n설치 파일 다운로드가 완료되면 설치 수순을 밟으시면 됩니다.\n\n설치 완료된 화면\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769246190323-image.webp)\n\n\n## Linux 이미지 파일 다운로드\n\n길고 긴 VMware의 다운로드가 완료되었습니다.\n이제는 Rocky Linux ISO 이미지 파일을 다운받으로 가보겠습니다.\n아래의 주소로 들어가시면 로키 리눅스를 다운로드 할 수 있습니다.\n\n[https://rockylinux.org/ko-KR/download](https://rockylinux.org/ko-KR/download)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769246142479-image.webp)\n\nMinimal ISO 파일을 다운로드 하도록 합니다.\n\n다운로드가 완료되면 VMware를 실행시켜 ISO 파일로 설치를 진행해봅니다.\n\n## 1. 본격적인 Rocky Linux 가상머신에 설치하기\n\n이제 VMware를 켜주시고 새로운 머신을 생성하여 해당 머신에 로키 리눅스를 설치하는 과정을 진행하도록 하겠습니다.\n\n### 1. 가상머신 생성\n\n맥북 기준이긴 하지만 윈도우도 메뉴가 비슷하므로, 충분히 따라 하실 수 있을겁니다.\n\n### 1-1. 상단에 File \u003e New... 를 클릭하여 새로운 가상머신을 생성 팝업을 띄웁니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769247543590-image.webp)\n\n### 1-2. Create a custom virtual machine 클릭\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769247634425-image.webp)\n\n### 1-3. Rocky Linux 64-bit Arm 클릭 \u003e Continue\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769247721170-image.webp)\n\n### 1-4. Create a new virtual disk 클릭 (기본값)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769247767652-image.webp)\n\n### 1-5. Finish (끝)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769247795763-image.webp)\n\n### 1-6. 가상 머신 종료\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248012524-image.webp)\n\n## 2. 로키 리눅스 이미지를 부팅 이미지로 잡아주기\n\n마지막에 가상머신을 종료한 이유는 추가 설정 및 로키 리눅스 이미지를 부팅 이미지로 설정 후 부팅하기 위함입니다. \n\n### 2-1. 하드웨어 용량 추가 (옵션)\n\n하드웨어 용량이 20GB로 너무 적습니다.\n물론 리눅스 명령어를 익히기 위해서는 충분한 용량이지만 넉넉하게 100GB 정도로 수정을 해줍니다.\n\n수정은 아래 이미지와 같이\n\nHard Disk (NVMe) \u003e Disk size 100 입력 \u003e Apply\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248514098-image.webp)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248542163-image.webp)\n\n### 2-2. 부팅 이미지를 다운로드한 이미지로 잡아주기\n\n드랍다운 메뉴 클릭 \u003e Choose a disc or disc image... \u003e 다운로드한 이미지 선택 \u003e Connect CD/DVD Drive 체크 \u003e 창 닫기\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248657091-image.webp)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248628880-image.webp)\n\n## 3. 부팅하여 로키 리눅스 설치 진행\n\n\n### 3-1. 가상머신 부팅\n\n가상머신 우클릭 \u003e Start Up\n정상적으로 이미지가 잡히고 부팅이 시작되면 아래와 같이 검은 화면에 메뉴가 뜹니다.\n\nInstall Rocky Linux 10.1 을 눌러 진행합니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248742113-image.webp)\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769248778119-image.webp)\n\n\n### 3-2. 언어 설정\n\n언어는 영어로 설정해주도록 합니다.\n홈디렉토리가 한글로 생성되거나 하면 예상치 못한 오류가 발생하기 때문에 (큰 오류는 아니지만)\n미리 영어로 홈디렉토리가 생성되도록 해줍니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249135915-image.webp)\n\n### 3-3. 설치를 위한 설정\n\n설치를 진행하기 위해 몇가지 설정을 해주어야 합니다.\n설정할 항목은 아래와 같습니다.\n\n- Root Account\n- User Creation\n- Installation Destination\n\n3가지 설정만 하면 나머지는 문제 없으니 설정을 진행해보도록 하겠습니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249313704-image.webp)\n\n#### 3-3-1. Root Account\n\n루트 어카운트의 로그인을 허용할지 설정하는 단계입니다.\n\n보안을 위해 설정하지 않도록 합니다.\n필요하신 분들은 설치 후 passwd 명령어를 통해 root 계정의 암호를 설정하여 로그인 하도록 할 수 있습니다.\n우선은 아래 이미지와 같이 Disable root account 로 선택 후 좌측 상단의 Done 버튼을 눌러줍니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249431738-image.webp)\n\n#### 3-3-2. Create User\n\n로그인 할 유저를 설정하는 단계입니다.\n항목에 맞춰 적어주시고 한가지 주의할점은 암호가 단순하면 좌측 상단의 Done 버튼을 두번 눌러야 적용이 가능합니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249464472-image.webp)\n\n#### 3-3-3. Installation Destination\n\n설치할 디스크를 설정하는 단계입니다.\n\n전문가 또는 특수한 목적으로 디스크 영역을 수동으로 설정할 경우에는\n디스크를 선택한 뒤 Storage Configuration 에서 Custom을 선택하여 직접 디스크를 나눠주지만,\n학습 단계에서는 필요없습니다. Automatic로 진행 후 좌측 상단의 Done 버튼을 누르도록 합니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249532984-image.webp)\n\n#### 3-3-4. 설치 진행\n\n다 끝나셨으면 우측 하단의 Begin Installation을 눌러 설치를 진행합니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249686250-image.webp)\n\n#### 3-3-5. 설치 완료\n\n설치가 완료되면 우측 하단의 Reboot System 버튼을 누릅니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249835868-image.webp)\n\n#### 3-3-6. 부팅 이미지 언마운트\n\n그대로 부팅을 하게 되면 다시 설치 이미지로 부팅이 되기 때문에 아래의 설정으로 돌아가\n[Connect CD/DVD Drive] 를 체크 해제 해줍니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769249999356-image.webp)\n\n## 4. 로키 리눅스 실행\n\n정상적으로 부팅이 되면 아래와 같이 로그인이 뜹니다.\n\nUser Create 단계에서 입력했던 유저 정보를 입력하여 로그인 하면 설치 완료입니다.\n\n![image.png](/images/_posts/linux/rocky-linux-series-1-install/1769250086643-image.webp)\n\n## 5. 마치면서\n\n로키 리눅스를 가상머신 환경에 설치하기 위한 설치 과정을 정리해보았습니다.\n다음 포스트 부터는 본격적으로 리눅스 시스템을 다루는 방법에 대해 설명을 진행하도록 하겠습니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #rocky-linux-install\",\"title\":\"#rocky-linux-install\",\"desc\":\"\\\"rocky-linux-install\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-1-install\"],\"slugPath\":\"linux/rocky-linux-series-1-install\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-1-install.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #1 - 로키 리눅스 설치\",\"slug\":\"rocky-linux-series-1-install\",\"description\":\"로키 리눅스를 설치하는 방법에 대해 설명합니다.\",\"date\":\"2026-01-22 22:13\",\"tags\":[\"linux\",\"rocky-linux\",\"rocky-linux-install\",\"linux-install\",\"vmware\",\"vmware-fusion\"
