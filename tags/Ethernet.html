함.\n\n* 전기 → 빛 (보내기)\n* 빛 → 전기 (받기)\n\n### 2-2. 번역기가 많아질수록 전기료가 폭발함\n\nAI 데이터센터는 링크 수가 많음.\nGPU가 많으니 서로 연결도 많아짐.\n그러면 트랜시버도 엄청 많이 필요함.\n\n기사에서 엔비디아는 이런 식의 메시지를 던짐.\n\n* 초대형 GPU 클러스터에서는 광모듈 전력이 GPU 전력의 10% 수준까지 갈 수 있다\n* 특히 레이저 쪽 전력이 매우 커진다\n\n숫자가 얼마나 정확하냐보다 포인트가 중요함.\n**네트워크가 ‘부가 비용’이 아니라 ‘주요 비용’이 됐다는 것**.\n\n철강 공장으로 치면\n예전엔 컨베이어 벨트(물류)는 그냥 따라오는 비용이었는데\n이젠 컨베이어 모터 전기료가 생산비를 흔드는 수준이 됐다는 느낌임.\n\n---\n\n## 3. 그래서 CPO가 뭔데\n\nCPO는 Co-Packaged Optics.\n쉽게 말하면\n\n**광 번역기(트랜시버)를 스위치 가까이 붙여서 전력 손실을 줄이자**는 설계임.\n\n### 3-1. 왜 ‘가까이’ 붙이면 좋아지나\n\n전기 신호는 고속으로 갈수록 멀리 보내기 어렵고 손실이 큼.\n그래서 먼 거리는 광(빛)으로 보내는 게 유리함.\n\n기존 방식은\n\n* 스위치 칩 → 보드 → 커넥터 → 트랜시버\n\n이런 경로로 전기 신호가 꽤 이동함.\n이 구간이 길수록\n신호를 깨끗하게 만들기 위한 회로(DSP 등)가 더 필요해지고 전력도 늘어남.\n\nCPO는 광 부품을 스위치 칩 패키지 근처에 붙여\n전기 신호 이동 구간을 줄이고\n바로 광으로 바꿔서 멀리 보내자는 접근임.\n\n### 3-2. 레이저는 왜 여전히 밖에 두나\n\n기사에선 레이저는 여전히 외부에 남는다고 설명함.\n레이저는 실리콘 공정만으로 만들기 어려운 재료 문제가 있어서\n완전히 스위치 패키지 안에 넣기 힘든 측면이 있음.\n\n다만 CPO로 가면 레이저를 효율적으로 공유하거나 수량을 줄일 여지도 생긴다는 식으로 말함.\n\n---\n\n## 4. ‘실리콘 포토닉스’는 뭘 의미하나\n\n여기서부터가 심화 파트임.\n\n### 4-1. 실리콘 포토닉스는 “빛 회로를 반도체처럼 만든다”임\n\n전기는 회로(구리 배선)로 흐름.\n빛도 길(도파로, waveguide)로 흐를 수 있음.\n\n실리콘 포토닉스는\n빛이 지나갈 길을 실리콘 위에 만들고\n그 위에서 빛을 조절해서 데이터를 싣는 기술임.\n\n즉, 전자회로 + 광회로를 같은 방식으로 대량 생산하려는 흐름임.\n\n### 4-2. 가장 중요한 부품: ‘변조기(modulator)’\n\n빛 자체는 그냥 밝기/파장/위상을 바꿀 수 있음.\n거기에 0과 1을 실어서 데이터를 만듦.\n그 역할이 변조기임.\n\n기사에선 여기서 회사별 접근이 갈린다고 설명함.\n\n* 브로드컴: Mach–Zehnder 계열\n* 엔비디아: 마이크로링(microring) 계열\n\n### 4-3. 마이크로링은 작지만 예민함\n\n마이크로링은 아주 작은 고리 모양 구조가 특정 파장의 빛에 공진하는 특성을 이용함.\n\n* 장점: 작고 집적이 쉬움\n* 단점: 온도에 민감함\n\n온도가 변하면 공진 조건이 달라져서 신호 품질이 흔들릴 수 있음.\n그래서 각 링에 온도 제어용 히터/제어회로가 붙고, 계속 보정해야 할 수 있음.\n\n이게 왜 중요하냐면\n고속/대규모 시스템에서는\n‘예민한 부품’이 곧 장애 포인트가 되기 때문임.\n\n서버실에서 센서 하나가 오작동해도 알람 폭주하는데\n패키지 안에 수천 개 예민한 소자가 있으면 운영 난이도가 확 올라감.\n\n---\n\n## 5. 엔비디아가 말하는 제품: Quantum-X / Spectrum-X\n\n기사에서는 엔비디아가 CPO 기반 스위치를 두 갈래로 밀고 있다고 적음.\n\n* Quantum-X: InfiniBand 계열\n* Spectrum-X: Ethernet 계열\n\n### 5-1. InfiniBand와 Ethernet 차이를 쉽게 말하면\n\n둘 다 데이터 보내는 길이지만 성격이 다름.\n\n* Ethernet: 범용, 표준이 넓고 싸게 확산됨\n* InfiniBand: 고성능 집단통신에 강하고 HPC/AI에서 많이 씀\n\n고등학생 비유로 치면\n\n* Ethernet은 일반 도로\n* InfiniBand는 전용 고속도로\n\nAI 학습은 “같이 움직여야 하는 차량(데이터)”이 많아서\n전용 고속도로가 유리한 장면이 많았고,\n반대로 기업/클라우드는 범용 도로(Ethernet)의 경제성을 포기하기 어려움.\n그래서 둘 다 계속 커짐.\n\n### 5-2. 왜 스위치가 액체 냉각까지 가나\n\n기사에 따르면 Quantum-X 쪽은 액체 냉각을 언급함.\n이건 방향성이 명확함.\n\n* 네트워크 장비도 전력 밀도가 올라감\n* 결국 열을 공기로만 빼기 어렵고, 물로 빼는 쪽이 유리해짐\n\nGPU만 물로 식히는 시대가 아니라\n‘AI 데이터센터 전체가 물로 간다’는 흐름임.\n\n---\n\n## 6. 가장 현실적인 문제: 수율, 테스트, 유지보수\n\n여기서부터는 “이 기술이 좋다”보다\n“이게 진짜 돈이 되려면 뭐가 어려운가” 파트임.\n\n### 6-1. 패키지 안에 고가 부품이 몰리면 불량이 치명적임\n\nCPO는 통합도가 올라가지만\n한 번 불량이 나면 손실이 커짐.\n\n플러그형 모듈은\n고장 나면 뽑아서 바꾸면 됨.\n근데 패키지 안에 들어가면\n교체 단위가 커질 수 있음.\n\n이건 운영에서 매우 큰 차이임.\n\n### 6-2. 그래서 테스트 절차를 새로 만들었다는 얘기가 나옴\n\n기사에서는 엔비디아가 협력사들과\n패키징/광섬유/테스트 플로우를 새로 만들었다는 식으로 설명함.\n\n이 문장은 짧지만 의미가 큼.\n\n* 기술적으로 가능하냐가 아니라\n* 생산이 가능하냐\n* 불량을 걸러낼 수 있냐\n* 현장에서 유지보수가 되냐\n\n이걸 해결해야 “제품”이 됨.\n\n---\n\n## 7. 엔비디아가 제시하는 효과는 어떻게 해석해야 하나\n\n기사에는 엔비디아가 내세우는 개선 수치들이 나옴.\n예: 레이저 수량 감소, 전력 효율 개선, 신뢰성 개선 등.\n\n이 수치들을 그대로 믿어야 한다기보다\n이 방향으로 경쟁이 움직인다는 게 포인트임.\n\n* 전력 효율 개선은 곧바로 운영비 절감\n* 신뢰성 개선은 다운타임 비용 절감\n* 배치 속도 개선은 투자 회수 속도와 연결\n\nAI 인프라는 결국 “돈을 태우는 설비 산업”처럼 움직이기 시작함.\n그래서 네트워크도 이제는 ‘성능’만이 아니라\n‘전력/수율/운영’이 경쟁 포인트가 됨.\n\n---\n\n# 결론\n\n이 기사는 이렇게 요약 가능함.\n\n* AI는 GPU 싸움이 맞음\n* 근데 GPU를 묶는 네트워크가 전기/열/비용 병목이 됨\n* 그 병목을 줄이려고 ‘빛을 더 가까이’ 붙이는 CPO가 뜬다\n* 다만 CPO는 수율/테스트/유지보수 난이도가 올라가는 대가를 치른다\n\n## 선택지 / 열린 결론\n\n* CPO가 초대형 클러스터(클라우드/연구소)에서만 쓰이는 기술로 남을지\n* 아니면 더 작은 스케일까지 내려와서 보편화될지\n* InfiniBand와 Ethernet이 어떻게 역할 분담을 할지\n\n결론은 아직 안 떨어짐.\n다만 “이제는 GPU만 사면 된다”는 시대는 끝나가는 분위기임.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #Ethernet\",\"title\":\"#Ethernet\",\"desc\":\"\\\"Ethernet\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"it\",\"co-packaged-optics-explained-for-students-ai-datacenter\"],\"slugPath\":\"it/co-packaged-optics-explained-for-students-ai-datacenter\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/it/co-packaged-optics-explained-for-students-ai-datacenter.md\",\"frontmatter\":{\"title\":\"AI 데이터센터의 진짜 병목, ‘빛으로 옮기기’ - Co-Packaged Optics 쉽게 풀어쓴 심화\",\"slug\":\"co-packaged-optics-explained-for-students-ai-datacenter\",\"description\":\"IEEE Spectrum 분석을 바탕으로 CPO(광 집적 스위치)가 왜 필요한지 고등학생도 이해할 수 있게 풀어쓴 심화 정리.\",\"date\":\"2026-02-12 16:23\",\"tags\":[\"Networking\",\"SiliconPhotonics\",\"DataCenter\",\"AIInfrastructure\",\"NVIDIA\",\"Ethernet\",\"InfiniBand\"],\"category\":\"it\",\"cover\":\"/images/og.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/Ethernet\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/tags/termux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"android\",\"href\":\"/tags/android\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky\",\"href\":\"/tags/rocky\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"network\",\"href\":\"/tags/network\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"systemd\",\"href\":\"/tags/systemd\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"system\",\"href\":\"/tags/system\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"linux-basics\",\"href\":\"/tags/linux-basics\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"code-server\",\"href\":\"/tags/code-server\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"vscode\",\"href\":\"/tags/vscode\",\"active\":false,\"prefix\":\"#\"}]}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"1d:I[6869,[],\"IconMark\"]\n"])</script><script>self.__next_f.push(
