\n해당 그룹을 primary 그룹으로 사용하는 유저가 있다면 삭제되지 않습니다.\n이 경우 먼저 유저의 그룹을 변경해야 합니다.\n\n---\n\n## USER\n\n유저 관련 정보는 여러 파일에 나뉘어 관리됩니다.\n\n* `/etc/passwd` : 계정 기본 정보\n* `/etc/shadow` : 암호 및 만료 정책\n* `/etc/shells` : 로그인 가능한 쉘 목록\n\n`/etc/passwd`의 한 줄은 다음과 같은 구조를 가집니다.\n\n```text\n계정명:암호:UID:GID:유저메모:홈디렉토리:로그인쉘\n```\n\n실제 암호는 `/etc/shadow` 파일에 해시 형태로 저장됩니다.\n\n---\n\n### useradd : 유저 생성\n\n새로운 계정을 생성하는 명령어입니다.\n\n주요 옵션은 다음과 같습니다.\n\n* `-u` : UID 지정\n* `-c` : 유저 메모(Comment)\n* `-r` : 시스템 계정 생성 (UID 1~999)\n* `-s` : 로그인 쉘 지정\n* `-g` : primary 그룹 지정\n* `-G` : secondary 그룹 지정\n* `-m` : 홈 디렉토리 생성\n* `-d` : 홈 디렉토리 경로 지정\n\n```bash\n# tom 이라는 계정을 생성\nuseradd tom\n\n# user1을 생성하고 UID를 3001, 메모를 \"New User\"로 설정\nuseradd -u 3001 -c \"New User\" user1\n\n# 시스템 계정 derek 생성\nuseradd -r -s /sbin/nologin -g sys -G sup1 derek\n\nuseradd -u 4989 -s /bin/csh -c \"010-1111-2222\" susan\nuseradd -r -s /sbin/nologin -g sales -G sshd,kvm,dbus -m -d /oracle ora\n```\n\n리눅스에는 **primary 그룹과 secondary 그룹** 개념이 있습니다.\n\n* `-g` : primary 그룹 (기본 소유 그룹)\n* `-G` : secondary 그룹 (추가 소속 그룹)\n\n파일 권한과 접근 제어를 이해하려면\n이 구분은 반드시 알고 있어야 합니다.\n\n---\n\n### usermod : 유저 설정 변경\n\n이미 존재하는 유저의 설정을 변경할 때 사용합니다.\n\n`useradd`에서 사용하던 옵션 대부분을 그대로 사용할 수 있습니다.\n\n```bash\n# susan의 UID를 3030으로 변경하고\n# primary 그룹을 sales로, 로그인 쉘을 bash로 변경\nusermod -u 3030 -g sales -s /bin/bash susan\n```\n\nsecondary 그룹을 추가할 때는 `-aG` 옵션을 사용합니다.\n\n```bash\n# susan을 기존 그룹은 유지한 채 docker 그룹에 추가\nusermod -aG docker susan\n```\n\n`-a` 옵션 없이 `-G`만 사용하면\n기존 secondary 그룹이 모두 사라지므로 주의해야 합니다.\n\n---\n\n### userdel : 유저 삭제\n\n유저를 삭제할 때 사용하는 명령어입니다.\n\n```bash\n# tom은 홈디렉토리까지 삭제\nuserdel -r tom\n\n# susan은 계정만 삭제, 홈디렉토리는 유지\nuserdel susan\n```\n\n운영 환경에서는\n데이터 보존 여부를 반드시 확인한 후 삭제하는 것이 안전합니다.\n\n---\n\n### 특정 유저가 만든 파일 정리\n\n계정은 삭제했지만,\n파일 시스템에는 해당 UID를 가진 파일이 남아있는 경우가 많습니다.\n\n```bash\n# UID 1701이 소유한 파일 및 디렉토리 삭제\nfind / -uid 1701 -exec rm -rf {} +\n```\n\n소유자가 없는 파일(`-nouser`)을 처리하는 예시는 아래와 같습니다.\n\n```bash\n# 소유자가 없는 파일을 /tmp/backup 으로 이동\nmkdir /tmp/backup\nfind / -nouser 2\u003e /dev/null -exec mv {} /tmp/backup \\;\n```\n\n이 작업은 반드시 신중하게 진행해야 합니다.\n\n---\n\n## Shadow 파일과 비밀번호 정책\n\n`/etc/shadow` 파일은\n유저의 비밀번호와 만료 정책을 관리하는 핵심 파일입니다.\n\n이 파일을 직접 수정하기보다는\n`chage` 명령어를 사용하는 것이 일반적입니다.\n\n```bash\n# 현재 비밀번호/계정 만료 정책 확인\nchage -l user\n\n# 다음 로그인 시 비밀번호 변경 강제\nchage -d 0 user\n\n# 비밀번호 최소 사용 기간 7일\nchage -m 7 user\n\n# 비밀번호 최대 사용 기간 90일\nchage -M 90 user\n\n# 만료 7일 전 경고\nchage -W 7 user\n\n# 만료 후 14일 지나면 계정 비활성화\nchage -I 14 user\n\n# 계정 만료일 설정\nchage -E 2026-12-31 user\n```\n\nshadow 파일의 각 필드는 다음 의미를 가집니다.\n\n```text\nusername:password:lastchg:min:max:warn:inactive:expire:reserved\n```\n\n---\n\n## 계정 생성 시 영향을 주는 설정 파일\n\n### /etc/login.defs\n\n계정 관련 명령어의 **기본 보안 정책**을 정의합니다.\n\n* login\n* useradd\n* passwd\n\n이 파일은 PAM보다 하위 레벨에서\n기본값의 기준이 됩니다.\n\n```bash\nPASS_MAX_DAYS 60\nPASS_MIN_DAYS 10\nUID_MIN       10000\nGID_MIN       20000\n```\n\n---\n\n### /etc/default/useradd\n\n`useradd` 명령어를 실행할 때\n옵션을 주지 않으면 적용되는 기본값입니다.\n\n```bash\nINACTIVE=30\n```\n\n---\n\n### /etc/skel\n\n새 계정을 생성할 때,\n`/etc/skel` 디렉토리 안의 파일과 디렉토리가\n사용자의 홈 디렉토리로 그대로 복사됩니다.\n\n```bash\nmkdir -p /etc/skel/Data\ntouch /etc/skel/manual.txt\n\nuseradd lunch\npasswd lunch\nchage -l lunch\n```\n\n초기 환경을 표준화할 때 매우 유용한 구조입니다.\n\n---\n\n## 마무리\n\n유저와 그룹 관리는\n리눅스 시스템 보안과 운영의 기본입니다.\n\n명령어 자체는 단순하지만,\n그 결과는 파일 권한, 접근 제어, 로그 기록까지 모두 연결됩니다.\n\n이번 내용은 이후에 다룰\n권한(permission), ACL, 보안 설정의 기반이 됩니다.\n\n한 번에 다 외우려고 하기보다는,\n직접 만들어보고, 바꿔보고, 지워보는 과정이 가장 확실한 학습 방법이라고 생각합니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #group-management\",\"title\":\"#group-management\",\"desc\":\"\\\"group-management\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-7-manage-users-and-groups\"],\"slugPath\":\"linux/rocky-linux-series-7-manage-users-and-groups\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-7-manage-users-and-groups.md
