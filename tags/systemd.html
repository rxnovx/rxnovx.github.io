D 1이었고,\n현재는 **systemd가 PID 1** 역할을 수행합니다.\n\n이 차이를 이해하는 것이 매우 중요합니다.\n\n---\n\n## systemd 핵심 개념: Unit과 Target\n\nsystemd를 이해하려면 두 가지 용어가 핵심입니다.\n\n### Unit\n\nsystemd가 관리하는 모든 객체를 **Unit**이라고 부릅니다.\n\n대표적인 유형은 다음과 같습니다.\n\n* service : 서비스\n* target : 상태 묶음\n* mount : 마운트 포인트\n* socket : 소켓 기반 활성화\n* timer : 스케줄링\n\n### Target\n\nTarget은 **여러 Unit의 묶음**입니다.\n\n과거 SysV init의 Runlevel에 해당하는 개념입니다.\n\n---\n\n## Runlevel과 Target의 관계\n\nSysV init 시절의 Runlevel은 다음과 같았습니다.\n\n* 0 : 종료\n* 1 : 싱글 유저 모드 (Rescue)\n* 3 : 텍스트 모드 (멀티 유저)\n* 5 : GUI 모드\n\nsystemd에서는 이를 Target으로 대응시킵니다.\n\n* runlevel 3 → multi-user.target\n* runlevel 5 → graphical.target\n\n내부적으로는 여전히 Runlevel 개념이 남아 있지만,\n**운영 관점에서는 Target만 사용**하는 것이 맞습니다.\n\n---\n\n## 기본 Target 확인 및 변경\n\n```bash\nsystemctl get-default\n```\n\n기본 부팅 Target을 확인합니다.\n\n```bash\nsystemctl set-default graphical.target\n```\n\n다음 부팅부터 GUI 모드로 시작합니다.\n\n```bash\nsystemctl set-default multi-user.target\n```\n\n서버 환경에서 주로 사용하는 설정입니다.\n\n---\n\n## 일시적인 Target 변경 (isolate)\n\n```bash\nsystemctl isolate multi-user.target\n```\n\n현재 세션에서만 Target을 전환합니다.\n재부팅하면 원래 설정으로 돌아옵니다.\n\n운영 중 테스트할 때 매우 유용합니다.\n\n---\n\n## 현재 Runlevel 확인\n\n```bash\nwho -r\n```\n\nsystemd 환경에서도 호환을 위해 제공되는 명령입니다.\n\n---\n\n## 싱글 유저 모드와 암호 복구\n\n부팅 문제 해결에서 가장 많이 사용되는 기술 중 하나입니다.\n\n### RHEL 7 ~ 9 방식 (rd.break)\n\n1. 부팅 시 GRUB 메뉴에서 커널 선택\n2. `e` 입력\n3. linux 라인 끝에 `rd.break` 추가\n4. Ctrl + x 부팅\n5. `/sysroot`로 진입\n\n```bash\nchroot /sysroot\nmount -o rw,remount /sysroot\npasswd root\ntouch /.autorelabel\nexit\nexit\n```\n\nSELinux 환경에서는 **/.autorelabel**이 매우 중요합니다.\n\n---\n\n### RHEL 10 방식 (init=/bin/bash)\n\n1. GRUB에서 커널 선택 후 `e`\n2. linux 라인 끝에 `init=/bin/bash` 추가\n3. Ctrl + x\n\n```bash\nmount -o rw,remount /\npasswd root\ntouch /.autorelabel\nexec /sbin/init\n```\n\ninit을 다시 실행해야 정상 부팅으로 이어집니다.\n\n---\n\n## 서비스와 부팅의 관계\n\n### SysV init 시절\n\n* 서비스 스크립트 직접 실행\n* service 명령어 사용\n* ntsysv, setup 등\n\n### systemd 환경\n\n시스템과 서비스를 통합 관리합니다.\n\n```bash\nsystemctl start httpd\nsystemctl stop httpd\nsystemctl restart httpd\n```\n\n### 자동 시작 설정\n\n```bash\nsystemctl enable httpd\nsystemctl disable httpd\nsystemctl mask httpd\nsystemctl unmask httpd\n```\n\nmask는 실무에서 매우 강력한 차단 수단입니다.\n\n---\n\n## GRUB 2와 커널 파라미터\n\nGRUB 2는 커널과 initramfs를 메모리에 로드하는 역할을 합니다.\n\n### 커널 옵션 확인\n\n```bash\ncat /proc/cmdline\n```\n\n실제로 적용된 옵션을 확인할 수 있습니다.\n\n---\n\n## RHEL 9 이상: grubby 사용\n\n```bash\ngrubby --info=ALL\ngrubby --default-index\ngrubby --set-default-index=0\n```\n\n### 커널 옵션 추가\n\n```bash\ngrubby --update-kernel=ALL --args=\"rhgb quiet ipv6.disable=1\"\n```\n\n### 옵션 제거\n\n```bash\ngrubby --update-kernel=1 --remove-args=\"rhgb quiet\"\n```\n\n---\n\n## 부트로더 암호 설정\n\n```bash\ngrub2-set-password\n```\n\n직접 grub.cfg를 수정하지 않는 것이 원칙입니다.\n\n---\n\n## initramfs (초기 램 파일시스템)\n\ninitramfs는 **커널이 루트 파일시스템을 마운트하기 전까지 사용하는 임시 환경**입니다.\n\n* 스토리지 드라이버\n* 파일시스템 모듈\n* LVM, RAID, 암호화 지원\n\n레스큐 커널의 initramfs가 더 큰 이유는,\n더 많은 하드웨어와 파일시스템을 지원하기 위해서입니다.\n\n```bash\ndr\n\ndracut --regenerate-all\n```\n\n---\n\n## systemd 부팅 순서\n\n* local-fs.target\n* sysinit.target\n* basic.target\n* multi-user.target\n* graphical.target\n\n```bash\nsystemctl list-dependencies graphical.target\n```\n\n부팅 문제 분석에 매우 유용합니다.\n\n---\n\n## rc.local의 현재 위치\n\n```bash\n/etc/rc.d/rc.local\n```\n\n호환성 목적입니다.\nsystemd 서비스로 대체하는 것이 권장됩니다.\n\n---\n\n## 마무리\n\n부팅은 리눅스의 모든 것의 시작입니다.\n\n부팅 과정을 이해하면,\n\n* 시스템 장애 복구\n* 서비스 문제 추적\n* 보안 사고 대응\n\n까지 훨씬 수월해집니다.\n"])</script><script>self.__next_f.push([1,"1d:T1ebd,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n---\n\n## 들어가기\n\n리눅스를 사용하다 보면 반드시 마주치게 되는 것이 로그입니다.\n서비스가 왜 죽었는지, 인증이 왜 실패했는지, 시스템에 어떤 일이 있었는지를 가장 정확하게 말해주는 것이 로그입니다.\n이번 글에서는 리눅스에서 로그가 어떻게 관리되는지, 그리고 실제로 어떻게 확인하고 설정하는지를 정리해봅니다.\n\n---\n\n## 리눅스의 로그 관리 흐름\n\n리눅스의 로그 시스템은 한 번에 만들어진 것이 아니라, 시간이 지나며 점진적으로 발전해왔습니다.\n현재 기준으로는 다음 세 가지 흐름을 이해하면 정리가 됩니다.\n\n### Sysklogd\n\nSysklogd는 전통적인 유닉스/리눅스 로그 관리 프로그램입니다.\n`syslogd`, `klogd`로 구성되어 있으며, 텍스트 파일 기반 로그 관리의 출발점이라고 볼 수 있습니다.\n최근 배포판에서는 거의 사용되지 않지만, rsyslog의 기반 개념을 이해하는 데 의미가 있습니다.\n\n### Rsyslog\n\nrsyslog는 Sysklogd를 대체하기 위해 등장한 로그 데몬입니다.\nRHEL 계열 기준으로 기본 로그 시스템으로 오랫동안 사용되어 왔습니다.\n\n특징은 다음과 같습니다.\n\n* 원격 로그 전송 및 수신 가능\n* IPv4 / IPv6 모두 지원\n* 조건 기반 필터링 및 파일 분리 저장 가능\n* 기본적으로 텍스트 파일로 로그를 관리\n\n### systemd Journal\n\nRHEL7부터 시스템 시작 프로세스가 init에서 systemd로 변경되면서, journald라는 로그 관리 시스템이 함께 도입되었습니다.\n기존 파일 기반 로그와 달리 바이너리 형태로 로그를 저장하며, 전용 도구를 통해서만 조회합니다.\n\n---\n\n## systemd Journal의 특징\n\n### 휘발성 로그 구조\n\n기본 설정에서 journal 로그는 휘발성입니다.\n시스템이 재부팅되면 로그가 사라집니다.\n\n휘발성 로그는 다음 경로에 저장됩니다.\n\n* `/run/log/journal/\u003cmachine-id\u003e/`\n\nmachine-id는 시스템을 식별하는 고유 값이며, `hostnamectl` 명령으로 확인할 수 있습니다.\n\n### 영구 로그로 전환하기\n\n로그를 재부팅 후에도 유지하고 싶다면 별도의 디렉토리를 생성해야 합니다.\n\n```bash\nmkdir -p /var/log/journal\n```\n\n이 디렉토리가 존재하면 journald는 자동으로 로그를 영구 저장 모드로 전환합니다.\n최근 버전에서는 서비스 재시작 없이도 바로 적용됩니다.\n\n---\n\n## journalctl 사용법\n\njournal 로그는 일반적인 `cat`이나 `ls`로 확인할 수 없습니다.\n바이너리 형식이기 때문에 전용 뷰어인 `journalctl`을 사용해야 합니다.\n\n### 기본 조회\n\n* 기본 정렬은 오래된 로그가 위에 표시됩니다.\n* 최신 로그부터 보고 싶다면 `-r` 옵션을 사용합니다.\n\n```bash\njournalctl -r\n```\n\n### 줄 수 제한\n\n```bash\njournalctl -n 50\n```\n\n지정한 개수만큼의 로그만 출력합니다.\n\n### 실시간 로그 확인\n\n```bash\njournalctl -f\n```\n\n서비스 로그를 실시간으로 추적할 때 자주 사용합니다.\n\n### Priority 기반 필터링\n\njournal 로그는 0부터 7까지의 priority 값을 가집니다.\n숫자가 낮을수록 더 심각한 로그입니다.\n\n```bash\njournalctl -p 0..3 _COMM=sshd\n```\n\n위 예시는 sshd 프로세스에서 발생한 치명적인 로그만 조회합니다.\n\n| 값 | 이름      | 설명           |\n| - | ------- | ------------ |\n| 0 | emerg   | 시스템 사용 불가 상태 |\n| 1 | alert   | 즉각적인 조치 필요   |\n| 2 | crit    | 치명적 오류       |\n| 3 | err     | 일반 오류        |\n| 4 | warning | 경고           |\n| 5 | notice  | 주목할 이벤트      |\n| 6 | info    | 정보           |\n| 7 | debug   | 디버깅          |\n\n### 기간 및 서비스 기준 조회\n\n```bash\njournalctl --since \"2024-01-01\" --until \"2024-12-31\" -u crond\n```\n\n특정 기간 + 특정 서비스 로그를 함께 조회할 수 있습니다.\n\n서비스 이름이 헷갈릴 경우 다음 명령으로 확인합니다.\n\n```bash\nsystemctl list-unit-files -t service\n```\n\n---\n\n## Journal 로그 씰링(Sealing)\n\njournal 로그는 기본적으로 수정이 가능합니다.\n이를 방지하기 위해 씰링 기능을 사용할 수 있습니다.\n\n```bash\njournalctl --setup-keys --interval=30m\n```\n\n이 기능을 사용하려면 암호화 라이브러리가 필요합니다.\n\n```bash\ndnf install libgcrypt\n```\n\n씰링이 적용되면 로그 위변조 여부를 검증할 수 있습니다.\n\n---\n\n## Rsyslog 구조 이해하기\n\nrsyslog는 여전히 매우 중요한 로그 시스템입니다.\n특히 원격 로그 서버를 구성하거나 파일 기반 로그 분석이 필요한 환경에서는 필수입니다.\n\n### /etc/rsyslog.conf\n\n이 파일은 rsyslog의 메인 설정 파일입니다.\n실제 운영 환경에서는 `/etc/rsyslog.d/*.conf`로 설정을 분리하는 경우가 많습니다.\n\nrsyslog 설정은 크게 세 가지 요소로 구성됩니다.\n\n* Selector\n* Action\n* Module\n\n---\n\n## Selector 개념\n\nSelector는 `Facility.Priority` 형태로 로그를 선택합니다.\n\n* Facility: 로그를 발생시킨 주체\n* Priority: 로그의 중요도\n\n예시는 다음과 같습니다.\n\n```bash\nauth.info\n*.err\nmail.*\n```\n\n---\n\n## Facility와 Priority 정리\n\n| 구분       | 이름              | 설명            |\n| -------- | --------------- | ------------- |\n| Facility | auth / authpriv | 인증 및 권한 로그    |\n| Facility | cron            | 크론 로그         |\n| Facility | daemon          | 데몬 로그         |\n| Facility | kern            | 커널 로그         |\n| Facility | mail            | 메일 로그         |\n| Facility | syslog          | rsyslog 자체 로그 |\n| Facility | user            | 사용자 프로세스 로그   |\n| Facility | local0~7        | 사용자 정의        |\n| Priority | debug           | 디버그           |\n| Priority | info            | 정보            |\n| Priority | notice          | 주의            |\n| Priority | warning         | 경고            |\n| Priority | err             | 오류            |\n| Priority | crit            | 치명            |\n| Priority | alert           | 즉시 조치         |\n| Priority | emerg           | 시스템 불가        |\n\n---\n\n## Action 설정 예시\n\n```bash\nauthpriv.*   /var/log/secure\nmail.*       -/var/log/maillog\n*.info;mail.none;authpriv.none;cron.none   /var/log/messages\n*.emerg      :omusrmsg:*\n```\n\n* `-` 옵션은 디스크 I/O 부하를 줄이기 위한 버퍼링 옵션입니다.\n* `:omusrmsg:*` 는 모든 로그인 사용자에게 메시지를 출력합니다.\n\n### 커스텀 로그 추가\n\n```bash\n*.*   /var/log/mylog.log\n```\n\n설정 변경 후에는 반드시 재시작합니다.\n\n```bash\nsystemctl restart rsyslog\n```\n\n---\n\n## 시스템 시간 관리\n\n로그 분석에서 시간은 매우 중요합니다.\n시간이 어긋나 있으면 로그 해석 자체가 불가능해집니다.\n\n### 기본 명령어\n\n* `hwclock` : 하드웨어 시계\n* `date` : 시스템 시계\n\n### NTP 개념\n\n* 계층 구조 (stratum 1~3)\n* 유니캐스트 / 브로드캐스트 방식 모두 지원\n* 보안 문제로 ntpd 대신 chronyd 사용\n\n---\n\n## Chronyd 설정\n\n### 시간대 설정\n\n```bash\ntimedatectl list-timezones\ntimedatectl set-timezone Asia/Seoul\n```\n\n### /etc/chronyd.conf 예시\n\n```bash\nserver ntp.xbsd.kr iburst\nserver time.windows.com\n\nallow 192.168.11.0/24\n```\n\n### 동기화 상태 확인\n\n```bash\nchronyc sources -v\n```\n\n---\n\n## 마치며\n\n로그는 시스템의 기록이자 증거입니다.\n단순히 명령어를 외우는 것보다, 로그가 어떤 구조로 저장되고 어떤 도구로 관리되는지를 이해하는 것이 중요합니다.\n이번 내용을 기준으로 로그를 읽어보는 연습을 해보시는 것을 권장드립니다.\n"])</script><script>self.__next_f.push([1,"1e:T1b2a,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n---\n\n## 들어가기\n\n프로세스 관리는 리눅스를 다룰 때 가장 자주 마주치는 영역 중 하나입니다.\n명령어를 실행하고, 멈추고, 백그라운드로 보내는 모든 동작은 결국 프로세스 관리로 귀결됩니다.\n\n이 글에서는 프로세스의 정의를 나열하는 데서 그치지 않고,\n**운영 중 실제로 언제 어떤 판단을 해야 하는지**를 기준으로 정리합니다.\n\n---\n\n## 프로세스란 무엇인가요?\n\n프로세스는 **메모리에 적재되어 실행 중인 프로그램**을 의미합니다.\n디스크에 존재하는 실행 파일은 아직 프로세스가 아니며,\n실행되는 순간 운영체제로부터 PID를 부여받고 프로세스로 관리됩니다.\n\n리눅스 시스템은 하나의 CPU 위에서 여러 프로세스를 처리합니다.\n이를 위해 **시분할(Time Sharing)** 방식을 사용하며,\n짧은 시간 단위로 CPU를 나누어 사용하기 때문에 동시에 실행되는 것처럼 보이게 됩니다.\n\n---\n\n## 프로세스는 어떤 정보로 관리될까요?\n\n리눅스는 각 프로세스를 단순한 실행 단위가 아닌,\n여러 속성을 가진 객체처럼 관리합니다.\n\n* **PID (Process ID)** : 프로세스를 구분하기 위한 고유 번호입니다.\n* **Priority** : CPU 스케줄링 시 적용되는 우선순위입니다.\n* **Nice value** : Priority에 영향을 주는 보정 값으로, 낮을수록 우선순위가 높습니다.\n* **Memory** : 코드, 데이터, 힙, 스택 영역을 포함한 메모리 사용 정보입니다.\n* **Security context** : SELinux에서 사용하는 보안 정책 정보입니다.\n* **Environment** : 실행 시 전달된 환경 변수 집합입니다.\n* **File handles** : 열려 있는 파일, 소켓, 파이프 디스크립터입니다.\n* **Exit status** : 종료 시 부모 프로세스에게 전달되는 결과 코드입니다.\n\n이 정보들은 단순 조회용이 아니라,\n문제 상황에서 원인을 추적하는 단서로 사용됩니다.\n\n---\n\n## PID 1은 왜 중요할까요? (init → systemd)\n\n리눅스에서 **PID 1**은 시스템의 시작점입니다.\n부팅이 완료되면 가장 먼저 실행되며,\n다른 모든 프로세스의 조상이 됩니다.\n\n초기 리눅스에서는 `init`이 이 역할을 담당했습니다.\nSysV init 방식은 스크립트를 순차적으로 실행하는 구조였으며,\n단순하지만 부팅 속도가 느리고 의존성 관리가 어렵다는 문제가 있었습니다.\n\n이를 개선하기 위해 등장한 것이 **systemd**입니다.\nsystemd 역시 PID 1로 동작하지만,\nunit 기반으로 서비스를 관리하고 병렬 실행을 지원합니다.\n\n이로 인해 부팅 속도가 개선되었고,\n서비스 상태 확인과 재시작, 로그 관리가 표준화되었습니다.\n\n* init : 스크립트 기반, 순차 실행\n* systemd : unit 기반, 병렬 실행\n\n---\n\n## 프로세스 상태는 언제 확인해야 할까요?\n\n프로세스는 실행 중 상황에 따라 여러 상태를 오갑니다.\n상태를 이해하면, 프로세스가 멈춘 이유를 추측할 수 있습니다.\n\n* **running** : CPU를 할당받아 실행 중이거나 실행 가능한 상태입니다.\n* **sleeping** : 이벤트나 자원을 기다리는 정상 대기 상태입니다.\n* **uninterruptible sleep** : I/O 작업을 기다리며 시그널로도 깨어나지 않는 상태입니다.\n* **stopped** : SIGSTOP, SIGTSTP 등에 의해 일시 정지된 상태입니다.\n* **zombie** : 실행은 종료되었으나 종료 상태가 회수되지 않은 상태입니다.\n\n특히 zombie 상태는 프로세스 자체보다\n부모 프로세스의 처리 문제를 의심해야 하는 신호입니다.\n\n---\n\n## 프로세스를 어떻게 확인할까요?\n\n### ps : 현재 실행 중인 프로세스 확인\n\n`ps`는 특정 시점의 프로세스 상태를 확인할 때 사용합니다.\n로그인한 터미널에서 어떤 프로세스가 실행 중인지 확인할 때 유용합니다.\n\n```bash\nps\nps -f\nps --forest\n```\n\n`PPID`를 함께 확인하면,\n해당 프로세스가 어떤 부모 프로세스에 의해 실행되었는지 파악할 수 있습니다.\n\n---\n\n### top : 실시간 상태 확인\n\n`top`은 시스템이 느려졌다고 느껴질 때 가장 먼저 실행하는 명령어입니다.\n\n* **Shift + P** : CPU 사용량 기준 정렬\n* **Shift + M** : 메모리 사용량 기준 정렬\n\n특정 프로세스가 자원을 과도하게 사용하고 있는지\n빠르게 파악할 수 있습니다.\n\n---\n\n## 시그널은 언제 사용해야 할까요?\n\n시그널은 프로세스에게 동작을 요청하는 수단입니다.\n운영체제 내부뿐 아니라, 사용자가 직접 전달할 수도 있습니다.\n\n* 커널 → 프로세스\n* 프로세스 → 프로세스\n* 사용자 → 프로세스\n\n`kill` 명령어의 기본 시그널은 **SIGTERM(15)** 입니다.\n이는 강제 종료가 아니라 정상 종료를 요청하는 신호입니다.\n\n```bash\nkill PID\nkill -19 PID\n```\n\n정상 종료가 되지 않을 경우에만\n보다 강한 시그널을 고려하는 것이 일반적입니다.\n\n---\n\n## 포그라운드와 백그라운드 전환\n\n명령어 뒤에 `\u0026`를 붙이면 백그라운드에서 실행됩니다.\n\n```bash\nsleep 10000 \u0026\n```\n\n실행 중인 작업은 `jobs`로 확인할 수 있으며,\n필요에 따라 포그라운드와 백그라운드를 전환할 수 있습니다.\n\n* `fg` : 백그라운드 → 포그라운드\n* `bg` : 정지 상태 → 백그라운드\n\n---\n\n## 우선순위는 언제 조정할까요?\n\n모든 프로세스가 동일한 중요도를 가지지는 않습니다.\nCPU 자원을 덜 사용하도록 조정해야 하는 경우가 있습니다.\n\n이를 위해 `nice`, `renice` 명령어를 사용합니다.\n\n* nice 값 범위 : **-20 ~ 19**\n* 기본값 : **0**\n* 값이 낮을수록 우선순위가 높습니다.\n\n```bash\nnice -n 10 command\nrenice -10 PID\n```\n\n일반 사용자는 0~19 범위만 사용할 수 있으며,\nroot 사용자만 전체 범위를 조정할 수 있습니다.\n\n---\n\n## 시스템 자원 상태 확인\n\n프로세스 상태는 CPU와 메모리 상태와 함께 확인해야 합니다.\n\n### CPU\n\n* `/proc/cpuinfo`\n* `iostat -c`\n* `mpstat`\n\n### 메모리\n\n* `free`\n* `vmstat`\n* `/proc/meminfo`\n* `/proc/swaps`\n\n자원 사용량을 함께 확인해야\n프로세스 문제를 정확히 판단할 수 있습니다.\n\n---\n\n## 프로세스 문제를 만났을 때의 기본 흐름\n\n1. 시스템이 느려졌다면 `top`으로 자원 사용 현황을 확인합니다.\n2. 원인이 되는 프로세스를 찾으면 `ps`로 PID와 부모 프로세스를 확인합니다.\n3. 정상 종료가 가능하다면 SIGTERM을 먼저 전달합니다.\n4. 반복 생성된다면 부모 프로세스나 서비스 관리 방식을 확인합니다.\n\n---\n\n프로세스 관리는 명령어를 외우는 영역이라기보다,\n시스템의 상태를 읽고 판단하는 과정에 가깝습니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #systemd\",\"title\":\"#systemd\",\"desc\":\"\\\"systemd\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-19-control-and-troubleshoot-linux-boot-process\"],\"slugPath\":\"linux/rocky-linux-series-19-control-and-troubleshoot-linux-boot-process\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-19-control-and-troubleshoot-linux-boot-process.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #19 – 부팅 과정 제어와 문제 해결 (RHEL / systemd 기준)\",\"slug\":\"rocky-linux-series-19-control-and-troubleshoot-linux-boot-process\",\"description\":\"RHEL 기반 리눅스 시스템의 부팅 과정을 systemd 중심으로 정리합니다. Runlevel과 Target의 관계, GRUB2 설정, 싱글 유저 모드 진입, root 암호 복구, initramfs와 부팅 순서까지 실제 장애 상황에서 바로 활용할 수 있도록 설명합니다.\",\"date\":\"2026-01-30 19:27\",\"tags\":[\"linux\",\"boot\",\"process\",\"rhel\",\"systemd\",\"target\",\"runlevel\",\"grub2\",\"configuration\",\"grubby\",\"single\",\"user\",\"mode\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/linux-series-19-control-and-troubleshoot-linux-boot-process/og/1769776365273-image.webp\",\"draft\":false},\"content\":\"$1c\"},{\"slug\":[\"linux\",\"rocky-linux-series-11-analyzing-and-storing-logs\"],\"slugPath\":\"linux/rocky-linux-series-11-analyzing-and-storing-logs\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-11-analyzing-and-storing-logs.md\",\"frontmatter
