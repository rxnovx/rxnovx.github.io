ume을 하나로 묶은 논리적인 저장소 풀**입니다.\n\n* 하나 이상의 PV로 구성됩니다.\n* Logical Volume은 반드시 VG 안에서 생성됩니다.\n* 실제 디스크 크기와 관계없이 하나의 큰 저장소처럼 보입니다.\n\n운영 관점에서는\n\"이 서버에서 LVM으로 관리되는 전체 저장 공간\" 정도로 이해해도 무리가 없습니다.\n\n---\n\n### Logical Volume (LV)\n\nLogical Volume은 **사용자가 실제로 사용하는 디스크**입니다.\n\n* 일반적인 파티션과 거의 동일한 역할을 합니다.\n* `/dev/vgname/lvname` 형태로 접근합니다.\n* 파일시스템을 생성하고 마운트하여 사용합니다.\n\nLVM의 장점은 바로 이 LV를\n\n* 확장\n* 축소\n* 이동\n\n할 수 있다는 점입니다.\n\n---\n\n### Logical Extent (LE)\n\nLogical Extent는 Logical Volume을 구성하는 최소 단위입니다.\n\n* Physical Extent와 1:1로 매핑됩니다.\n* LVM은 **PE ↔ LE 매핑 테이블**을 관리합니다.\n\n이 매핑 구조 덕분에\n디스크 공간이 물리적으로 연속되지 않아도\n논리적으로는 하나의 볼륨처럼 사용할 수 있습니다.\n\n---\n\n### Filesystem\n\nFilesystem은 Logical Volume 위에 생성됩니다.\n\n* `ext4`, `xfs` 등이 대표적입니다.\n* 파일시스템 생성 이후 마운트하여 실제 데이터를 저장합니다.\n\n중요한 점은,\nLVM과 파일시스템은 서로 다른 계층이라는 점입니다.\n\nLVM에서 용량을 늘렸다고 해서\n파일시스템이 자동으로 커지지는 않습니다.\n이 차이는 실습 단계에서 반드시 짚고 넘어가야 합니다.\n\n---\n\n## Extent 개념 정리\n\nExtent는 LVM에서 **용량을 관리하고 할당하는 최소 단위**입니다.\n\n디스크 공간을 연속 영역으로 다루지 않고,\n고정 크기의 블록(Extent)으로 나누어 관리함으로써\n\n* 용량 확장\n* 축소\n* 이동\n\n같은 작업을 유연하게 처리할 수 있습니다.\n\n이 개념을 이해하지 못하면\nLVM은 단순한 “디스크 묶기 도구”로만 보이게 됩니다.\n\n---\n\n## 실습 환경 초기화\n\n실습을 위해 기존 디스크의 메타데이터를 초기화합니다.\n\n```bash\n# 디스크 헤더 초기화 (주의)\ndd if=/dev/zero of=/dev/sda bs=512 count=1\ndd if=/dev/zero of=/dev/sdb bs=512 count=1\ndd if=/dev/zero of=/dev/sdc bs=512 count=1\n```\n\n이 작업은 실제 운영 환경에서는 절대 사용하면 안 됩니다.\n순수 실습 환경에서만 의미가 있습니다.\n\n---\n\n## Physical Volume 확인과 생성\n\n### pvs 명령어\n\n`pvs`는 시스템에 존재하는 Physical Volume을 확인하는 명령어입니다.\n\n```bash\npvs\n```\n\n아직 `pvcreate`를 하지 않은 디스크는 목록에 나타나지 않습니다.\n\n---\n\n### pvcreate\n\n디스크를 Physical Volume으로 초기화합니다.\n\n```bash\npvcreate /dev/sda /dev/sdb\n```\n\n이제 `pvs`로 확인하면 LVM 관리 대상으로 편입된 것을 볼 수 있습니다.\n\n---\n\n### pvdisplay\n\n`pvdisplay`는 특정 PV의 상세 정보를 보여줍니다.\n\n이 단계에서는 VG에 속하지 않았기 때문에\nPE 크기와 할당 정보가 아직 비어 있는 상태입니다.\n\n---\n\n## Volume Group 생성\n\n### vgcreate\n\n두 개의 Physical Volume을 하나의 Volume Group으로 묶습니다.\n\n```bash\nvgcreate testvg /dev/sda /dev/sdb\n```\n\n이 순간부터 두 디스크는\n논리적으로 하나의 저장소 풀처럼 동작합니다.\n\n---\n\n### vgdisplay\n\n`vgdisplay`를 통해 VG의 전체 크기와 PE 정보를 확인할 수 있습니다.\n\n여기서 중요한 포인트는 다음입니다.\n\n* PE Size\n* Total PE\n* Free PE\n\n이 값들이 이후 LV 크기 계산의 기준이 됩니다.\n\n---\n\n## Volume Group 삭제\n\n실습이 끝났다면 VG를 제거할 수 있습니다.\n\n```bash\nvgremove testvg\n```\n\nVG를 제거하면 그 안에 속한 LV도 함께 제거됩니다.\n\n---\n\n## Logical Volume 생성\n\n### lvcreate 기본 개념\n\nLogical Volume은 두 가지 방식으로 생성할 수 있습니다.\n\n* **용량 기준 (-L)**\n* **Extent 개수 기준 (-l)**\n\n이 차이를 이해하는 것이 매우 중요합니다.\n\n---\n\n### 용량 기준 생성 (-L)\n\n```bash\nlvcreate -L 310M -n lvred vgcolor\n```\n\nLVM은 항상 PE 단위로 동작하기 때문에,\n요청한 크기가 PE 단위에 맞지 않으면 자동으로 올림 처리됩니다.\n\n---\n\n### Extent 기준 생성 (-l)\n\n```bash\nlvcreate -l 30 -n lvblue vgcolor\n```\n\n이 방식은 PE 단위로 정확한 제어가 필요할 때 유용합니다.\n\n---\n\n### 남은 공간 비율로 생성\n\n```bash\nlvcreate -l 50%FREE vgcolor\n```\n\nVG에 남아 있는 공간의 비율을 기준으로 LV를 생성할 수도 있습니다.\n\n운영 환경에서 자주 사용되는 방식입니다.\n\n---\n\n## 파일시스템 생성과 마운트\n\nLogical Volume 위에 파일시스템을 생성해야 실제로 사용할 수 있습니다.\n\n```bash\nmkfs.xfs /dev/vgcolor/lvred\nmkfs.ext4 /dev/vgcolor/lvblue\n```\n\n그 이후에 마운트하여 사용합니다.\n\n이 단계에서야 비로소 사용 가능한 스토리지가 됩니다.\n\n---\n\n## Advanced LVM: RAID 볼륨\n\nLVM은 단순히 디스크를 묶는 기능만 제공하는 것이 아닙니다.\n\n소프트웨어 RAID 기능도 함께 제공합니다.\n\n---\n\n### RAID 1\n\n* 미러링 방식\n* 데이터가 두 디스크에 동일하게 저장됩니다.\n* 안정성이 가장 높습니다.\n\n---\n\n### RAID 5\n\n* 패리티 분산 저장\n* 디스크 하나까지 장애 복구 가능\n* 읽기 성능이 좋습니다.\n\n단, 두 개 이상의 디스크가 동시에 장애가 나면 데이터가 유실됩니다.\n\n---\n\n### RAID 10\n\n* RAID 1 + RAID 0 구조\n* 성능과 안정성을 모두 확보\n* 디스크 비용이 큽니다.\n\n---\n\n### LVM RAID 실습 예시\n\n```bash\nvgcreate last /dev/sda /dev/sdb /dev/sdc\n\nlvcreate -L 200M -n lvdata1 --type raid1 last\nlvcreate -L 300M -n lvdata2 --type raid5 -i2 last\n\nlvdisplay -m /dev/last/lvdata1\nlvdisplay -m /dev/last/lvdata2\n```\n\n`lvdisplay -m` 명령을 통해\n실제 디스크와 LV 간의 매핑 구조를 확인할 수 있습니다.\n\n---\n\n## 마무리\n\nLVM은 단순한 디스크 관리 기술이 아닙니다.\n\n* 디스크를 유연하게 다루는 사고방식\n* 운영 중인 시스템을 멈추지 않고 확장하는 방법\n\n을 함께 제공합니다.\n"])</script><script>self.__next_f.push([1,"1d:T2294,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n---\n\n## 들어가기\n\n예전의 리눅스 환경에서는 프로그램을 사용하려면 소스 코드를 직접 내려받아 컴파일하는 과정이 일반적이었습니다.\n이 방식은 유연하고 강력했지만, 컴파일 환경을 갖추기 어렵거나 빌드 과정 자체가 부담이 되는 사용자에게는 진입 장벽이 높았습니다.\n\n이러한 불편함을 줄이기 위해 **미리 컴파일된 형태의 프로그램을 배포**하기 시작했고, 그 결과 등장한 개념이 바로 **패키지(package)**와 **패키지 매니저(package manager)** 입니다.\n\n이번 글에서는 리눅스 패키징의 흐름을 간단히 살펴본 뒤, RPM 기반 시스템에서 사용하는 패키지 관리 방식과 `rpm`, `dnf` 명령어, 그리고 저장소(repository)의 개념까지 정리해보겠습니다.\n\n---\n\n## 소프트웨어 패키지 매니저의 등장 배경\n\n패키지는 단순히 실행 파일 하나만을 의미하지 않습니다.\n프로그램 실행에 필요한 라이브러리, 설정 파일, 문서, 스크립트 등을 하나의 묶음으로 관리하는 단위입니다.\n\n패키지 매니저는 다음과 같은 문제를 해결하기 위해 등장했습니다.\n\n* 소프트웨어 설치 과정을 표준화하기 위해\n* 파일이 어디에 설치되었는지 추적하기 위해\n* 업데이트와 삭제를 안전하게 수행하기 위해\n* 의존성 관계를 관리하기 위해\n\n이러한 요구가 쌓이면서 각 운영체제 계열마다 고유한 패키징 시스템이 발전하게 되었습니다.\n\n---\n\n## 유닉스와 리눅스의 패키징 계열\n\n### Unix 계열\n\n* **SysV packages**\n  전통적인 UNIX System V 계열에서 사용되던 패키지 형식입니다.\n  의존성 관리가 체계적이지 않아, 관리자가 설치 순서와 필요 파일을 직접 파악해야 하는 경우가 많았습니다.\n\n### Linux 계열\n\n리눅스는 배포판마다 패키징 정책이 다르며, 이 차이가 배포판의 성격을 결정하기도 합니다.\n\n#### Slackware\n\n* **Slackware Tarballs**\n* `tar` 기반의 단순한 패키지 형식\n* 의존성 자동 해결 기능 없음\n\n관리자가 패키지 구조를 명확히 이해하고 직접 제어하는 방식을 취합니다.\n자동화보다는 단순성과 투명성을 중시하는 배포판입니다.\n\n#### Debian 계열\n\n* **Debian**\n\n  * `dpkg`를 기본 패키지 도구로 사용\n  * `apt`를 통해 의존성 자동 해결과 저장소 기반 설치 제공\n\n* **Ubuntu**\n\n  * Debian 기반\n  * 서버와 데스크톱 환경 모두를 고려한 사용자 친화적 패키징\n\n* **Linux Mint**\n\n  * Ubuntu 기반\n  * 안정성과 사용 편의성을 강조\n\n#### Red Hat 계열\n\n* **Red Hat Enterprise Linux / Fedora / CentOS / Rocky Linux**\n\n  * RPM 포맷 사용\n  * `dnf` (과거 `yum`)을 통해 패키지 관리\n\n* **SUSE Linux Enterprise**\n\n  * RPM 기반\n  * `zypper` 패키지 매니저 사용\n\n* **Mandriva**\n\n  * RPM 기반 배포판\n  * 현재는 역사적 의미를 가지는 배포판\n\n---\n\n## RPM 패키지 파일 구조\n\n### 네이밍 규칙\n\nRPM 패키지 파일명은 다음과 같은 형식을 따릅니다.\n\n```\n이름-버전-릴리즈.아키텍처.rpm\n```\n\n파일명만 보더라도 다음 정보를 유추할 수 있습니다.\n\n* 어떤 소프트웨어인지\n* 어떤 버전인지\n* 어느 배포판용 빌드인지\n* 어떤 CPU 아키텍처를 대상으로 하는지\n\n---\n\n### 아키텍처 구분\n\n* **.src.rpm**\n\n  * 소스 코드와 spec 파일을 포함\n  * 바이너리 RPM을 생성하기 위한 재료\n\n* **.noarch.rpm**\n\n  * CPU 아키텍처에 의존하지 않음\n  * 스크립트, 설정 파일, 인터프리터 언어 패키지에 주로 사용\n\n* **.x86_64.rpm**\n\n  * 64비트 x86 아키텍처용 바이너리 패키지\n\n* **.i586.rpm**\n\n  * 32비트 x86 계열 바이너리 패키지\n\n* **.arm*.rpm**\n\n  * ARM 계열 CPU용 바이너리 패키지\n\n---\n\n### 내부 포맷\n\nRPM 파일은 다음 두 요소로 구성됩니다.\n\n* 바이너리 헤더\n\n  * 메타데이터\n  * 의존성 정보\n\n* 실제 파일 데이터\n\n  * `cpio` 아카이브 형식으로 저장\n\n즉, RPM은 단순한 압축 파일이 아니라 **패키지 관리에 필요한 정보를 함께 담은 구조**입니다.\n\n---\n\n## rpm 명령어로 패키지 상태 확인하기\n\nRPM은 저수준(low-level) 패키지 관리 도구입니다.\n의존성을 자동으로 해결하지는 않지만, 설치 상태를 정확히 조회하는 데 매우 유용합니다.\n\n```bash\nrpm -qa                # 설치된 전체 패키지 목록\nrpm -ql package_name   # 특정 패키지가 설치한 파일 목록\nrpm -qf /usr/bin/ls    # 해당 파일을 제공하는 패키지 확인\n```\n\n실무에서는 `rpm -qa | grep 패키지명` 형태로 자주 사용합니다.\n\n---\n\n## 패키지를 직접 내려받아 설치해보기\n\n공식 저장소를 사용하지 않고, RPM 파일을 직접 설치할 수도 있습니다.\n\n예를 들어 `rpmfind.net` 사이트에서 패키지를 검색한 뒤 다음과 같이 설치할 수 있습니다.\n\n```bash\nwget https://rpmfind.net/linux/centos-stream/10-stream/BaseOS/x86_64/os/Packages/zsh-5.9-15.el10.x86_64.rpm\nwget https://rpmfind.net/linux/centos-stream/10-stream/AppStream/x86_64/os/Packages/git-2.52.0-1.el10.x86_64.rpm\n\nrpm -Uvh zsh-5.9-15.el10.x86_64.rpm\nrpm -Uvh git-2.52.0-1.el10.x86_64.rpm\n```\n\n* `-U` : 업그레이드 또는 신규 설치\n* `-v` : 상세 출력\n* `-h` : 진행 상황 표시\n\n이 방식의 단점은 **의존성 패키지를 직접 해결해야 한다는 점**입니다.\n이 불편함을 해결하기 위해 등장한 것이 `yum`과 `dnf`입니다.\n\n---\n\n## rpm 패키지 삭제\n\n```bash\nrpm -e 패키지명\n```\n\n의존성 검사는 수행하지 않으므로, 시스템 패키지를 제거할 때는 주의가 필요합니다.\n\n---\n\n## 의존성 문제와 패키지 매니저의 역할\n\nRPM 자체는 의존성을 기록하지만, 자동으로 해결해주지는 않습니다.\n이 문제를 해결하기 위해 등장한 고수준(high-level) 도구가 바로 **yum / dnf** 입니다.\n\n이 도구들은 다음을 담당합니다.\n\n* 의존성 자동 해결\n* 저장소(repository) 기반 패키지 관리\n* 업데이트 이력 관리\n\n---\n\n## YUM \u0026 DNF 주요 명령어\n\n```bash\ndnf search keyword        # 패키지 검색\ndnf install package       # 설치 또는 업데이트\ndnf remove package        # 제거\ndnf repolist              # 활성화된 저장소 목록\ndnf grouplist             # 패키지 그룹 목록\ndnf groupinstall \"Group\"  # 그룹 설치\ndnf history               # 트랜잭션 이력\ndnf history info 13       # 특정 트랜잭션 상세\ndnf undo 13               # 트랜잭션 되돌리기\n```\n\n`dnf history` 기능은 시스템 변경 이력을 추적할 수 있어 운영 환경에서 특히 중요합니다.\n\n---\n\n## Repository 개념 이해하기\n\nRepository는 **패키지를 모아둔 저장소**입니다.\n`dnf`는 이 저장소 정보를 기반으로 패키지를 검색하고 내려받습니다.\n\n### 저장소 설정 파일 예시\n\n`/etc/yum.repos.d/rocky.repo`\n\n```ini\n[appstream]\nname=Rocky Linux $releasever - AppStream\nmirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=$basearch\u0026repo=AppStream-$releasever$rltype\ngpgcheck=1\nenabled=1\nmetadata_expire=6h\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-10\n```\n\n각 항목은 저장소의 위치, 보안 검증 여부, 활성화 상태를 정의합니다.\n\n---\n\n## EPEL 저장소\n\nEPEL(Extra Packages for Enterprise Linux)은 RHEL 계열에서 기본 저장소에 포함되지 않은 패키지를 제공합니다.\n\n```bash\ndnf install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm\n```\n\n서버 환경에서 자주 사용하는 유틸리티들이 다수 포함되어 있습니다.\n\n---\n\n## 폐쇄망 환경에서 Repository 구성하기\n\n외부 인터넷이 차단된 환경에서는 자체 저장소 구성이 필요합니다.\n\n### 기본 흐름\n\n```bash\ncp *.rpm /src/repository\ncreaterepo /src/repository\n```\n\n`createrepo`는 RPM 메타데이터를 생성하여 저장소로 인식할 수 있게 합니다.\n\n### 저장소 등록\n\n```bash\ndnf config-manager --add-repo http://server1.example.com/RHEL8\n```\n\n```ini\n[server1.example.com_RHEL8]\nname=created by dnf config-manager from http://server1.example.com/RHEL8\nbaseurl=http://server1.example.com/RHEL8\nenabled=1\ngpgcheck=0\n```\n\n이 방식은 폐쇄망, 내부 테스트 환경, 보안망 구성 시 자주 사용됩니다.\n\n---\n\n## 마무리\n\n패키지 관리 시스템은 리눅스 운영의 핵심 요소입니다.\n단순히 설치 명령어를 외우는 것보다, **왜 이런 구조가 되었는지**를 이해하는 것이 중요합니다.\n\n이번 글에서는 RPM 기반 시스템을 중심으로 패키지 설치와 업데이트 흐름을 정리했습니다.\n"])</script><script>self.__next_f.push([1,"1e:T1ebd,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n---\n\n## 들어가기\n\n리눅스를 사용하다 보면 반드시 마주치게 되는 것이 로그입니다.\n서비스가 왜 죽었는지, 인증이 왜 실패했는지, 시스템에 어떤 일이 있었는지를 가장 정확하게 말해주는 것이 로그입니다.\n이번 글에서는 리눅스에서 로그가 어떻게 관리되는지, 그리고 실제로 어떻게 확인하고 설정하는지를 정리해봅니다.\n\n---\n\n## 리눅스의 로그 관리 흐름\n\n리눅스의 로그 시스템은 한 번에 만들어진 것이 아니라, 시간이 지나며 점진적으로 발전해왔습니다.\n현재 기준으로는 다음 세 가지 흐름을 이해하면 정리가 됩니다.\n\n### Sysklogd\n\nSysklogd는 전통적인 유닉스/리눅스 로그 관리 프로그램입니다.\n`syslogd`, `klogd`로 구성되어 있으며, 텍스트 파일 기반 로그 관리의 출발점이라고 볼 수 있습니다.\n최근 배포판에서는 거의 사용되지 않지만, rsyslog의 기반 개념을 이해하는 데 의미가 있습니다.\n\n### Rsyslog\n\nrsyslog는 Sysklogd를 대체하기 위해 등장한 로그 데몬입니다.\nRHEL 계열 기준으로 기본 로그 시스템으로 오랫동안 사용되어 왔습니다.\n\n특징은 다음과 같습니다.\n\n* 원격 로그 전송 및 수신 가능\n* IPv4 / IPv6 모두 지원\n* 조건 기반 필터링 및 파일 분리 저장 가능\n* 기본적으로 텍스트 파일로 로그를 관리\n\n### systemd Journal\n\nRHEL7부터 시스템 시작 프로세스가 init에서 systemd로 변경되면서, journald라는 로그 관리 시스템이 함께 도입되었습니다.\n기존 파일 기반 로그와 달리 바이너리 형태로 로그를 저장하며, 전용 도구를 통해서만 조회합니다.\n\n---\n\n## systemd Journal의 특징\n\n### 휘발성 로그 구조\n\n기본 설정에서 journal 로그는 휘발성입니다.\n시스템이 재부팅되면 로그가 사라집니다.\n\n휘발성 로그는 다음 경로에 저장됩니다.\n\n* `/run/log/journal/\u003cmachine-id\u003e/`\n\nmachine-id는 시스템을 식별하는 고유 값이며, `hostnamectl` 명령으로 확인할 수 있습니다.\n\n### 영구 로그로 전환하기\n\n로그를 재부팅 후에도 유지하고 싶다면 별도의 디렉토리를 생성해야 합니다.\n\n```bash\nmkdir -p /var/log/journal\n```\n\n이 디렉토리가 존재하면 journald는 자동으로 로그를 영구 저장 모드로 전환합니다.\n최근 버전에서는 서비스 재시작 없이도 바로 적용됩니다.\n\n---\n\n## journalctl 사용법\n\njournal 로그는 일반적인 `cat`이나 `ls`로 확인할 수 없습니다.\n바이너리 형식이기 때문에 전용 뷰어인 `journalctl`을 사용해야 합니다.\n\n### 기본 조회\n\n* 기본 정렬은 오래된 로그가 위에 표시됩니다.\n* 최신 로그부터 보고 싶다면 `-r` 옵션을 사용합니다.\n\n```bash\njournalctl -r\n```\n\n### 줄 수 제한\n\n```bash\njournalctl -n 50\n```\n\n지정한 개수만큼의 로그만 출력합니다.\n\n### 실시간 로그 확인\n\n```bash\njournalctl -f\n```\n\n서비스 로그를 실시간으로 추적할 때 자주 사용합니다.\n\n### Priority 기반 필터링\n\njournal 로그는 0부터 7까지의 priority 값을 가집니다.\n숫자가 낮을수록 더 심각한 로그입니다.\n\n```bash\njournalctl -p 0..3 _COMM=sshd\n```\n\n위 예시는 sshd 프로세스에서 발생한 치명적인 로그만 조회합니다.\n\n| 값 | 이름      | 설명           |\n| - | ------- | ------------ |\n| 0 | emerg   | 시스템 사용 불가 상태 |\n| 1 | alert   | 즉각적인 조치 필요   |\n| 2 | crit    | 치명적 오류       |\n| 3 | err     | 일반 오류        |\n| 4 | warning | 경고           |\n| 5 | notice  | 주목할 이벤트      |\n| 6 | info    | 정보           |\n| 7 | debug   | 디버깅          |\n\n### 기간 및 서비스 기준 조회\n\n```bash\njournalctl --since \"2024-01-01\" --until \"2024-12-31\" -u crond\n```\n\n특정 기간 + 특정 서비스 로그를 함께 조회할 수 있습니다.\n\n서비스 이름이 헷갈릴 경우 다음 명령으로 확인합니다.\n\n```bash\nsystemctl list-unit-files -t service\n```\n\n---\n\n## Journal 로그 씰링(Sealing)\n\njournal 로그는 기본적으로 수정이 가능합니다.\n이를 방지하기 위해 씰링 기능을 사용할 수 있습니다.\n\n```bash\njournalctl --setup-keys --interval=30m\n```\n\n이 기능을 사용하려면 암호화 라이브러리가 필요합니다.\n\n```bash\ndnf install libgcrypt\n```\n\n씰링이 적용되면 로그 위변조 여부를 검증할 수 있습니다.\n\n---\n\n## Rsyslog 구조 이해하기\n\nrsyslog는 여전히 매우 중요한 로그 시스템입니다.\n특히 원격 로그 서버를 구성하거나 파일 기반 로그 분석이 필요한 환경에서는 필수입니다.\n\n### /etc/rsyslog.conf\n\n이 파일은 rsyslog의 메인 설정 파일입니다.\n실제 운영 환경에서는 `/etc/rsyslog.d/*.conf`로 설정을 분리하는 경우가 많습니다.\n\nrsyslog 설정은 크게 세 가지 요소로 구성됩니다.\n\n* Selector\n* Action\n* Module\n\n---\n\n## Selector 개념\n\nSelector는 `Facility.Priority` 형태로 로그를 선택합니다.\n\n* Facility: 로그를 발생시킨 주체\n* Priority: 로그의 중요도\n\n예시는 다음과 같습니다.\n\n```bash\nauth.info\n*.err\nmail.*\n```\n\n---\n\n## Facility와 Priority 정리\n\n| 구분       | 이름              | 설명            |\n| -------- | --------------- | ------------- |\n| Facility | auth / authpriv | 인증 및 권한 로그    |\n| Facility | cron            | 크론 로그         |\n| Facility | daemon          | 데몬 로그         |\n| Facility | kern            | 커널 로그         |\n| Facility | mail            | 메일 로그         |\n| Facility | syslog          | rsyslog 자체 로그 |\n| Facility | user            | 사용자 프로세스 로그   |\n| Facility | local0~7        | 사용자 정의        |\n| Priority | debug           | 디버그           |\n| Priority | info            | 정보            |\n| Priority | notice          | 주의            |\n| Priority | warning         | 경고            |\n| Priority | err             | 오류            |\n| Priority | crit            | 치명            |\n| Priority | alert           | 즉시 조치         |\n| Priority | emerg           | 시스템 불가        |\n\n---\n\n## Action 설정 예시\n\n```bash\nauthpriv.*   /var/log/secure\nmail.*       -/var/log/maillog\n*.info;mail.none;authpriv.none;cron.none   /var/log/messages\n*.emerg      :omusrmsg:*\n```\n\n* `-` 옵션은 디스크 I/O 부하를 줄이기 위한 버퍼링 옵션입니다.\n* `:omusrmsg:*` 는 모든 로그인 사용자에게 메시지를 출력합니다.\n\n### 커스텀 로그 추가\n\n```bash\n*.*   /var/log/mylog.log\n```\n\n설정 변경 후에는 반드시 재시작합니다.\n\n```bash\nsystemctl restart rsyslog\n```\n\n---\n\n## 시스템 시간 관리\n\n로그 분석에서 시간은 매우 중요합니다.\n시간이 어긋나 있으면 로그 해석 자체가 불가능해집니다.\n\n### 기본 명령어\n\n* `hwclock` : 하드웨어 시계\n* `date` : 시스템 시계\n\n### NTP 개념\n\n* 계층 구조 (stratum 1~3)\n* 유니캐스트 / 브로드캐스트 방식 모두 지원\n* 보안 문제로 ntpd 대신 chronyd 사용\n\n---\n\n## Chronyd 설정\n\n### 시간대 설정\n\n```bash\ntimedatectl list-timezones\ntimedatectl set-timezone Asia/Seoul\n```\n\n### /etc/chronyd.conf 예시\n\n```bash\nserver ntp.xbsd.kr iburst\nserver time.windows.com\n\nallow 192.168.11.0/24\n```\n\n### 동기화 상태 확인\n\n```bash\nchronyc sources -v\n```\n\n---\n\n## 마치며\n\n로그는 시스템의 기록이자 증거입니다.\n단순히 명령어를 외우는 것보다, 로그가 어떤 구조로 저장되고 어떤 도구로 관리되는지를 이해하는 것이 중요합니다.\n이번 내용을 기준으로 로그를 읽어보는 연습을 해보시는 것을 권장드립니다.\n"])</script><script>self.__next_f.push([1,"1f:T1944,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n## 들어가기\n이전 글들에서는 리눅스에서 파일과 디렉터리를 다루는 방법을 중심으로 살펴봤습니다.\n이번 글에서는 그 파일과 디렉터리에 **누가, 무엇을, 어디까지 할 수 있는지**를 제어하는 핵심 개념인 **파일 시스템 권한(File System Permissions)** 을 정리합니다.\n\n리눅스는 기본적으로 멀티 유저 시스템입니다.\n혼자 쓰는 서버라 하더라도, 권한 개념은 보안과 안정성을 지탱하는 가장 기본적인 장치입니다.\n이 장은 이후 사용자 관리, 보안 설정, 서버 운영 전반의 토대가 됩니다.\n\n---\n\n## File Ownership\n\n리눅스의 모든 파일과 디렉터리는 **소유자(owner)** 와 **그룹(group)** 을 가집니다.\n권한 판단의 출발점은 항상 이 두 가지입니다.\n\n### chown : 파일의 소유자 및 그룹 변경\n\n`chown` 명령어는 파일 또는 디렉터리의 소유자와 그룹을 변경할 때 사용합니다.\n\n```bash\nchown [옵션] 소유자:그룹 대상\n```\n\n#### 기본 예제\n\n```bash\n# 소유자를 test 유저로 변경\nchown test /tmp/backup/susan\n\n# 그룹만 cloud로 변경\nchown :cloud /tmp/backup/susan\n\n# 소유자와 그룹을 동시에 변경\nchown hpe:cloud /tmp/backup/susan\n```\n\n#### 재귀적 변경 (-R)\n\n```bash\n# 하위 파일과 디렉터리까지 모두 변경\nchown -R hpe:cloud /tmp/backup/susan\n```\n\n운영 환경에서는 특정 디렉터리 트리 전체의 소유권을 변경해야 하는 경우가 많기 때문에 `-R` 옵션은 자주 사용됩니다.\n\n---\n\n## File and Directory Permissions\n\n권한(permission)은 **누가 무엇을 할 수 있는지**를 정의하는 규칙입니다.\n권한이 없다면 파일을 읽을 수도, 수정할 수도, 실행할 수도 없습니다.\n\n`ls -l` 또는 `ls -al` 명령을 실행하면 왼쪽에 10자리 문자열이 출력됩니다.\n\n```text\ndrwxr-xr-x\n```\n\n이 문자열 안에 파일 타입과 권한 정보가 모두 들어 있습니다.\n\n---\n\n## 파일 타입 (첫 번째 문자)\n\n| 문자 | 의미                   |\n| -- | -------------------- |\n| d  | 디렉터리 (directory)     |\n| -  | 일반 파일 (regular file) |\n| l  | 심볼릭 링크               |\n| b  | 블록 디바이스              |\n| c  | 문자 디바이스              |\n| s  | 소켓                   |\n| p  | 네임드 파이프 (FIFO)       |\n\n### 보완 설명\n\n* **디렉터리(d)**\n\n  * 다른 파일을 담는 컨테이너\n  * `cd`, `ls` 명령의 대상\n* **일반 파일(-)**\n\n  * 텍스트, 바이너리, 실행 파일 포함\n* **심볼릭 링크(l)**\n\n  * 다른 파일이나 디렉터리를 가리키는 참조\n* **블록/문자 디바이스**\n\n  * `/dev` 아래에서 주로 확인\n* **소켓 / 파이프**\n\n  * 프로세스 간 통신 용도\n\n---\n\n## rwx 권한 구조\n\n```text\ndrwxr-xr-x\n│ └── others\n│ └──── group\n└──────── owner\n```\n\n| 위치   | 의미                |\n| ---- | ----------------- |\n| 첫 글자 | 파일 타입             |\n| 1~3  | 소유자(owner) 권한     |\n| 4~6  | 그룹(group) 권한      |\n| 7~9  | 기타 사용자(others) 권한 |\n\n---\n\n## r / w / x 권한 의미\n\n| 권한 | 파일(File) | 디렉터리(Directory) |\n| -- | -------- | --------------- |\n| r  | 파일 내용 읽기 | 목록 조회(ls)       |\n| w  | 파일 수정    | 파일 생성·삭제·이름 변경  |\n| x  | 파일 실행    | 디렉터리 접근(cd)     |\n\n디렉터리에서 **삭제 권한은 파일이 아니라 상위 디렉터리의 w 권한**으로 결정된다는 점이 중요합니다.\n\n---\n\n## Permission 숫자 표기법 (Octal)\n\n리눅스 권한은 8진수로 표현할 수 있습니다.\n실무에서는 이 방식이 가장 많이 사용됩니다.\n\n### 기본 비트 값\n\n| 값 | 의미 |\n| - | -- |\n| 4 | r  |\n| 2 | w  |\n| 1 | x  |\n\n### 조합 예시\n\n| 숫자 | 권한  | 의미       |\n| -- | --- | -------- |\n| 7  | rwx | 읽기·쓰기·실행 |\n| 6  | rw- | 읽기·쓰기    |\n| 5  | r-x | 읽기·실행    |\n| 4  | r-- | 읽기       |\n| 0  | --- | 없음       |\n\n### 3자리 권한 예시\n\n| 숫자  | 의미                |\n| --- | ----------------- |\n| 755 | 소유자 전체, 나머지 읽기·실행 |\n| 700 | 소유자만 접근           |\n| 644 | 일반 파일 기본값         |\n| 777 | 모두 전체 권한 (주의 필요)  |\n\n---\n\n## chmod : 권한 변경\n\n### 숫자 방식\n\n```bash\nchmod 644 file.txt\nchmod 755 script.sh\n```\n\n### 문자 방식\n\n```bash\nchmod u+x file\nchmod g-w file\nchmod o=r file\nchmod a+rx file\n```\n\n| 대상 | 의미     |\n| -- | ------ |\n| u  | 소유자    |\n| g  | 그룹     |\n| o  | 기타 사용자 |\n| a  | 전체     |\n\n---\n\n## 디렉터리 삭제 권한 실습 개념\n\n파일을 삭제할 수 있는지는 **파일 권한이 아니라 디렉터리 권한**으로 판단됩니다.\n\n쓰기(w) 권한이 없는 디렉터리에서는 파일을 생성하거나 삭제할 수 없습니다.\n이 개념은 보안 사고에서 매우 중요하게 작용합니다.\n\n---\n\n## SUID / SGID / Sticky Bit\n\n일반적인 rwx 권한 외에, **권한 동작 자체를 변경하는 특수 퍼미션**이 존재합니다.\n\n| 비트         | 의미                  |\n| ---------- | ------------------- |\n| SUID       | 실행 시 파일 소유자 권한으로 실행 |\n| SGID       | 실행 시 파일 그룹 권한으로 실행  |\n| Sticky Bit | 공용 디렉터리 보호          |\n\n### 대표 예시\n\n```bash\n-rwsr-xr-x /bin/passwd\ndrwxrwxrwt /tmp\n```\n\n### SUID\n\n* 실행한 사용자가 누구든 **파일 소유자 권한**으로 실행\n* 대표 사례: `passwd`\n\n### SGID\n\n* 실행 시 파일의 **그룹 권한**으로 동작\n* 디렉터리에 적용 시 하위 파일이 동일 그룹을 상속\n\n### Sticky Bit\n\n* 공용 디렉터리에서 파일 삭제 제한\n* 본인 소유 파일만 삭제 가능\n\n---\n\n## 특수 퍼미션 설정 방법\n\n### 문자 방식\n\n```bash\nchmod u+s file   # SUID\nchmod g+s file   # SGID\nchmod o+t dir    # Sticky Bit\n```\n\n### 숫자 방식\n\n| 값    | 의미         |\n| ---- | ---------- |\n| 4xxx | SUID       |\n| 2xxx | SGID       |\n| 1xxx | Sticky Bit |\n\n```bash\nchmod 4755 file\nchmod 2770 dir\nchmod 1777 /tmp\n```\n\n---\n\n## 마무리\n\n파일 시스템 권한은 단순한 문법이 아니라, **리눅스 보안 모델의 핵심**입니다.\n이 개념을 정확히 이해하지 못하면 사용자 관리, 서비스 운영, 보안 설정 모두 흔들릴 수 있습니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #rocky\",\"title\":\"#rocky\",\"desc\":\"\\\"rocky\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-16-manage-logical-volume-management-lvm\"],\"slugPath\":\"linux/rocky-linux-series-16-manage-logical-volume-management-lvm\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-16-manage-logical-volume-management-lvm.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #16 – LVM(Logical Volume Management) 스토리지 관리\",\"slug\":\"rocky-linux-series-16-manage-logical-volume-management-lvm\",\"description\":\"리눅스에서 Logical Volume Management(LVM)를 사용해 디스크를 유연하게 관리하는 방법을 정리합니다. Physical Volume, Volume Group, Logical Volume 구조부터 Extent 개념, LVM RAID까지 실습 흐름 중심으로 설명합니다.\\n\",\"date\":\"2026-01-29 22:01\",\"tags\":[\"linux\",\"rocky\",\"rhel\",\"lvm\",\"logical\",\"volume\",\"management\",\"storage\",\"disk\",\"physical\"
