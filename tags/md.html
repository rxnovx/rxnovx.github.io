계\n* 실행 / 설정 / 클릭 단위\n\n예시:\n\n```md\n### Termux 설치\n### Node.js 설치\n### Next.js 프로젝트 생성\n```\n\n\u003e [!NOTE] H3\n\u003e 👉 여기서 멈추고 **그대로 따라 해도 되는 단위**\n\n\n---\n\n### H4 (`####`) — 옵션 / 분기 / 주의사항\n\nH4는 선택입니다. 내용을 굳이 안해도 되지만, 따라 했을 경우 부가적인 결과가 따라오는 것에 대한 내용을 적습니다.\n\n* 안 해도 되지만 알면 좋은 내용\n* 실수 방지 포인트\n\n예시:\n\n```md\n#### 권장 Node 버전\n#### 에러가 발생하는 경우\n```\n\n\u003e [!WARNING] H4 (주의)\n\u003e 👉 H4가 많아지면 글이 산만해짐 (최소화 권장)\n\n---\n\n## 2️⃣ 문법을 쓰는 판단 기준 (\"어떨 때 쓰느냐\")\n\n\u003e ❌ 문법 기능 설명\n\u003e ✅ 이 상황이면 이 문법을 쓴다\n\n헤딩은 목차를 나누는 단위입니다. #이 많아질수록 중요도가 떨어지는 것이 아니라 점점 더 세부적인 내용으로 들어가는 것입니다.\n다음은 다른 문법들입니다. 목록이나 코드블럭, 강조, 구분선 등등의 문법들을 사용하는 방법이 아닌 어떤 상황에 쓰는 것인지 알아봅니다.\n\n---\n\n### 📌 목록 (`-`, `1.`)\n\n**언제 쓰나?**\n\n* 나열이 목적일 때\n\n* 문장으로 쓰면 숨 막힐 때\n\n* 순서 중요 ❌ → `-`\n\n* 순서 중요 ⭕ → `1. 2. 3.`\n\n예시:\n\n```md\n## 준비물\n- 안드로이드 태블릿\n- 키보드\n- 인터넷 연결\n```\n\n```md\n## 설치 순서\n1. Termux 설치\n2. Node.js 설치\n3. Next.js 생성\n```\n\n---\n\n### 📦 코드 블록 (```)\n\n**언제 쓰나?**\n\n* 복사/붙여넣기가 필요한 순간\n* 실행을 요구할 때\n\n구조 원칙:\n\n* 설명 → 코드 → 결과\n\n예시:\n\n~~~ md\n``` bash\npkg install nodejs\n```\n~~~\n\n👉 설명 중간에 코드를 끼워 넣지 말 것\n\n---\n\n### 🧠 인용 (`\u003e`)\n\n**언제 쓰나?**\n- 독자에게 잠깐 멈추게 할 때\n- 주의 / 전제 / 경험 기반 조언\n\n예시:\n```md\n\u003e 이 단계에서 에러가 나면 대부분 권한 문제입니다.\n```\n\n👉 남발하면 훈계처럼 보임\n\n---\n\n### ✨ 강조 (`**`)\n\n**언제 쓰나?**\n\n* 스크롤 중에도 눈에 걸려야 하는 핵심 단어\n\n예시:\n\n```md\n이 방법의 **가장 큰 장점**은 비용이 들지 않는다는 점입니다.\n```\n\n👉 한 문장에 1개까지만 사용\n\n---\n\n### 🧱 구분선 (`---`)\n\n**언제 쓰나?**\n\n* 이론 → 실습\n* 배경 → 실행\n* 큰 맥락 전환 지점\n\n👉 \"이제부터 다른 이야기\"라는 신호\n\n---\n\n## 3️⃣ 문단을 나누는 기준\n\n### 원칙\n\n* 한 문단 = 한 주장 / 한 설명\n* 3줄 이상이면 분리 고려\n\n❌ 나쁜 예:\n\n```md\nNext.js는 리액트 기반의 프레임워크이며 서버 사이드 렌더링을 지원하고 정적 사이트 생성도 가능하며 최근에는 App Router가 도입되어 구조가 변경되었다.\n```\n\n✅ 좋은 예:\n\n```md\nNext.js는 React 기반의 프레임워크입니다.\n서버 사이드 렌더링과 정적 사이트 생성을 지원합니다.\n\n최근에는 App Router가 도입되면서\n프로젝트 구조와 사고 방식이 크게 달라졌습니다.\n```\n\n---\n\n## 5️⃣ 한 문장 요약\n\n마크다운 언어는 생각을 정리하기 정말 좋은 도구라고 생각합니다.\n저는 학창시절부터 메모하는 것이 서툴렀는데 마크다운 도구를 활용해서 정리하는 방법에 조금씩 익숙해지고 있습니다.\n\n\u003e **마크다운은 꾸미는 도구가 아니라\n\u003e 생각을 계층화하는 도구다.**\n\n- 헤딩 = 생각의 크기\n- 문법 = 독자의 행동을 유도하는 신호\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #md\",\"title\":\"#md\",\"desc\":\"\\\"md\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"notes\",\"how-to-use-markdown\"],\"slugPath\":\"notes/how-to-use-markdown\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/notes/how-to-use-markdown.md\",\"frontmatter\":{\"title\":\"제대로 쓰는 마크다운\",\"slug\":\"how-to-use-markdown\",\"description\":\"마크다운 언어를 어떻게 사용하는지, 문법적으로가 아닌 실제 글을 쓸때 어떤 상황에 어떤 문법을 써야하는지에 대해 이야기합니다.\",\"date\":\"2026-01-07 14:59:08\",\"tags\":[\"markdown\",\"md\",\"language\",\"mind\",\"howtousemarkdown\"],\"category\":\"notes\",\"cover\":\"images/og.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/md\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/tags/termux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"android\",\"href\":\"/tags/android\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky\",\"href\":\"/tags/rocky\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"network\",\"href\":\"/tags/network\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"systemd\",\"href\":\"/tags/systemd\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"system\",\"href\":\"/tags/system\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"linux-basics\",\"href\":\"/tags/linux-basics\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"code-server\",\"href\":\"/tags/code-server\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"vscode\",\"href\":\"/tags/vscode\",\"active\":false,\"prefix\":\"#\"}]}]\n"])</script><script>self.__nex
