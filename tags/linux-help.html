기반으로 매뉴얼을 검색하고 싶을 경우에는 다음 명령어를 사용합니다.\n\n```bash\nman -k 키워드\n```\n\n이는 내부적으로 매뉴얼 인덱스를 검색하는 방식이며,\n환경에 따라 인덱스가 최신 상태가 아닐 수도 있습니다.\n\n이럴 경우에는 `mandb` 명령어를 사용하여\n수동으로 매뉴얼 인덱스 데이터베이스를 생성할 수 있습니다.\n\n```bash\nmandb\n```\n\n---\n\n## man 페이지의 기호를 예제로 이해하기\n\n`man` 페이지에서 사용하는 기호들은\n처음 보면 의미를 파악하기 어렵습니다.\n아래에서는 실제 메뉴얼에 등장하는 예시를 기준으로\n각 기호가 어떤 의미를 가지는지 정리합니다.\n\n---\n\n### 대괄호 `[]` : 생략 가능한 옵션 또는 인수\n\n대괄호로 묶인 항목은 반드시 입력할 필요가 없는 선택 사항입니다.\n\n```text\nls [-a] [-l] [file ...]\n```\n\n위 예시는 다음과 같이 해석할 수 있습니다.\n\n* `-a`, `-l` 옵션은 필요할 때만 사용합니다.\n* `file` 인수는 생략할 수 있습니다.\n* 인수를 생략하면 현재 디렉토리를 기준으로 동작합니다.\n\n---\n\n### 꺾쇠 괄호 `\u003c\u003e` : 반드시 필요한 값\n\n꺾쇠 괄호로 표시된 항목은 반드시 값을 입력해야 합니다.\n실제 메뉴얼에서는 문자열, 숫자, 경로 등이 들어갑니다.\n\n```text\nuseradd -u \u003cUID\u003e \u003cusername\u003e\n```\n\n위 예시는 다음을 의미합니다.\n\n* `\u003cUID\u003e`에는 숫자 값이 반드시 들어가야 합니다.\n* `\u003cusername\u003e`은 생성할 사용자 이름입니다.\n* 두 값 모두 생략할 수 없습니다.\n\n---\n\n### 세로 막대 `|` : 여러 항목 중 하나 선택\n\n세로 막대는 여러 선택지 중 하나를 선택해야 함을 의미합니다.\n동시에 사용할 수는 없습니다.\n\n```text\nshutdown [-h | -r | -c] [time]\n```\n\n위 예시는 다음과 같이 해석됩니다.\n\n* `-h`, `-r`, `-c` 중 하나만 사용할 수 있습니다.\n* 시스템 종료, 재부팅, 예약 취소 중 하나를 선택합니다.\n\n---\n\n### 말줄임표 `...` : 반복 가능\n\n말줄임표는 동일한 형태의 인수를 여러 개 사용할 수 있음을 의미합니다.\n\n```text\nchmod [OPTION]... MODE[,MODE]... FILE...\n```\n\n위 예시는 다음을 의미합니다.\n\n* `OPTION`은 여러 개 지정할 수 있습니다.\n* `FILE` 인수는 하나 이상 지정할 수 있습니다.\n* 여러 파일에 동일한 권한 설정을 적용할 수 있습니다.\n\n---\n\n### 기호를 읽는 순서\n\n처음 `man` 페이지를 볼 때는 다음 순서로 읽는 것이 좋습니다.\n\n1. 대괄호(`[]`)로 선택 사항을 구분합니다.\n2. 꺾쇠 괄호(`\u003c\u003e`)로 반드시 필요한 값을 확인합니다.\n3. 세로 막대(`|`)로 동시에 사용할 수 없는 옵션을 확인합니다.\n4. 말줄임표(`...`)로 반복 가능한 인수를 파악합니다.\n\n기호의 의미를 알고 나면,\n긴 메뉴얼에서도 필요한 사용법만 빠르게 골라볼 수 있습니다.\n\n\n`man` 외에도 `info` 명령어를 통해 문서를 확인할 수 있습니다.\n일부 GNU 계열 명령어는 `info` 문서에 더 자세한 설명이 포함되어 있습니다.\n\n```bash\ninfo 명령어\n```\n\n---\n\n현재 로그인한 사용자나 시스템 접속 이력을 확인하기 위한 명령어도 자주 사용됩니다.\n\n```bash\nwho     # 현재 로그인한 사용자\nlast    # 로그인 이력\n```\n\n---\n\n## 여러 가지 시스템 정보 확인 방법\n\n리눅스 시스템의 기본 정보를 확인할 수 있는 대표적인 명령어는 다음과 같습니다.\n\n```bash\ncat /etc/os-release   # 운영체제 버전 정보\nhostnamectl           # 시스템, 커널, 하드웨어 정보 개요\nfree -h               # 메모리 사용량 (-h: 사람이 읽기 쉬운 단위)\nlscpu                 # CPU 정보\nip addr               # 네트워크 인터페이스 및 IP 정보\n```\n\n과거에 사용되던 `ifconfig` 명령어는 현재 deprecated 상태이며,\n대신 `ip` 명령어 사용\n\n## 마치면서\n\n리눅스는 대부분의 명령어에 대해\n스스로 도움말과 문서를 제공하도록 설계되어 있습니다.\n\n다음 포스트에서는\n터미널 환경에서 자주 사용하는 에디터에 대해 정리해보겠습니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #linux-help\",\"title\":\"#linux-help\",\"desc\":\"\\\"linux-help\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-4-get-help\"],\"slugPath\":\"linux/rocky-linux-series-4-get-help\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-4-get-help.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #4 – 텍스트 환경에서 도움말 확인하기\",\"slug\":\"rocky-linux-series-4-get-help\",\"description\":\"리눅스 텍스트 환경에서 명령어 도움말을 확인하는 방법을 정리했습니다. \\n--help, man, info 명령어를 통해 사용법과 시스템 정보를 확인하는 기본 흐름을 다룹니다.\",\"date\":\"2026-01-24 23:44\",\"tags\":[\"linux\",\"rocky-linux\",\"linux-basics\",\"command-line\",\"linux-help\",\"man-page\",\"rocky-linux-series\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/rocky-linux-series-4-get-help/og/1769517342491-image.webp\",\"draft\":false},\"content\":\"$1d\"}],\"basePath\":\"/tags/linux-help\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/tags/termux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"android\",\"href\":\"/tags/android\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky\",\"href\":\"/tags/rocky\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"network\",\"
