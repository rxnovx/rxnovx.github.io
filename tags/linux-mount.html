 다음을 확인하는 용도입니다.\n\n* 서버가 살아 있는지\n* 어떤 공유 이름이 존재하는지\n* 인증이 필요한지\n\n실무에서는 **이 단계에서 대부분의 오타와 설정 오류를 잡습니다.**\n\n---\n\n## CIFS 수동 마운트\n\n마운트 포인트를 하나 준비합니다.\n\n```bash\nmkdir /mnt/win\n```\n\n이제 CIFS 타입으로 직접 마운트합니다.\n\n```bash\nmount -t cifs -o user=hpe,vers=1.0 //59.29.224.185/windata /mnt/win\n```\n\n여기서 중요한 포인트는 다음입니다.\n\n* `//서버IP/공유이름` 형식\n* `vers=` 옵션은 **SMB 프로토콜 버전**\n* 오래된 장비나 NAS는 1.0을 요구하는 경우가 있음\n\n마운트가 되었다면 `/mnt/win` 아래에서 바로 파일 접근이 가능합니다.\n\n---\n\n## 자격 증명 파일 사용하기\n\n명령줄에 사용자 이름과 비밀번호를 직접 쓰는 방식은 운영 환경에서 적절하지 않습니다.\n이를 위해 **credential 파일**을 사용합니다.\n\n```bash\nvi /root/credential.cre\n```\n\n```text\nusername=hpe\npassword=비밀번호\n```\n\n권한은 반드시 제한합니다.\n\n```bash\nchmod 600 /root/credential.cre\n```\n\n이제 `/etc/fstab`에 등록합니다.\n\n```bash\n//59.29.224.185/windata  /mnt/win  cifs  defaults,vers=1.0,credentials=/root/credential.cre  0 0\n```\n\n이 방식의 장점은 다음과 같습니다.\n\n* 재부팅 시 자동 마운트 가능\n* 비밀번호 노출 최소화\n* 설정 관리 용이\n\n---\n\n## AutoFS가 필요한 이유\n\n`/etc/fstab` 기반의 마운트에는 한계가 있습니다.\n\n* 서버가 일시적으로 내려가면 부팅이 멈출 수 있음\n* 사용하지 않아도 항상 마운트 유지\n* 네트워크 장애에 취약\n\n이를 해결하기 위해 등장한 것이 **AutoFS**입니다.\n\nAutoFS는 다음처럼 동작합니다.\n\n* 디렉토리에 접근하는 순간 자동 마운트\n* 일정 시간 사용하지 않으면 자동 언마운트\n* 네트워크 스토리지에 매우 적합\n\n---\n\n## AutoFS 기본 구조\n\nAutoFS는 두 단계 설정 구조를 가집니다.\n\n1. **마스터 설정** : 어떤 경로를 AutoFS가 관리할지\n2. **맵 파일** : 실제 마운트 규칙\n\nRHEL 8 이후에는 `/etc/auto.master`를 직접 수정하지 않고,\n`/etc/auto.master.d/` 아래에 파일을 추가하는 방식을 권장합니다.\n\n확장자는 반드시 `.autofs` 로 끝나야 합니다.\n\n```bash\ndnf install autofs\nls /etc/auto.master\nls /etc/auto.master.d\n```\n\n---\n\n## 다이렉트 맵 방식 (Direct Map)\n\n다이렉트 맵은 **절대 경로 하나를 특정 공유에 바로 연결**하는 방식입니다.\n\n### 마스터 설정\n\n```bash\nvi /etc/auto.master.d/good.autofs\n```\n\n```text\n/-    /etc/morning\n```\n\n`/-` 는 다이렉트 맵을 의미합니다.\n\n### 맵 파일\n\n```bash\nvi /etc/morning\n```\n\n```text\n/win  -fstype=cifs,vers=1.0,credentials=/root/credential.cre  ://59.29.224.185/windata\n```\n\nCIFS의 경우 **경로 앞에 콜론(:)** 을 반드시 붙입니다.\n\n서비스를 시작합니다.\n\n```bash\nsystemctl start autofs\n```\n\n이제 `/win` 디렉토리에 접근하는 순간 자동으로 마운트됩니다.\n\n---\n\n## 인다이렉트 맵 방식 (Indirect Map)\n\n인다이렉트 맵은 **상위 디렉토리 아래에 여러 하위 마운트**를 만드는 방식입니다.\n사용자 홈 디렉토리 구성에 매우 자주 사용됩니다.\n\n### 서버 측 (NFS 예시)\n\n```bash\nvi /etc/exports\n/netusers *(rw,sync)\n```\n\n```bash\nmkdir -p /netusers/{tom,susan,harry}\nexportfs -var\n```\n\n### 클라이언트 측\n\n```bash\nvi /etc/auto.master.d/my.autofs\n```\n\n```text\n/users   /etc/day\n```\n\n```bash\nvi /etc/day\n```\n\n```text\n*   192.168.11.33:/netusers/\u0026\n```\n\n`*` 와 `\u0026` 를 사용하면,\n사용자 수가 늘어나도 설정을 한 줄로 유지할 수 있습니다.\n\n```bash\nsystemctl restart autofs\n```\n\n이제 `/users/tom`, `/users/susan` 처럼 접근 시 자동으로 마운트됩니다.\n\n---\n\n## 네트워크 계정과 홈 디렉토리 문제\n\nLDAP, IPA, AD 같은 **중앙 계정 관리 시스템**을 사용하면,\n계정 정보는 공유되지만 **로컬 홈 디렉토리는 자동으로 생성되지 않습니다.**\n\n홈 디렉토리가 없으면:\n\n* 작업 공간이 없음\n* 쉘 환경 구성 불가\n* 실질적인 사용이 어려움\n\n이 문제를 해결하는 가장 일반적인 방식이 바로:\n\n* NFS로 홈 디렉토리 중앙화\n* AutoFS로 사용자 접근 시 자동 마운트\n\n입니다.\n\n---\n\n## 정리하며\n\n이번 글에서는 다음 흐름을 정리했습니다.\n\n* SMB(CIFS)를 이용한 네트워크 스토리지 사용\n* 수동 마운트와 credential 관리\n* AutoFS의 구조와 필요성\n* 다이렉트 맵과 인다이렉트 맵\n* 중앙 계정 환경에서의 홈 디렉토리 설계\n\n네트워크 스토리지는 설정 자체보다,\n**운영 시 어떤 문제가 생기는지까지 고려하는 것**이 더 중요합니다.\nAutoFS는 그 고민을 상당 부분 덜어주는 도구입니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #linux-mount\",\"title\":\"#linux-mount\",\"desc\":\"\\\"linux-mount\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-18-smb-cifs-autofs\"],\"slugPath\":\"linux/rocky-linux-series-18-smb-cifs-autofs\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-18-smb-cifs-autofs.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #18 – SMB(CIFS)와 AutoFS로 네트워크 스토리지 사용하기\",\"slug\":\"rocky-linux-series-18-smb-cifs-autofs\",\"description\":\"리눅스에서 SMB(CIFS)를 이용해 Windows 및 NAS 공유 스토리지를 마운트하는 방법과 AutoFS를 활용한 자동 마운트 구성 방식을 정리합니다. 수동 마운트, 자격 증명 관리, 다이렉트·인다이렉트 맵 방식, 중앙 계정 환경에서의 홈 디렉토리 설계까지 실무 관점에서 설명합니다.\",\"date\":\"2026-01-30 00:21\",\"tags\":[\"linux\",\"rocky-linux\",\"
