ol B]\n   |                                                 [MCP Server: Data C]\n   v\n[Observability]\n  - trace(span: tool call)\n  - audit(log: who/what/why)\n  - eval(정확도/안전/회복률)\n```\n\n여기서 “모델 개선”은 LLM 박스만 바꾸는 일이고, “시스템 개선”은 policy/exec/obs를 바꾸는 일임.\n\nMCP가 중요한 지점은 모델 ↔ 도구/데이터 연결을 표준화함으로써, 성능 논쟁을 “모델”에서 “런타임 통제/운영”으로 이동시키는 촉매 역할을 한다는 점임.\n\n---\n\n# 실제 사례 1: AutoGPT류 에이전트가 실패하는 방식은 “모델 부족”보다 “시스템 부재”에 가까웠음\n\nAutoGPT 계열(초기 오픈소스 에이전트들)은 대체로 다음 문제로 터졌음.\n\n* 목표 드리프트: 계획이 길어질수록 목표가 바뀌거나 자기합리화로 진행\n* 툴 호출 불확실성: API 입력 형식/제약을 모델이 “추측”해서 실패\n* 상태 관리 부재: 중간 산출물, 실패 원인, 재시도 정책이 체계가 아니라 프롬프트에 섞임\n\n이건 “모델이 더 똑똑하면 해결”이 아니라,\n\n* 툴 스키마를 결정적으로 제공하고,\n* 실패 시 재시도/롤백/격리 가 있고,\n* 실행 내역이 관측 가능 해야 해결되는 부류임.\n\nMCP는 “툴 정의를 공통 규격으로 노출”하는 방향이라서, 최소한 ‘추측 기반 통합’을 줄이려는 설계임.\n\n---\n\n# 실제 사례 2: Devin류(코딩 에이전트)가 보여준 건 “모델 능력”보다 “툴링+운영”의 합성물임\n\nDevin 같은 코딩 에이전트가 인상적으로 보이는 지점은 자연어 답변이 아니라 아래 조합임.\n\n* 레포 클론/빌드/테스트/런을 자동화하는 도구 체인\n* 실패 로그를 읽고 수정하는 반복 루프\n* 작업 단위를 쪼개고 우선순위를 조정하는 플래너\n* 결과물을 PR/이슈 코멘트로 남기는 워크플로우 연결\n\n즉 “모델이 코드를 잘 짠다”라기보다 시스템이 코드 작업을 끝내게 만드는 실행 환경이 핵심임.\n\n---\n\n# 실제 사례 3: 엔터프라이즈 적용은 ‘모델 선택’이 아니라 ‘경계 설계’부터 시작됨\n\n현업 적용에서 반복해서 부딪히는 건 “어떤 모델이 더 좋냐”보다 다음임.\n\n* 어떤 데이터에 접근 가능한지(권한/PII)\n* 어떤 툴 호출이 허용되는지(결제/삭제/권한변경)\n* 실패했을 때 누가 책임지는지(감사/재현)\n* 결과가 왜 그렇게 나왔는지 설명 가능한지(로그/트레이스)\n\n여기서 MCP 같은 표준화 레이어가 의미 있는 이유는, 툴/데이터의 연결이 ‘확장 가능한 형태’로 관리돼야 거버넌스/감사가 가능해지기 때문임.\n\n---\n\n# 개발자 관점: MCP 도입 시 설계 포인트(진짜로 중요한 것들)\n\n## 1) 모델은 교체 가능해야 함\n\n모델을 바꾸는 순간 제품이 망가지는 구조면 이미 모델 중심 구조에 묶인 상태임, MCP는 모델/앱이 툴을 같은 방식으로 보도록 만들지만, “모델 교체 가능”은 별도 설계(프롬프트/툴 스키마/출력 계약)로 확보해야 함.\n\n## 2) 툴 스키마는 ‘문서’가 아니라 ‘계약’이어야 함\n\n도구 호출 정의가 느슨하면 에이전트가 다시 추측을 시작함, 스키마는 입력 검증, 오류 코드, 부작용(쓰기/삭제)까지 포함한 계약이어야 하고, 이를 기반으로 재시도/격리 정책을 짤 수 있어야 함.\n\n## 3) 관측(Observability)은 옵션이 아니라 기능임\n\n에이전트는 실패를 많이 함, 그러면 실패를 재현하고 고쳐야 하는데, 로그가 없으면 운영 불가임, tool call trace, 입력/출력 샘플링, 정책 위반 로그, 사용자 승인 이벤트가 기본 구성임.\n\n## 4) 인간 개입(HITL)은 ‘안전장치’가 아니라 ‘제품 UX’임\n\n결제, 삭제, 권한 변경 같은 고위험 툴은 인간 승인 플로우가 제품 UX로 설계돼야 함, 단순히 “확인해줘” 메시지로 해결하려 하면 결국 운영 사고로 감.\n\n---\n\n# 리스크: MCP가 있다고 시스템 문제가 사라지는 건 아님\n\n## 1) 표준화는 ‘연결’을 쉽게 만들지만 ‘통제’를 자동으로 주지 않음\n\nMCP가 툴 호출을 쉽게 만들어도, 그 툴이 무엇을 할 수 있는지, 누가 호출할 수 있는지, 어떤 조건에서 허용되는지(policy)는 별도 설계임.\n\n## 2) 권한 상승(Privilege Escalation)과 데이터 누출은 더 쉬워질 수 있음\n\n연결이 쉬워지면 공격면도 커짐, MCP 서버가 내부망 자원에 붙는 순간, 인증/인가/감사/비밀키 관리가 구멍이면 단일 지점 침해로 확대됨.\n\n## 3) 에이전트는 ‘정확성’보다 ‘행동’이 위험함\n\n검색 답변 오류는 피해가 제한적일 수 있는데, 삭제/결제/권한변경 같은 행동 오류는 피해가 즉시 발생함, 따라서 모델 평가보다 실행 정책(승인, 제한, 시뮬레이션)이 더 중요해짐.\n\n## 4) 벤더 종속은 프로토콜이 아니라 운영 툴체인에서 생김\n\n프로토콜이 표준이어도, 관측/평가/정책 엔진이 특정 벤더 툴에 묶이면 종속은 그대로 발생함, 시스템 구성 요소를 교체 가능한 형태로 분리해야 함.\n\n---\n\n# 마지막 본질 정리\n\nMCP가 의미 있는 이유는 “새 프로토콜”이라서가 아니라, LLM 활용이 모델 성능 싸움에서 끝나지 않고, 실제로는 연결·권한·관측·회복을 설계하는 시스템 공학 문제로 이동하고 있음을 드러내는 신호라서임, 모델은 교체 가능해지고, 승부는 런타임 설계와 운영 능력에서 갈리는 쪽으로 수렴 중임.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #mcp\",\"title\":\"#mcp\",\"desc\":\"\\\"mcp\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"it\",\"mcp-shifts-ai-from-model-to-system\"],\"slugPath\":\"it/mcp-shifts-ai-from-model-to-system\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/it/mcp-shifts-ai-from-model-to-system.md\",\"frontmatter\":{\"title\":\"Model Context Protocol(MCP)이 “모델”이 아니라 “시스템” 문제를 전면으로 끌어올린 이유\",\"slug\":\"mcp-shifts-ai-from-model-to-system\",\"description\":\"MCP 확산을 계기로 LLM 활용의 초점이 모델 성능에서 시스템 설계(연결·권한·관측·회복)로 이동하는 구조를 개발자 관점에서 해석함\",\"date\":\"2026-02-27 21:41:39\",\"tags\":[\"mcp\",\"model-context-protocol\",\"agentic-ai\",\"ai-systems\",\"orchestration\",\"tool-calling\",\"enterprise-ai\",\"observability\",\"security\",\"governance\"],\"category\":\"it\",\"cover\":\"/images/og.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/mcp\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\
