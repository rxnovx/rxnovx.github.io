b을 가질 수 있으며,\ncron 데몬은 이를 읽어 작업을 수행합니다.\n\n### crontab 명령어\n\ncrontab을 관리하기 위한 기본 명령어는 다음과 같습니다.\n\n* 현재 등록된 cron 작업 확인\n\n```bash\ncrontab -l\n```\n\n* cron 작업 편집\n\n```bash\ncrontab -e\n```\n\n* cron 작업 전체 삭제\n\n```bash\ncrontab -r\n```\n\n* 파일로 작성한 cron 설정 등록\n\n```bash\ncrontab filename\n```\n\n실무에서는 보통 `crontab -e`를 가장 많이 사용합니다.\n\n---\n\n## 크론탭 문법 이해하기\n\ncrontab의 핵심은 **시간 필드 문법**입니다.\n형식은 다음과 같습니다.\n\n```\n분 시 일 월 요일 명령어\n```\n\n이를 풀어서 보면 다음과 같습니다.\n\n```\n*  *  *  *  *  command\n┬  ┬  ┬  ┬  ┬\n│  │  │  │  └─ 요일 (0-7 = 일요일, 1 = 월요일)\n│  │  │  └──── 월 (1-12)\n│  │  └─────── 일 (1-31)\n│  └────────── 시 (0-23)\n└───────────── 분 (0-59)\n```\n\n### 자주 사용하는 예제\n\n* 매일 새벽 3시 30분에 실행\n\n```bash\n30 3 * * * /usr/local/bin/backup.sh\n```\n\n* 5분마다 실행\n\n```bash\n*/5 * * * * /usr/local/bin/job.sh\n```\n\n* 매주 월요일 오전 9시에 실행\n\n```bash\n0 9 * * 1 /usr/local/bin/weekly.sh\n```\n\n### 특수 표현\n\n* `*` : 모든 값\n* `*/5` : 5 단위(step)마다\n* `1-5` : 1부터 5까지(range)\n\n이 조합만 익혀도 대부분의 cron 작업을 작성할 수 있습니다.\n\n---\n\n## cron 사용 시 주의할 점\n\ncron 환경은 **일반 쉘과 다르다**는 점을 반드시 인지해야 합니다.\n\n* PATH 환경 변수가 제한적임\n* 상대 경로 사용 시 오류 발생 가능\n* 실행 파일은 절대 경로로 지정하는 것이 안전함\n\n따라서 cron에서는 다음과 같은 습관이 중요합니다.\n\n* 명령어와 스크립트는 **절대 경로 사용**\n* 필요한 환경 변수는 스크립트 내부에서 직접 설정\n* 로그 출력을 통해 실행 여부 확인\n\n---\n\n## at 명령어\n\n`at`은 **한 번만 실행되는 예약 작업**을 등록할 때 사용합니다.\n\n예를 들어, 특정 시각에 한 번만 스크립트를 실행해야 할 때 적합합니다.\n\n```bash\nat 23:00\nat\u003e /usr/local/bin/oneshot.sh\nat\u003e Ctrl+D\n```\n\n반복 실행에는 적합하지 않으며,\n주기적인 작업에는 cron을 사용합니다.\n\n---\n\n## Anacron 이란\n\nanacron은 **항상 켜져 있지 않은 시스템**을 위한 스케줄러입니다.\n\n서버와 달리 노트북이나 개인 PC는\n정해진 시간에 꺼져 있는 경우가 많습니다.\n이 경우 cron 작업은 실행되지 않고 그대로 놓치게 됩니다.\n\nanacron은 이러한 문제를 보완합니다.\n\n### anacron의 특징\n\n* 시스템이 꺼져 있던 동안 **놓친 작업을 부팅 후 실행**\n* 하루 단위 이상의 작업만 지원 (분, 시간 단위 불가)\n* root 권한으로 동작\n* 시스템 전역 작업에 사용\n\n로그 정리, 주간 백업처럼\n\"반드시 하루에 한 번 이상 실행되어야 하는 작업\"에 적합합니다.\n\n---\n\n## 마치며\n\ncron은 리눅스 시스템 관리에서 반드시 익혀야 할 핵심 도구입니다.\n\n처음에는 문법이 다소 복잡하게 느껴질 수 있지만,\n몇 가지 패턴만 익히면 반복 작업 관리가 훨씬 수월해집니다.\n\ncron, at, anacron의 역할을 구분해서 사용한다면\n시스템 작업을 보다 안정적으로 운영할 수 있습니다.\n\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #scheduler\",\"title\":\"#scheduler\",\"desc\":\"\\\"scheduler\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-13-schedule-future-tasks\"],\"slugPath\":\"linux/rocky-linux-series-13-schedule-future-tasks\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-13-schedule-future-tasks.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #13 – 작업 스케줄링과 자동 실행 (cron · at · anacron)\",\"slug\":\"rocky-linux-series-13-schedule-future-tasks\",\"description\":\"리눅스에서 반복 작업과 예약 작업을 자동화하는 방법을 정리합니다.\\ncron, at, anacron의 차이와 역할을 살펴보고, crontab 문법과 실무에서 자주 사용하는 설정 흐름을 정리했습니다.\",\"date\":\"2026-01-28 21:21\",\"tags\":[\"linux\",\"cron\",\"crontab\",\"scheduling\",\"task\",\"scheduler\",\"allow\",\"deny\",\"anacron\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/rocky-linux-series-13-schedule-future-tasks/og/1769603208179-image.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/scheduler\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/tags/termux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"android\",\"href\":\"/tags/android\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky\",\"href\":\"/tags/rocky\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"network\",\"href\":\"/tags/network\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"systemd\",\"href\":\"/tags/systemd\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"system\",\"href\":\"/tags/system\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"linux-
