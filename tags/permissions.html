\n| d  | 디렉터리 (directory)     |\n| -  | 일반 파일 (regular file) |\n| l  | 심볼릭 링크               |\n| b  | 블록 디바이스              |\n| c  | 문자 디바이스              |\n| s  | 소켓                   |\n| p  | 네임드 파이프 (FIFO)       |\n\n### 보완 설명\n\n* **디렉터리(d)**\n\n  * 다른 파일을 담는 컨테이너\n  * `cd`, `ls` 명령의 대상\n* **일반 파일(-)**\n\n  * 텍스트, 바이너리, 실행 파일 포함\n* **심볼릭 링크(l)**\n\n  * 다른 파일이나 디렉터리를 가리키는 참조\n* **블록/문자 디바이스**\n\n  * `/dev` 아래에서 주로 확인\n* **소켓 / 파이프**\n\n  * 프로세스 간 통신 용도\n\n---\n\n## rwx 권한 구조\n\n```text\ndrwxr-xr-x\n│ └── others\n│ └──── group\n└──────── owner\n```\n\n| 위치   | 의미                |\n| ---- | ----------------- |\n| 첫 글자 | 파일 타입             |\n| 1~3  | 소유자(owner) 권한     |\n| 4~6  | 그룹(group) 권한      |\n| 7~9  | 기타 사용자(others) 권한 |\n\n---\n\n## r / w / x 권한 의미\n\n| 권한 | 파일(File) | 디렉터리(Directory) |\n| -- | -------- | --------------- |\n| r  | 파일 내용 읽기 | 목록 조회(ls)       |\n| w  | 파일 수정    | 파일 생성·삭제·이름 변경  |\n| x  | 파일 실행    | 디렉터리 접근(cd)     |\n\n디렉터리에서 **삭제 권한은 파일이 아니라 상위 디렉터리의 w 권한**으로 결정된다는 점이 중요합니다.\n\n---\n\n## Permission 숫자 표기법 (Octal)\n\n리눅스 권한은 8진수로 표현할 수 있습니다.\n실무에서는 이 방식이 가장 많이 사용됩니다.\n\n### 기본 비트 값\n\n| 값 | 의미 |\n| - | -- |\n| 4 | r  |\n| 2 | w  |\n| 1 | x  |\n\n### 조합 예시\n\n| 숫자 | 권한  | 의미       |\n| -- | --- | -------- |\n| 7  | rwx | 읽기·쓰기·실행 |\n| 6  | rw- | 읽기·쓰기    |\n| 5  | r-x | 읽기·실행    |\n| 4  | r-- | 읽기       |\n| 0  | --- | 없음       |\n\n### 3자리 권한 예시\n\n| 숫자  | 의미                |\n| --- | ----------------- |\n| 755 | 소유자 전체, 나머지 읽기·실행 |\n| 700 | 소유자만 접근           |\n| 644 | 일반 파일 기본값         |\n| 777 | 모두 전체 권한 (주의 필요)  |\n\n---\n\n## chmod : 권한 변경\n\n### 숫자 방식\n\n```bash\nchmod 644 file.txt\nchmod 755 script.sh\n```\n\n### 문자 방식\n\n```bash\nchmod u+x file\nchmod g-w file\nchmod o=r file\nchmod a+rx file\n```\n\n| 대상 | 의미     |\n| -- | ------ |\n| u  | 소유자    |\n| g  | 그룹     |\n| o  | 기타 사용자 |\n| a  | 전체     |\n\n---\n\n## 디렉터리 삭제 권한 실습 개념\n\n파일을 삭제할 수 있는지는 **파일 권한이 아니라 디렉터리 권한**으로 판단됩니다.\n\n쓰기(w) 권한이 없는 디렉터리에서는 파일을 생성하거나 삭제할 수 없습니다.\n이 개념은 보안 사고에서 매우 중요하게 작용합니다.\n\n---\n\n## SUID / SGID / Sticky Bit\n\n일반적인 rwx 권한 외에, **권한 동작 자체를 변경하는 특수 퍼미션**이 존재합니다.\n\n| 비트         | 의미                  |\n| ---------- | ------------------- |\n| SUID       | 실행 시 파일 소유자 권한으로 실행 |\n| SGID       | 실행 시 파일 그룹 권한으로 실행  |\n| Sticky Bit | 공용 디렉터리 보호          |\n\n### 대표 예시\n\n```bash\n-rwsr-xr-x /bin/passwd\ndrwxrwxrwt /tmp\n```\n\n### SUID\n\n* 실행한 사용자가 누구든 **파일 소유자 권한**으로 실행\n* 대표 사례: `passwd`\n\n### SGID\n\n* 실행 시 파일의 **그룹 권한**으로 동작\n* 디렉터리에 적용 시 하위 파일이 동일 그룹을 상속\n\n### Sticky Bit\n\n* 공용 디렉터리에서 파일 삭제 제한\n* 본인 소유 파일만 삭제 가능\n\n---\n\n## 특수 퍼미션 설정 방법\n\n### 문자 방식\n\n```bash\nchmod u+s file   # SUID\nchmod g+s file   # SGID\nchmod o+t dir    # Sticky Bit\n```\n\n### 숫자 방식\n\n| 값    | 의미         |\n| ---- | ---------- |\n| 4xxx | SUID       |\n| 2xxx | SGID       |\n| 1xxx | Sticky Bit |\n\n```bash\nchmod 4755 file\nchmod 2770 dir\nchmod 1777 /tmp\n```\n\n---\n\n## 마무리\n\n파일 시스템 권한은 단순한 문법이 아니라, **리눅스 보안 모델의 핵심**입니다.\n이 개념을 정확히 이해하지 못하면 사용자 관리, 서비스 운영, 보안 설정 모두 흔들릴 수 있습니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #permissions\",\"title\":\"#permissions\",\"desc\":\"\\\"permissions\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-8-file-system-permissions\"],\"slugPath\":\"linux/rocky-linux-series-8-file-system-permissions\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-8-file-system-permissions.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #8 - 리눅스 파일 시스템 권한 이해하기 (소유자, chmod, SUID/SGID)\",\"slug\":\"rocky-linux-series-8-file-system-permissions\",\"description\":\"리눅스 파일 시스템에서 소유자와 권한은 접근 제어의 출발점입니다.\\n이 글에서는 chown, chmod, 숫자 권한 표기법부터 SUID·SGID·Sticky Bit까지 파일 접근 권한의 동작 원리를 정리합니다.\",\"date\":\"2026-01-27 22:17\",\"tags\":[\"linux\",\"permissions\",\"chmod\",\"chown\",\"suid\",\"sgid\",\"sticky\",\"bit\",\"file\",\"system\",\"rocky\"],\"category\":\"linux\",\"cover\
