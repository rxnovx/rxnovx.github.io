에서 패킷이 지연되어도\n다른 스트림에는 영향을 주지 않습니다.\n\nHTTP/2에서 남아 있던\nHOL Blocking 문제가\n전송 계층에서 해결됩니다.\n\n이 차이는\n리소스가 많은 웹 페이지에서\n더 분명하게 드러납니다.\n\n## 네트워크가 바뀌는 상황을 고려하다\n\n모바일 환경에서는\nIP 주소가 자주 바뀝니다.\n\nTCP 연결은\n이 변화에 취약합니다.\n\nQUIC은\n연결 식별자를 사용해\n네트워크가 바뀌어도\n연결을 유지할 수 있도록 설계됐습니다.\n\nCloudflare는\n이 점을 HTTP/3의\n실사용 가치를 높이는 요소로 봅니다.\n\n## 그렇다면 단점은 없을까\n\n문서에서는\nQUIC이 만능이라는 식으로 말하지 않습니다.\n\n* UDP 기반 트래픽에 대한 차단\n* 중간 장비와의 호환성\n* 디버깅 난이도\n\n기존 인프라와의 마찰은\n여전히 남아 있습니다.\n\n그래서 HTTP/3는\n기존 프로토콜을 대체하기보다는\n점진적으로 병행되는 방향으로\n도입되고 있습니다.\n\n## 개인적인 기록\n\nHTTP/3를 이해하면서 느낀 점은\n이 변화가 속도 경쟁의 결과라기보다\n누적된 구조적 타협을 정리하는 과정에 가깝다는 것입니다.\n\nTCP는 잘 설계된 프로토콜입니다.\n다만 웹이라는 환경이\n그 설계를 넘어선 것에 가깝습니다.\n\nCloudflare 문서는\nHTTP/3를 혁명처럼 포장하지 않습니다.\n\n대신 왜 이 선택이 나왔는지를\n차분하게 설명합니다.\n\n그 점이\n이 문서를 여러 번 다시 보게 만드는 이유입니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #quic\",\"title\":\"#quic\",\"desc\":\"\\\"quic\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"it\",\"why-http3-moves-beyond-tcp\"],\"slugPath\":\"it/why-http3-moves-beyond-tcp\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/it/why-http3-moves-beyond-tcp.md\",\"frontmatter\":{\"title\":\"HTTP/3는 왜 TCP를 버렸을까  //  Why HTTP/3 Moves Beyond TCP\",\"slug\":\"why-http3-moves-beyond-tcp\",\"description\":\"HTTP/3가 기존 TCP 대신 QUIC을 선택한 배경과 그로 인해 달라진 웹 통신의 구조를 Cloudflare 기술 문서를 바탕으로 정리한다.\",\"date\":\"2026-02-06 12:13\",\"tags\":[\"http3\",\"quic\",\"network\",\"web-performance\",\"cloudflare\"],\"category\":\"it\",\"cover\":\"/images/og.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/quic\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/t
