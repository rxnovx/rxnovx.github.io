되었지만 보안 개념은 여전히 부족\n\n### NFS v4\n\n* TCP 2049 포트 단일화\n* 상태 기반(Stateful) 프로토콜\n* 가상 파일 시스템 개념 도입\n* 인증 기반 접근 제어 지원\n\n현재 실무에서는 **NFS v4**가 기본 선택지입니다.\n\n---\n\n## 실습 환경 구성\n\n* vm1 : NFS Client\n* vm2 : NFS Server\n\n실습은 내부 네트워크 환경을 가정합니다.\n\n---\n\n## NFS 서버 설정\n\n### 패키지 설치\n\n```bash\ndnf install -y nfs-utils rpcbind\n```\n\n* nfs-utils : NFS 서버/클라이언트 핵심 패키지\n* rpcbind   : NFS RPC 서비스 매핑\n\n---\n\n### 설정 파일: /etc/exports\n\nNFS 공유 설정은 `/etc/exports` 파일에서 관리됩니다.\n기본 상태에서는 비어 있습니다.\n\n```bash\nvi /etc/exports\n```\n\n#### 기본 개념\n\n구성은 다음과 같습니다.\n\n```\n공유할_디렉토리   접근대상(옵션)\n```\n\n#### 주요 옵션\n\n* ro / rw : 읽기 전용 / 읽기-쓰기\n* sync / async : 동기 / 비동기 쓰기\n* root_squash : root 권한을 일반 사용자로 매핑 (기본값)\n* no_root_squash : root 권한 유지 (주의 필요)\n\n---\n\n### 예제 설정\n\n```bash\n/nfsdata   192.168.11.0/24(rw,sync)  10.100.1.2(ro)\n/tmp       *(ro)\n```\n\n---\n\n### 디렉토리 준비 및 서비스 기동\n\n```bash\nmkdir /nfsdata\ncp /etc/fstab /nfsdata/1.txt\nmkdir /nfsdata/movie\nchmod -R 1777 /nfsdata\n\nsystemctl start rpcbind\nsystemctl start nfs-server\n```\n\n\u003e 실습 환경에서는 방화벽을 비활성화했지만,\n\u003e 실제 환경에서는 NFS 포트만 허용하는 방식이 권장됩니다.\n\n---\n\n### 공유 확인\n\n```bash\nshowmount -e localhost\n```\n\n설정 변경 후 즉시 반영하려면 다음 명령을 사용합니다.\n\n```bash\nexportfs -var\n```\n\n---\n\n## NFS 클라이언트 설정\n\n### 공유 목록 확인\n\n```bash\nshowmount -e 192.168.11.33\n```\n\n### 마운트\n\n```bash\nmkdir /mnt/6day\nmount -t nfs 192.168.11.33:/nfsdata /mnt/6day\n```\n\n이제 `/mnt/6day`는 로컬 디렉토리처럼 동작합니다.\n\n---\n\n## 재부팅 시 자동 마운트에 대한 생각\n\n`/etc/fstab`에 등록하면 자동 마운트가 가능합니다.\n\n```bash\nserver:/exports/netinstall  /srv/netinstall  nfs  intr  0  0\n```\n\n다만 이 방식은 **항상 좋은 선택은 아닙니다**.\n\n* NFS 서버가 내려가 있으면 클라이언트 부팅이 지연되거나 실패할 수 있음\n* 네트워크 의존성이 커짐\n\n실무에서는 상황에 따라 수동 마운트나 automount를 선택합니다.\n\n---\n\n## 마무리\n\nNFS는 단순하지만 강력한 기술입니다.\n특히 홈 디렉토리 공유, 중앙 스토리지 구성, 레거시 시스템 연동에서 여전히 중요한 역할을 합니다.\n"])</script><script>self.__next_f.push([1,"1d:T1944,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n## 들어가기\n이전 글들에서는 리눅스에서 파일과 디렉터리를 다루는 방법을 중심으로 살펴봤습니다.\n이번 글에서는 그 파일과 디렉터리에 **누가, 무엇을, 어디까지 할 수 있는지**를 제어하는 핵심 개념인 **파일 시스템 권한(File System Permissions)** 을 정리합니다.\n\n리눅스는 기본적으로 멀티 유저 시스템입니다.\n혼자 쓰는 서버라 하더라도, 권한 개념은 보안과 안정성을 지탱하는 가장 기본적인 장치입니다.\n이 장은 이후 사용자 관리, 보안 설정, 서버 운영 전반의 토대가 됩니다.\n\n---\n\n## File Ownership\n\n리눅스의 모든 파일과 디렉터리는 **소유자(owner)** 와 **그룹(group)** 을 가집니다.\n권한 판단의 출발점은 항상 이 두 가지입니다.\n\n### chown : 파일의 소유자 및 그룹 변경\n\n`chown` 명령어는 파일 또는 디렉터리의 소유자와 그룹을 변경할 때 사용합니다.\n\n```bash\nchown [옵션] 소유자:그룹 대상\n```\n\n#### 기본 예제\n\n```bash\n# 소유자를 test 유저로 변경\nchown test /tmp/backup/susan\n\n# 그룹만 cloud로 변경\nchown :cloud /tmp/backup/susan\n\n# 소유자와 그룹을 동시에 변경\nchown hpe:cloud /tmp/backup/susan\n```\n\n#### 재귀적 변경 (-R)\n\n```bash\n# 하위 파일과 디렉터리까지 모두 변경\nchown -R hpe:cloud /tmp/backup/susan\n```\n\n운영 환경에서는 특정 디렉터리 트리 전체의 소유권을 변경해야 하는 경우가 많기 때문에 `-R` 옵션은 자주 사용됩니다.\n\n---\n\n## File and Directory Permissions\n\n권한(permission)은 **누가 무엇을 할 수 있는지**를 정의하는 규칙입니다.\n권한이 없다면 파일을 읽을 수도, 수정할 수도, 실행할 수도 없습니다.\n\n`ls -l` 또는 `ls -al` 명령을 실행하면 왼쪽에 10자리 문자열이 출력됩니다.\n\n```text\ndrwxr-xr-x\n```\n\n이 문자열 안에 파일 타입과 권한 정보가 모두 들어 있습니다.\n\n---\n\n## 파일 타입 (첫 번째 문자)\n\n| 문자 | 의미                   |\n| -- | -------------------- |\n| d  | 디렉터리 (directory)     |\n| -  | 일반 파일 (regular file) |\n| l  | 심볼릭 링크               |\n| b  | 블록 디바이스              |\n| c  | 문자 디바이스              |\n| s  | 소켓                   |\n| p  | 네임드 파이프 (FIFO)       |\n\n### 보완 설명\n\n* **디렉터리(d)**\n\n  * 다른 파일을 담는 컨테이너\n  * `cd`, `ls` 명령의 대상\n* **일반 파일(-)**\n\n  * 텍스트, 바이너리, 실행 파일 포함\n* **심볼릭 링크(l)**\n\n  * 다른 파일이나 디렉터리를 가리키는 참조\n* **블록/문자 디바이스**\n\n  * `/dev` 아래에서 주로 확인\n* **소켓 / 파이프**\n\n  * 프로세스 간 통신 용도\n\n---\n\n## rwx 권한 구조\n\n```text\ndrwxr-xr-x\n│ └── others\n│ └──── group\n└──────── owner\n```\n\n| 위치   | 의미                |\n| ---- | ----------------- |\n| 첫 글자 | 파일 타입             |\n| 1~3  | 소유자(owner) 권한     |\n| 4~6  | 그룹(group) 권한      |\n| 7~9  | 기타 사용자(others) 권한 |\n\n---\n\n## r / w / x 권한 의미\n\n| 권한 | 파일(File) | 디렉터리(Directory) |\n| -- | -------- | --------------- |\n| r  | 파일 내용 읽기 | 목록 조회(ls)       |\n| w  | 파일 수정    | 파일 생성·삭제·이름 변경  |\n| x  | 파일 실행    | 디렉터리 접근(cd)     |\n\n디렉터리에서 **삭제 권한은 파일이 아니라 상위 디렉터리의 w 권한**으로 결정된다는 점이 중요합니다.\n\n---\n\n## Permission 숫자 표기법 (Octal)\n\n리눅스 권한은 8진수로 표현할 수 있습니다.\n실무에서는 이 방식이 가장 많이 사용됩니다.\n\n### 기본 비트 값\n\n| 값 | 의미 |\n| - | -- |\n| 4 | r  |\n| 2 | w  |\n| 1 | x  |\n\n### 조합 예시\n\n| 숫자 | 권한  | 의미       |\n| -- | --- | -------- |\n| 7  | rwx | 읽기·쓰기·실행 |\n| 6  | rw- | 읽기·쓰기    |\n| 5  | r-x | 읽기·실행    |\n| 4  | r-- | 읽기       |\n| 0  | --- | 없음       |\n\n### 3자리 권한 예시\n\n| 숫자  | 의미                |\n| --- | ----------------- |\n| 755 | 소유자 전체, 나머지 읽기·실행 |\n| 700 | 소유자만 접근           |\n| 644 | 일반 파일 기본값         |\n| 777 | 모두 전체 권한 (주의 필요)  |\n\n---\n\n## chmod : 권한 변경\n\n### 숫자 방식\n\n```bash\nchmod 644 file.txt\nchmod 755 script.sh\n```\n\n### 문자 방식\n\n```bash\nchmod u+x file\nchmod g-w file\nchmod o=r file\nchmod a+rx file\n```\n\n| 대상 | 의미     |\n| -- | ------ |\n| u  | 소유자    |\n| g  | 그룹     |\n| o  | 기타 사용자 |\n| a  | 전체     |\n\n---\n\n## 디렉터리 삭제 권한 실습 개념\n\n파일을 삭제할 수 있는지는 **파일 권한이 아니라 디렉터리 권한**으로 판단됩니다.\n\n쓰기(w) 권한이 없는 디렉터리에서는 파일을 생성하거나 삭제할 수 없습니다.\n이 개념은 보안 사고에서 매우 중요하게 작용합니다.\n\n---\n\n## SUID / SGID / Sticky Bit\n\n일반적인 rwx 권한 외에, **권한 동작 자체를 변경하는 특수 퍼미션**이 존재합니다.\n\n| 비트         | 의미                  |\n| ---------- | ------------------- |\n| SUID       | 실행 시 파일 소유자 권한으로 실행 |\n| SGID       | 실행 시 파일 그룹 권한으로 실행  |\n| Sticky Bit | 공용 디렉터리 보호          |\n\n### 대표 예시\n\n```bash\n-rwsr-xr-x /bin/passwd\ndrwxrwxrwt /tmp\n```\n\n### SUID\n\n* 실행한 사용자가 누구든 **파일 소유자 권한**으로 실행\n* 대표 사례: `passwd`\n\n### SGID\n\n* 실행 시 파일의 **그룹 권한**으로 동작\n* 디렉터리에 적용 시 하위 파일이 동일 그룹을 상속\n\n### Sticky Bit\n\n* 공용 디렉터리에서 파일 삭제 제한\n* 본인 소유 파일만 삭제 가능\n\n---\n\n## 특수 퍼미션 설정 방법\n\n### 문자 방식\n\n```bash\nchmod u+s file   # SUID\nchmod g+s file   # SGID\nchmod o+t dir    # Sticky Bit\n```\n\n### 숫자 방식\n\n| 값    | 의미         |\n| ---- | ---------- |\n| 4xxx | SUID       |\n| 2xxx | SGID       |\n| 1xxx | Sticky Bit |\n\n```bash\nchmod 4755 file\nchmod 2770 dir\nchmod 1777 /tmp\n```\n\n---\n\n## 마무리\n\n파일 시스템 권한은 단순한 문법이 아니라, **리눅스 보안 모델의 핵심**입니다.\n이 개념을 정확히 이해하지 못하면 사용자 관리, 서비스 운영, 보안 설정 모두 흔들릴 수 있습니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #file\",\"title\":\"#file\",\"desc\":\"\\\"file\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-17-nfs-network-file-system\"],\"slugPath\":\"linux/rocky-linux-series-17-nfs-network-file-system\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-17-nfs-network-file-system.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #17 – NFS(Network File System)로 네트워크 스토리지 사용하기\",\"slug\":\"rocky-linux-series-17-nfs-network-file-system\",\"description\":\"NFS(Network File System)를 중심으로 NAS와 SAN의 차이부터 NFS 버전별 특징, 서버·클라이언트 설정 방법까지 정리합니다. 리눅스 환경에서 네트워크 스토리지를 이해하고 직접 구성해보고 싶은 분들을 위한 실습 중심 가이드입니다.\",\"date\":\"2026-01-29 23:19\",\"tags\":[\"nfs\",\"network\",\"file\",\"system\",\"nas\",\"san\",\"linux\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/linux-series-17-nfs-network-file-system/og/1769775445032-image.webp\",\"draft\":false},\"content\":\"$1c\"},{\"slug\":[\"linux\",\"rocky-linux-series-8-file-system-permissions\"],\"slugPath\":\"linux/rocky-linux-series-8-file-system-permissions\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-8-file-system-permissions.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #8 - 리눅스 파일 시스템 권한 이해하기 (소유자, chmod, SUID/SGID)\",\"slug\":\"rocky-linux-series-8-file-system-permissions\",\"description\":\"리눅스 파일 시스템에서 소유자와 권한은 접근 제어의 출발점입니다.\\n이 글에서는 chown, chmod, 숫자 권한 표기법부터 SUID·SGID·Sticky Bit까지 파일 접근 권한의 동작 원리를 정리합니다.\",\"date\":\"2026-01-27 22:17\",\"tags\":[\"linux\",\"permissions\",\"chmod\",\"chown\",\"suid\",\"sgid\",\"sticky\",\"bit\",\"file\",\"system\",\"rocky\"],\"category\":\"linux
