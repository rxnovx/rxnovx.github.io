:\"$undefined\"}]]}]\ne:[\"$\",\"$1\",\"c\",{\"children\":[\"$L12\",null,[\"$\",\"$L13\",null,{\"children\":[\"$\",\"$14\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@15\"}]}]]}]\nf:[\"$\",\"$L16\",\"l\",{}]\n10:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L17\",null,{\"children\":\"$@18\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L19\",null,{\"children\":[\"$\",\"$14\",null,{\"name\":\"Next.Metadata\",\"children\":\"$@1a\"}]}]}],null]}]\n"])</script><script>self.__next_f.push([1,"1b:I[9677,[\"500\",\"static/chunks/500-b84d19d842172eba.js\",\"873\",\"static/chunks/app/(blog)/tags/%5Btag%5D/page-b80736597d64b8e7.js\"],\"TaxonomyPageShell\"]\n1c:T19fd,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n## 들어가기\n\nSELinux는 이름만 들어도 부담을 느끼는 경우가 많습니다.\n실제로도 리눅스를 어느 정도 사용하다가 처음으로 \"SELinux 때문에 안 된다\"라는 상황을 겪으면, 가장 먼저 끄고 싶어지는 대상이기도 합니다.\n\n하지만 SELinux는 단순한 옵션이 아니라, **리눅스 보안 모델의 방향 자체를 바꾼 핵심 구성 요소**입니다.\n이 글에서는 명령어 나열보다는,\n\n* SELinux가 왜 만들어졌는지\n* 어떤 보안 모델을 기반으로 동작하는지\n* 실무에서 문제가 생겼을 때 어떤 순서로 접근해야 하는지\n\n이 흐름을 중심으로 정리해보려 합니다.\n\n---\n\n## SELinux Security Framework\n\nSELinux(Security-Enhanced Linux)는 **NSA가 주도하여 설계한 강제 접근 제어(MAC) 기반 보안 프레임워크**입니다.\n오픈소스 리눅스 환경에서 기존 권한 모델의 한계를 보완하기 위해 만들어졌습니다.\n\n핵심은 하나입니다.\n\n\u003e \"퍼미션이 맞아도, 정책이 허용하지 않으면 접근할 수 없다\"\n\n이를 이해하려면 먼저 리눅스의 접근 제어 모델을 구분해서 볼 필요가 있습니다.\n\n---\n\n## 리눅스 접근 제어 모델 3가지\n\n### DAC (Discretionary Access Control)\n\n임의 접근 제어 모델입니다.\n파일과 디렉터리의 **소유자(owner)** 가 접근 권한을 결정합니다.\n\n* chmod\n* chown\n* rwx 퍼미션\n\n우리가 일반적으로 알고 있는 리눅스 권한 시스템은 모두 DAC 기반입니다.\n\n문제는,\n소유자가 실수로 권한을 열어버리면 시스템 전체가 위험해질 수 있다는 점입니다.\n\n---\n\n### MAC (Mandatory Access Control)\n\n강제 접근 제어 모델입니다.\n**사용자 의도와 상관없이 정책이 최우선**으로 적용됩니다.\n\nSELinux는 이 MAC 모델을 기반으로 설계되었습니다.\n\n* 정책(policy)에 의해 접근 허용 여부 결정\n* 중앙 집중적 제어 가능\n* 퍼미션보다 항상 우선\n\nSELinux가 \"까다롭다\"고 느껴지는 이유가 바로 여기에 있습니다.\n\n---\n\n### RBAC / RAC (Role-Based Access Control)\n\n역할 기반 접근 제어 모델입니다.\n\n* 사용자에게 역할(role)을 부여\n* 역할에 따라 수행 가능한 작업 제한\n\nSELinux 내부에서도 role 개념이 존재하지만,\n실무에서는 type 중심으로 다루는 경우가 대부분입니다.\n\n---\n\n## SELinux의 작동 흐름\n\nSELinux는 접근 요청이 발생하면 다음 순서로 판단합니다.\n\n1. **기본 퍼미션(DAC) 확인**\n2. **Security Context 확인**\n3. 정책에 따라 허용 또는 차단\n\n여기서 핵심은 2번입니다.\n\n---\n\n## Security Context 구조\n\nSELinux는 모든 프로세스와 파일에 **보안 꼬리표(Security Context)** 를 붙여 관리합니다.\n\n형식은 다음과 같습니다.\n\n```\nidentity:role:type:level\n```\n\n이 중 실무에서 가장 중요한 것은 **type** 입니다.\n\n* 프로세스 타입\n* 파일 타입\n\n이 둘의 조합이 정책에 정의되어 있어야 접근이 허용됩니다.\n\n---\n\n## Security Context 확인 방법\n\n아래 명령어들은 반드시 익숙해져야 합니다.\n\n* 현재 사용자 컨텍스트 확인\n\n```\nid\n```\n\n* 파일 컨텍스트 확인\n\n```\nls -lZ\n```\n\n* 프로세스 컨텍스트 확인\n\n```\nps -eZ\n```\n\nSELinux 트러블슈팅의 시작은 항상 **타입 확인**입니다.\n\n---\n\n## Relabeling Files (컨텍스트 복구)\n\n웹 디렉터리에 파일을 복사했는데 접근이 안 되는 경우는 매우 흔합니다.\n\n```bash\ntouch /var/www/html/1.html\ntouch /var/www/html/2.html\ncp -a /etc/passwd /var/www/html/3.html\n```\n\n퍼미션만 보면 문제 없어 보이지만,\n`/etc/passwd`의 보안 컨텍스트는 웹 서비스와 전혀 맞지 않습니다.\n\n---\n\n### chcon\n\n* 임시로 Security Context를 변경\n* 타입을 정확히 알고 있을 때만 사용\n\n```bash\nchcon -t httpd_sys_content_t /var/www/html/3.html\n```\n\n재부팅이나 정책 재적용 시 원래대로 돌아갑니다.\n\n---\n\n### restorecon\n\n권장되는 방식입니다.\n\n```bash\nrestorecon -vFR /var/www/html\n```\n\n* 정책에 정의된 기본 컨텍스트로 복구\n* 실무에서는 **restorecon 우선**\n\n---\n\n## SELinux 동작 모드\n\nSELinux는 세 가지 모드로 동작합니다.\n\n```bash\ngetenforce\n```\n\n### Enforcing\n\n* 정책 강제 적용\n* 차단 시 실제 접근 불가\n\n### Permissive\n\n* 정책은 검사\n* 차단하지 않고 로그만 기록\n\n### Disabled\n\n* SELinux 자체 비활성화\n* 재부팅 필요\n\nRHEL 8 이상에서는 커널 파라미터 수정이 필요합니다.\n\n---\n\n## SELinux 정책 선택\n\n### Targeted\n\n* 기본값\n* 주요 데몬만 보호\n* 실무 표준\n\n대부분의 서버 환경에서는 Targeted 정책으로 충분합니다.\n\n---\n\n### MLS\n\n* 다단계 보안 모델\n* 군·정부 목적\n* 운영 난이도 매우 높음\n\n---\n\n### Minimum\n\n* Targeted 기반 최소 보호\n* 테스트, 분석 환경용\n\n---\n\n## SELinux Booleans\n\nSELinux Boolean은 **정책을 수정하지 않고 동작만 제어하는 스위치**입니다.\n\n문제 해결 시 가장 먼저 확인해야 할 요소입니다.\n\n### Boolean 목록 확인\n\n```bash\ngetsebool -a\ngetsebool -a | grep httpd\n```\n\n### Boolean 변경\n\n```bash\nsetsebool httpd_can_network_connect on\n```\n\n재부팅 시 초기화됩니다.\n\n### 영구 적용\n\n```bash\nsetsebool -P httpd_can_network_connect on\n```\n\n---\n\n## 실습: FTP 업로드 차단 문제\n\nFTP 업로드 실패 시 퍼미션이 아닌 SELinux 문제일 가능성이 높습니다.\n\n로그를 확인하면 다음과 같은 메시지를 볼 수 있습니다.\n\n```bash\nsealert -l \u003cUUID\u003e\n```\n\nBoolean 하나로 해결되는 경우가 많습니다.\n\n```bash\nsetsebool -P ftpd_full_access on\n```\n\n---\n\n## Permissive Domains\n\n특정 서비스만 permissive로 설정할 수 있습니다.\n\n```bash\nsemanage permissive -a httpd_t\n```\n\n전체 SELinux를 끄지 않고 문제 분석이 가능합니다.\n\n---\n\n## SELinux 트러블슈팅 접근 순서\n\n1. 서비스 로그 확인\n2. `/var/log/messages` 또는 `journalctl`\n3. `sealert -l` 실행\n4. Boolean 여부 확인\n5. port, type, context 점검\n\nSELinux 문제는 대부분 **정책 위반 로그에 답이 이미 적혀 있습니다**.\n\n---\n\n## 마무리\n\nSELinux는 어렵기 때문이 아니라,\n**제대로 된 흐름 없이 접근해서 어렵게 느껴지는 경우가 많습니다.**\n\n* 끄는 대신 이해하기\n* 막연한 공포 대신 로그 읽기\n* 퍼미션이 아니라 type부터 보기\n\n이 세 가지만 익숙해져도 SELinux는 더 이상 장애물이 아니라,\n시스템을 지켜주는 안전장치로 보이기 시작합니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #selinux\",\"title\":\"#selinux\",\"desc\":\"\\\"selinux\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-21-manage-selinux-security\"],\"slugPath\":\"linux/rocky-linux-series-21-manage-selinux-security\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-21-manage-selinux-security.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #21 – SELinux 보안 프레임워크 이해와 실무 운용\",\"slug\":\"rocky-linux-series-21-manage-selinux-security\",\"description\":\"SELinux의 보안 모델(DAC, MAC), Security Context 구조, 정책(Targeted·MLS·Minimum), Boolean, Permissive Domain, 그리고 SSH·FTP 실무 트러블슈팅까지 한 흐름으로 정리합니다. SELinux를 끄지 않고 다루는 방법을 중심으로 설명합니다.\\n\",\"date\":\"2026-01-30 21:50\",\"tags\":[\"linux\",\"selinux\",\"rocky-linux\",\"rhel\",\"mandatory-access-control\",\"linux-security\",\"selinux-context\",\"selinux-boolean\",\"selinux-troubleshooting\",\"system-administration\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/rocky-linux-series-
