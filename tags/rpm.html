모두를 고려한 사용자 친화적 패키징\n\n* **Linux Mint**\n\n  * Ubuntu 기반\n  * 안정성과 사용 편의성을 강조\n\n#### Red Hat 계열\n\n* **Red Hat Enterprise Linux / Fedora / CentOS / Rocky Linux**\n\n  * RPM 포맷 사용\n  * `dnf` (과거 `yum`)을 통해 패키지 관리\n\n* **SUSE Linux Enterprise**\n\n  * RPM 기반\n  * `zypper` 패키지 매니저 사용\n\n* **Mandriva**\n\n  * RPM 기반 배포판\n  * 현재는 역사적 의미를 가지는 배포판\n\n---\n\n## RPM 패키지 파일 구조\n\n### 네이밍 규칙\n\nRPM 패키지 파일명은 다음과 같은 형식을 따릅니다.\n\n```\n이름-버전-릴리즈.아키텍처.rpm\n```\n\n파일명만 보더라도 다음 정보를 유추할 수 있습니다.\n\n* 어떤 소프트웨어인지\n* 어떤 버전인지\n* 어느 배포판용 빌드인지\n* 어떤 CPU 아키텍처를 대상으로 하는지\n\n---\n\n### 아키텍처 구분\n\n* **.src.rpm**\n\n  * 소스 코드와 spec 파일을 포함\n  * 바이너리 RPM을 생성하기 위한 재료\n\n* **.noarch.rpm**\n\n  * CPU 아키텍처에 의존하지 않음\n  * 스크립트, 설정 파일, 인터프리터 언어 패키지에 주로 사용\n\n* **.x86_64.rpm**\n\n  * 64비트 x86 아키텍처용 바이너리 패키지\n\n* **.i586.rpm**\n\n  * 32비트 x86 계열 바이너리 패키지\n\n* **.arm*.rpm**\n\n  * ARM 계열 CPU용 바이너리 패키지\n\n---\n\n### 내부 포맷\n\nRPM 파일은 다음 두 요소로 구성됩니다.\n\n* 바이너리 헤더\n\n  * 메타데이터\n  * 의존성 정보\n\n* 실제 파일 데이터\n\n  * `cpio` 아카이브 형식으로 저장\n\n즉, RPM은 단순한 압축 파일이 아니라 **패키지 관리에 필요한 정보를 함께 담은 구조**입니다.\n\n---\n\n## rpm 명령어로 패키지 상태 확인하기\n\nRPM은 저수준(low-level) 패키지 관리 도구입니다.\n의존성을 자동으로 해결하지는 않지만, 설치 상태를 정확히 조회하는 데 매우 유용합니다.\n\n```bash\nrpm -qa                # 설치된 전체 패키지 목록\nrpm -ql package_name   # 특정 패키지가 설치한 파일 목록\nrpm -qf /usr/bin/ls    # 해당 파일을 제공하는 패키지 확인\n```\n\n실무에서는 `rpm -qa | grep 패키지명` 형태로 자주 사용합니다.\n\n---\n\n## 패키지를 직접 내려받아 설치해보기\n\n공식 저장소를 사용하지 않고, RPM 파일을 직접 설치할 수도 있습니다.\n\n예를 들어 `rpmfind.net` 사이트에서 패키지를 검색한 뒤 다음과 같이 설치할 수 있습니다.\n\n```bash\nwget https://rpmfind.net/linux/centos-stream/10-stream/BaseOS/x86_64/os/Packages/zsh-5.9-15.el10.x86_64.rpm\nwget https://rpmfind.net/linux/centos-stream/10-stream/AppStream/x86_64/os/Packages/git-2.52.0-1.el10.x86_64.rpm\n\nrpm -Uvh zsh-5.9-15.el10.x86_64.rpm\nrpm -Uvh git-2.52.0-1.el10.x86_64.rpm\n```\n\n* `-U` : 업그레이드 또는 신규 설치\n* `-v` : 상세 출력\n* `-h` : 진행 상황 표시\n\n이 방식의 단점은 **의존성 패키지를 직접 해결해야 한다는 점**입니다.\n이 불편함을 해결하기 위해 등장한 것이 `yum`과 `dnf`입니다.\n\n---\n\n## rpm 패키지 삭제\n\n```bash\nrpm -e 패키지명\n```\n\n의존성 검사는 수행하지 않으므로, 시스템 패키지를 제거할 때는 주의가 필요합니다.\n\n---\n\n## 의존성 문제와 패키지 매니저의 역할\n\nRPM 자체는 의존성을 기록하지만, 자동으로 해결해주지는 않습니다.\n이 문제를 해결하기 위해 등장한 고수준(high-level) 도구가 바로 **yum / dnf** 입니다.\n\n이 도구들은 다음을 담당합니다.\n\n* 의존성 자동 해결\n* 저장소(repository) 기반 패키지 관리\n* 업데이트 이력 관리\n\n---\n\n## YUM \u0026 DNF 주요 명령어\n\n```bash\ndnf search keyword        # 패키지 검색\ndnf install package       # 설치 또는 업데이트\ndnf remove package        # 제거\ndnf repolist              # 활성화된 저장소 목록\ndnf grouplist             # 패키지 그룹 목록\ndnf groupinstall \"Group\"  # 그룹 설치\ndnf history               # 트랜잭션 이력\ndnf history info 13       # 특정 트랜잭션 상세\ndnf undo 13               # 트랜잭션 되돌리기\n```\n\n`dnf history` 기능은 시스템 변경 이력을 추적할 수 있어 운영 환경에서 특히 중요합니다.\n\n---\n\n## Repository 개념 이해하기\n\nRepository는 **패키지를 모아둔 저장소**입니다.\n`dnf`는 이 저장소 정보를 기반으로 패키지를 검색하고 내려받습니다.\n\n### 저장소 설정 파일 예시\n\n`/etc/yum.repos.d/rocky.repo`\n\n```ini\n[appstream]\nname=Rocky Linux $releasever - AppStream\nmirrorlist=https://mirrors.rockylinux.org/mirrorlist?arch=$basearch\u0026repo=AppStream-$releasever$rltype\ngpgcheck=1\nenabled=1\nmetadata_expire=6h\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-10\n```\n\n각 항목은 저장소의 위치, 보안 검증 여부, 활성화 상태를 정의합니다.\n\n---\n\n## EPEL 저장소\n\nEPEL(Extra Packages for Enterprise Linux)은 RHEL 계열에서 기본 저장소에 포함되지 않은 패키지를 제공합니다.\n\n```bash\ndnf install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm\n```\n\n서버 환경에서 자주 사용하는 유틸리티들이 다수 포함되어 있습니다.\n\n---\n\n## 폐쇄망 환경에서 Repository 구성하기\n\n외부 인터넷이 차단된 환경에서는 자체 저장소 구성이 필요합니다.\n\n### 기본 흐름\n\n```bash\ncp *.rpm /src/repository\ncreaterepo /src/repository\n```\n\n`createrepo`는 RPM 메타데이터를 생성하여 저장소로 인식할 수 있게 합니다.\n\n### 저장소 등록\n\n```bash\ndnf config-manager --add-repo http://server1.example.com/RHEL8\n```\n\n```ini\n[server1.example.com_RHEL8]\nname=created by dnf config-manager from http://server1.example.com/RHEL8\nbaseurl=http://server1.example.com/RHEL8\nenabled=1\ngpgcheck=0\n```\n\n이 방식은 폐쇄망, 내부 테스트 환경, 보안망 구성 시 자주 사용됩니다.\n\n---\n\n## 마무리\n\n패키지 관리 시스템은 리눅스 운영의 핵심 요소입니다.\n단순히 설치 명령어를 외우는 것보다, **왜 이런 구조가 되었는지**를 이해하는 것이 중요합니다.\n\n이번 글에서는 RPM 기반 시스템을 중심으로 패키지 설치와 업데이트 흐름을 정리했습니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #rpm\",\"title\":\"#rpm\",\"desc\":\"\\\"rpm\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-14-linux-package-management-rpm-dnf\"],\"slugPath\":\"linux/rocky-linux-series-14-linux-package-management-rpm-dnf\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-14-linux-package-management-rpm-dnf.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #14 – 소프트웨어 패키지 설치와 업데이트 (RPM · DNF · Repository)\",\"slug\":\"rocky-linux-series-14-linux-package-management-rpm-dnf\",\"description\":\"리눅스에서 소프트웨어를 설치하고 업데이트하는 방식은 배포판마다 다릅니다. 이 글에서는 RPM 기반 리눅스를 중심으로 패키지 관리의 배경부터 rpm, dnf 명령어, repository 구조, EPEL과 폐쇄망 저장소 구성까지 정리합니다.\",\"date\":\"2026-01-28 21:38\",\"tags\":[\"linux\",\"rocky\",\"package\",\"management\",\"rpm\",\"dnf\",\"yum\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/rocky-linux-series-14-linux-package-management-rpm-dnf/og/1769604188311-image.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/rpm\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/tags/termux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"android\",\"href\":\"/tags/android\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky\",\"href\":\"/tags/rocky\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"network\",\"href\":\"/tags/network\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"systemd\",\"href\":\"/tags/systemd\",\"a
