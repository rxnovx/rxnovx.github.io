 **systemd가 PID 1** 역할을 수행합니다.\n\n이 차이를 이해하는 것이 매우 중요합니다.\n\n---\n\n## systemd 핵심 개념: Unit과 Target\n\nsystemd를 이해하려면 두 가지 용어가 핵심입니다.\n\n### Unit\n\nsystemd가 관리하는 모든 객체를 **Unit**이라고 부릅니다.\n\n대표적인 유형은 다음과 같습니다.\n\n* service : 서비스\n* target : 상태 묶음\n* mount : 마운트 포인트\n* socket : 소켓 기반 활성화\n* timer : 스케줄링\n\n### Target\n\nTarget은 **여러 Unit의 묶음**입니다.\n\n과거 SysV init의 Runlevel에 해당하는 개념입니다.\n\n---\n\n## Runlevel과 Target의 관계\n\nSysV init 시절의 Runlevel은 다음과 같았습니다.\n\n* 0 : 종료\n* 1 : 싱글 유저 모드 (Rescue)\n* 3 : 텍스트 모드 (멀티 유저)\n* 5 : GUI 모드\n\nsystemd에서는 이를 Target으로 대응시킵니다.\n\n* runlevel 3 → multi-user.target\n* runlevel 5 → graphical.target\n\n내부적으로는 여전히 Runlevel 개념이 남아 있지만,\n**운영 관점에서는 Target만 사용**하는 것이 맞습니다.\n\n---\n\n## 기본 Target 확인 및 변경\n\n```bash\nsystemctl get-default\n```\n\n기본 부팅 Target을 확인합니다.\n\n```bash\nsystemctl set-default graphical.target\n```\n\n다음 부팅부터 GUI 모드로 시작합니다.\n\n```bash\nsystemctl set-default multi-user.target\n```\n\n서버 환경에서 주로 사용하는 설정입니다.\n\n---\n\n## 일시적인 Target 변경 (isolate)\n\n```bash\nsystemctl isolate multi-user.target\n```\n\n현재 세션에서만 Target을 전환합니다.\n재부팅하면 원래 설정으로 돌아옵니다.\n\n운영 중 테스트할 때 매우 유용합니다.\n\n---\n\n## 현재 Runlevel 확인\n\n```bash\nwho -r\n```\n\nsystemd 환경에서도 호환을 위해 제공되는 명령입니다.\n\n---\n\n## 싱글 유저 모드와 암호 복구\n\n부팅 문제 해결에서 가장 많이 사용되는 기술 중 하나입니다.\n\n### RHEL 7 ~ 9 방식 (rd.break)\n\n1. 부팅 시 GRUB 메뉴에서 커널 선택\n2. `e` 입력\n3. linux 라인 끝에 `rd.break` 추가\n4. Ctrl + x 부팅\n5. `/sysroot`로 진입\n\n```bash\nchroot /sysroot\nmount -o rw,remount /sysroot\npasswd root\ntouch /.autorelabel\nexit\nexit\n```\n\nSELinux 환경에서는 **/.autorelabel**이 매우 중요합니다.\n\n---\n\n### RHEL 10 방식 (init=/bin/bash)\n\n1. GRUB에서 커널 선택 후 `e`\n2. linux 라인 끝에 `init=/bin/bash` 추가\n3. Ctrl + x\n\n```bash\nmount -o rw,remount /\npasswd root\ntouch /.autorelabel\nexec /sbin/init\n```\n\ninit을 다시 실행해야 정상 부팅으로 이어집니다.\n\n---\n\n## 서비스와 부팅의 관계\n\n### SysV init 시절\n\n* 서비스 스크립트 직접 실행\n* service 명령어 사용\n* ntsysv, setup 등\n\n### systemd 환경\n\n시스템과 서비스를 통합 관리합니다.\n\n```bash\nsystemctl start httpd\nsystemctl stop httpd\nsystemctl restart httpd\n```\n\n### 자동 시작 설정\n\n```bash\nsystemctl enable httpd\nsystemctl disable httpd\nsystemctl mask httpd\nsystemctl unmask httpd\n```\n\nmask는 실무에서 매우 강력한 차단 수단입니다.\n\n---\n\n## GRUB 2와 커널 파라미터\n\nGRUB 2는 커널과 initramfs를 메모리에 로드하는 역할을 합니다.\n\n### 커널 옵션 확인\n\n```bash\ncat /proc/cmdline\n```\n\n실제로 적용된 옵션을 확인할 수 있습니다.\n\n---\n\n## RHEL 9 이상: grubby 사용\n\n```bash\ngrubby --info=ALL\ngrubby --default-index\ngrubby --set-default-index=0\n```\n\n### 커널 옵션 추가\n\n```bash\ngrubby --update-kernel=ALL --args=\"rhgb quiet ipv6.disable=1\"\n```\n\n### 옵션 제거\n\n```bash\ngrubby --update-kernel=1 --remove-args=\"rhgb quiet\"\n```\n\n---\n\n## 부트로더 암호 설정\n\n```bash\ngrub2-set-password\n```\n\n직접 grub.cfg를 수정하지 않는 것이 원칙입니다.\n\n---\n\n## initramfs (초기 램 파일시스템)\n\ninitramfs는 **커널이 루트 파일시스템을 마운트하기 전까지 사용하는 임시 환경**입니다.\n\n* 스토리지 드라이버\n* 파일시스템 모듈\n* LVM, RAID, 암호화 지원\n\n레스큐 커널의 initramfs가 더 큰 이유는,\n더 많은 하드웨어와 파일시스템을 지원하기 위해서입니다.\n\n```bash\ndr\n\ndracut --regenerate-all\n```\n\n---\n\n## systemd 부팅 순서\n\n* local-fs.target\n* sysinit.target\n* basic.target\n* multi-user.target\n* graphical.target\n\n```bash\nsystemctl list-dependencies graphical.target\n```\n\n부팅 문제 분석에 매우 유용합니다.\n\n---\n\n## rc.local의 현재 위치\n\n```bash\n/etc/rc.d/rc.local\n```\n\n호환성 목적입니다.\nsystemd 서비스로 대체하는 것이 권장됩니다.\n\n---\n\n## 마무리\n\n부팅은 리눅스의 모든 것의 시작입니다.\n\n부팅 과정을 이해하면,\n\n* 시스템 장애 복구\n* 서비스 문제 추적\n* 보안 사고 대응\n\n까지 훨씬 수월해집니다.\n"])</script><script>self.__next_f.push([1,"12:[\"$\",\"$L1b\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #user\",\"title\":\"#user\",\"desc\":\"\\\"user\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-19-control-and-troubleshoot-linux-boot-process\"],\"slugPath\":\"linux/rocky-linux-series-19-control-and-troubleshoot-linux-boot-process\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-19-control-and-troubleshoot-linux-boot-process.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #19 – 부팅 과정 제어와 문제 해결 (RHEL / systemd 기준)\",\"slug\":\"rocky-linux-series-19-control-and-troubleshoot-linux-boot-process\",\"description\":\"RHEL 기반 리눅스 시스템의 부팅 과정을 systemd 중심으로 정리합니다. Runlevel과 Target의 관계, GRUB2 설정, 싱글 유저 모드 진입, root 암호 복구, initramfs와 부팅 순서까지 실제 장애 상황에서 바로 활용할 수 있도록 설명합니다.\",\"date\":\"2026-01-30 19:27\",\"tags\":[\"linux\",\"boot\",\"process\",\"rhel\",\"systemd\",\"target\",\"runlevel\",\"grub2\",\"configuration\",\"grubby\",\"single\",\"user\",\"mode\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/linux-series-19-control-and-troubleshoot-linux-boot-process/og/1769776365273-image.webp\",\"draft\":false},\"content\":\"$1c\"}],\"basePath\":\"/tags/user\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"linux\",\"href\":\"/tags/linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky-linux\",\"href\":\"/tags/rocky-linux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rhel\",\"href\":\"/tags/rhel\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"termux\",\"href\":\"/tags/termux\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"android\",\"href\":\"/tags/android\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"rocky\",\"href\":\"/tags/rocky\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"network\",\"href\":\"/tags/network\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"systemd\",\"href\":\"/tags/systemd\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"system\",\"href\":\"/tags/system\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"linux-basics\",\"href\":\"/tags/linux-basics\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"code-server\",\"href\":\"/tags/code-server\",\"active\":false,\"prefix\":\"#\"},{\"label\":\"vscode\",\"href\":\"/tags/vscode\",\"active\":false,\"prefix\":\"#\"}]}]\n"])</script><script>self.__next_f.push([1,"18:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n
