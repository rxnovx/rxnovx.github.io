 | grep 'very$'\n\n# [. 기호]\n# r + 임의의 문자 2개 + t 형태를 검색합니다.\ngrep 'r..t' /etc/passwd\n\n# [^, [] 기호]\n# s로 시작하고 다음 문자가 y 또는 h인 행을 검색합니다.\ngrep '^s[yh]' /etc/passwd\n\n# [*, +, ? 기호 예시]\n# 실제 grep 예시는 데이터 특성상 생략합니다.\n\n# vim 내부에서 검색\n# vim에서는 특수문자 사용 시 \\를 붙여야 합니다.\n/o*ve\n/o\\+ve\n/o\\?ve\n```\n"])</script><script>self.__next_f.push([1,"1e:T1a0d,"])</script><script>self.__next_f.push([1,"[[toc]]\n\n---\n\n## 들어가기\n\n리눅스 시스템에서 파일과 디렉토리를 생성하고 삭제하고 수정하는 방법에 대해 정리했습니다.\n윈도우 시스템을 사용해봤다면 크게 낯설지는 않을 것입니다.\n폴더와 파일이라는 개념 자체는 거의 같습니다.\n\n---\n\n## 파일시스템이란?\n\n파일시스템은 데이터를 저장하고 관리하기 위한 구조를 말합니다.\n윈도우, 유닉스, 리눅스 등 대부분의 운영체제에서 공통으로 사용되는 개념입니다.\n\n파일의 크기가 크고 개수가 적은지,\n파일의 크기가 작고 개수가 많은지에 따라\n적합한 파일시스템이 달라집니다.\n\n대표적으로 윈도우에서는 NTFS를 사용합니다.\n과거에는 FAT32도 많이 사용되었습니다.\n\n리눅스에서는 ext4와 같은 전용 파일시스템을 주로 사용하며,\n필요에 따라 FAT32와 같은 파일시스템도 지원합니다.\n\n---\n\n## 유닉스/리눅스에서의 파일 구조 특징\n\n유닉스/리눅스에서의 파일 구조 특징은 아래와 같습니다.\n\n* singly rooted (최상단 디렉토리)\n  : 하나의 루트(/) 디렉토리를 기준으로 모든 디렉토리가 구성됨\n\n* cAsE SensiTiviTY\n  : 파일 이름에서 대소문자를 명확하게 구분함\n\n* long file names\n  : 긴 파일 이름을 지원함\n\n* supports links\n  : 링크 기능을 지원함 (하드 링크, 심볼릭 링크)\n\n* timestamps various file operations\n  : 파일에 대해 여러 종류의 시간 정보(생성, 수정, 접근 등)를 관리함\n\n---\n\n## 파일시스템을 탐색하는 방법\n\n리눅스는 윈도우와 마찬가지로 트리 구조의 파일 구조를 가지고 있습니다.\n이러한 트리 구조에서는 경로가 중요합니다.\n\n경로에는 두 가지 종류가 있으며,\n절대경로와 상대경로로 나뉩니다.\n\n또한 원하는 디렉토리로 이동하기 위한 명령어도 필요합니다.\n아래에서 각각 살펴보겠습니다.\n\n---\n\n### 절대경로\n\n절대경로는 최상위 경로(/)부터 시작하여 특정 위치를 가리키는 경로를 말합니다.\n\n```bash\n# 현재 위치한 곳은 홈 디렉토리\n# package.json 파일을 열고자 할 때\nvi /home/user/workspace/project1/package.json\n```\n\n---\n\n### 상대경로\n\n상대경로는 현재 내가 위치한 디렉토리를 기준으로 경로를 지정하는 방식입니다.\n\n```bash\n# 현재 위치한 곳은 홈 디렉토리\n# package.json 파일을 열고자 할 때\nvi workspace/project1/package.json\n```\n\n---\n\n### 트리 구조 안에서 원하는 디렉토리로 이동하는 명령어 cd\n\ncd(change directory) 명령어는 트리 구조 안에서 원하는 디렉토리로 이동하는 명령어입니다.\n인수로 경로를 입력받습니다.\n\n현재 위치한 경로를 확인하기 위해서는 pwd 명령어를 사용합니다.\n\n```bash\ncd ~    # ~ (tilde)는 home directory를 의미함\npwd\n/home/user\n```\n### 디렉토리 내부 파일 목록을 출력해주는 명령어 ls\n\n현재 위치한 디렉토리 또는 특정 디렉토리 내부에 어떤 파일과 디렉토리가 있는지 확인하는 명령어입니다.\n\nls 명령어는 리눅스에서 가장 자주 사용하는 기본 명령어 중 하나입니다.\n옵션 없이 실행하면 현재 디렉토리의 파일과 디렉토리 이름만 출력합니다.\n\n```bash\nls\n```\n\n특정 디렉토리의 내용을 확인하고 싶다면 경로를 인수로 전달합니다.\n\n```bash\nls /etc\n```\n\n옵션을 사용하면 출력 형태를 변경할 수 있습니다.\n\n```bash\nls [옵션] [디렉토리]\n```\n\n자주 사용하는 옵션은 다음과 같습니다.\n\n* -l : 파일의 상세 정보를 함께 출력\n* -a : 숨김 파일을 포함하여 출력\n\n```bash\n# 상세 정보 출력\nls -l\n\n# 숨김 파일 포함\nls -a\n\n# 상세 정보 + 숨김 파일\nls -la\n```\n\nls -l 옵션을 사용하면 파일의 권한, 소유자, 크기, 수정 시간 등을 함께 확인할 수 있습니다.\n이 출력 결과는 파일 권한과 소유권을 이해하는 데 자주 활용됩니다.\n\nls 명령어는 단독으로도 많이 사용되지만,\ncd, pwd와 함께 디렉토리 이동과 탐색 과정에서 자연스럽게 사용됩니다.\n\n추가로 ls는 리눅스를 사용하면서 가장 많이 사용되는 명령어 입니다.\n\n---\n\n## 디렉토리 조작 관련 명령어\n\n디렉토리를 조작하기 위한 명령어를 알아보겠습니다.\n디렉토리를 생성하거나 삭제하는 명령어입니다.\n\n* **mkdir** : 디렉토리 생성\n\n  * `-m` : 생성 시 퍼미션 지정\n  * `-p` : 상위 디렉토리까지 함께 생성\n\n* **rmdir** : 빈 디렉토리 삭제\n\n  * `-p` : 상위 디렉토리까지 함께 삭제 (비어 있을 경우)\n\n---\n\n## 파일 조작 관련 명령어\n\n파일을 조작하는 명령어에 대해 알아보겠습니다.\n파일을 복사하거나 이동하는 명령어입니다.\n\n* **cp** : 파일/디렉토리 복사\n\n  * 여러 파일 복사 가능: `cp a b c .`\n  * `-i` : 덮어쓰기 전 확인 (alias 권장)\n  * `-r`, `-R` : 디렉토리 전체 복사\n\n* **mv** : 파일/디렉토리 이동 및 이름 변경\n\n  * `-i` : 덮어쓰기 전 확인 (alias 권장)\n  * 디렉토리는 옵션 없이 이동 가능\n\n---\n\n\n## 삭제 및 파일 생성 명령어\n\n* **rm** : 파일/디렉토리 삭제\n\n  * `-i` : 삭제 전 확인\n  * `-f` : 강제 삭제\n  * `-r`, `-R` : 디렉토리 재귀 삭제\n\n* **touch** : 빈 파일 생성 / 타임스탬프 변경\n\n  * 파일 존재 여부로 동작을 제어할 때 활용\n  * 예: `/etc/nologin` → 일반 사용자 로그인 차단\n\n---\n\n\u003e [!TIP] TIP : Alias\n\u003e 자주 쓰는 옵션을 기본 동작으로 설정하는 기능으로\n\u003e cp나 rm, mv 명령어를 쓸 때 파일을 덮어쓸 경우 -i 옵션을 주지 않아도 항상 주도록\n\u003e Alias를 설정해두면 파일이 덮어써지거나 삭제되는 것을 방지할 수 있음.\n\u003e ``` bash\n\u003e 예: `alias cp='cp -i'`, `alias mv='mv -i'`\n\u003e ```\n\u003e `.bashrc`에 정의하면 로그인 후에도 유지됨\n\n  \n---\n\n## 바로가기 만들기 : 파일 링크 생성\n\n* **ln** : 링크 생성\n\n  * 하드링크 : 같은 파일에 이름만 하나 더 추가\n\n    * 다른 디스크(파일시스템) 간 생성 불가\n  * 소프트링크(`-s`) : 경로를 가리키는 링크\n\n    * 디스크가 달라도 생성 가능\n\n---\n\n## 마치면서\n\n리눅스에서 기본적으로 파일이나 디렉토리를 탐색할 때 사용하는 명령어에 대해 정리해보았습니다.\n다음 포스트에서는 터미널에서 각종 정보를 얻거나 명령어에 대한 메뉴얼을 확인하는 방법에 대해서 정리하겠습니다.\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L1c\",null,{\"typeLabel\":\"TAG\",\"breadcrumb\":\"tags › #linux-command\",\"title\":\"#linux-command\",\"desc\":\"\\\"linux-command\\\" 태그가 붙은 글 모음\",\"posts\":[{\"slug\":[\"linux\",\"rocky-linux-series-6-grep-and-regular-expressions\"],\"slugPath\":\"linux/rocky-linux-series-6-grep-and-regular-expressions\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-6-grep-and-regular-expressions.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #6 - 리눅스 grep과 정규표현식 기초 정리\",\"slug\":\"rocky-linux-series-6-grep-and-regular-expressions\",\"description\":\"리눅스에서 grep 명령어와 기본 정규표현식을 사용해 원하는 문자열을 효율적으로 검색하는 방법을 정리한 글입니다.\",\"date\":\"2026-01-26 20:43\",\"tags\":[\"linux\",\"grep\",\"정규표현식\",\"regex\",\"linux-command\",\"text-processing\",\"rocky-linux\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/rocky-linux-series-6-grep-and-regular-expressions/og/1769518297888-image.webp\",\"draft\":false},\"content\":\"$1d\"},{\"slug\":[\"linux\",\"rocky-linux-series-3-file-directory-commands\"],\"slugPath\":\"linux/rocky-linux-series-3-file-directory-commands\",\"filePath\":\"/data/data/com.termux/files/home/workspace/rxnovx.github.io-origin/src/_posts/linux/rocky-linux-series-3-file-directory-commands.md\",\"frontmatter\":{\"title\":\"리눅스 배우기 #3 - 파일과 디렉토리 다루기\",\"slug\":\"rocky-linux-series-3-file-directory-commands\",\"description\":\"파일과 디렉토리를 이동하고 확인하는 기본 명령어들을 정리했습니다.\\n리눅스 환경에서 작업 흐름을 익히는 과정입니다.\",\"date\":\"2026-01-24 21:01\",\"tags\":[\"linux\",\"rocky-linux\",\"linux-basics\",\"filesystem\",\"command-line\",\"linux-command\",\"rocky-linux-series\"],\"category\":\"linux\",\"cover\":\"/images/_posts/linux/rocky-linux-series-3-file-directory-commands/og/1769517000649-image.webp\",\"draft\":false},\"content\":\"$1e\"}],\"basePath\":\"/tags/linux-command\",\"emptyHref\":\"/tags\",\"emptyLabel\":\"태그 전체 보기\",\"relatedFilters\":[{\"label\":\"lin
